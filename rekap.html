<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gabku App – Rekap Presensi</title>

  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />
</head>
<body>

  <div class="app">

    <!-- HEADER (selaras dengan anggota.html) -->
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html" aria-label="Kembali" title="Kembali">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z"/>
            </svg>
          </a>

          <div class="header-text">
            <div class="app-name">Rekap Presensi</div>
            <div class="app-subtitle">Ringkasan bulanan & per anggota</div>
          </div>
        </div>

        <button class="btn-ghost" id="refreshBtn" type="button" aria-label="Refresh" title="Refresh">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor"
              d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 1 1-9.58-2H5.26A7 7 0 1 0 12 6z"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="app-main">

      <!-- CARD: Tabs + Catatan -->
      <section class="section-card" style="margin-top:0;">
        <div class="section-title">Mode Rekap</div>

        <div class="segmented" role="tablist" aria-label="Tab Rekap">
          <button id="tabMonthly" class="seg-btn active" type="button" role="tab" aria-selected="true">
            Rekap Bulanan
          </button>
          <button id="tabMember" class="seg-btn" type="button" role="tab" aria-selected="false">
            Rekap Anggota
          </button>
        </div>

        <div class="info-note">
          <div class="info-icon" aria-hidden="true">i</div>
          <div class="info-text">
            Catatan: rekap hanya menghitung sesi yang sudah punya PDF (final).
          </div>
        </div>
      </section>

      <!-- PANEL: Monthly -->
      <section class="section-card" id="panelMonthly">
        <div class="row-between">
          <div class="section-title" style="margin:0;">Rekap Bulanan</div>
          <span class="pill" id="monthlyPill" style="display:none;"></span>
        </div>

        <label class="field-label" for="monthSel">Bulan</label>
        <select id="monthSel" class="field"></select>

        <div class="row-actions">
          <button id="loadMonthlyBtn" class="btn-primary" type="button">Muat Rekap</button>
          <button id="exportCsvBtn" class="btn-secondary" type="button">Export CSV</button>
        </div>

        <p id="monthlyMsg" class="tool-msg"></p>

        <div id="monthlySummary" class="mt-2"></div>
        <div id="monthlyTableWrap" class="mt-2"></div>
        <div id="monthlySessionsWrap" class="mt-2"></div>
      </section>

      <!-- PANEL: Member -->
      <section class="section-card" id="panelMember" style="display:none;">
        <div class="row-between">
          <div class="section-title" style="margin:0;">Rekap Anggota</div>
          <span class="pill" id="memberPill" style="display:none;"></span>
        </div>

        <label class="field-label" for="memberSel">Anggota</label>
        <select id="memberSel" class="field"></select>

        <label class="field-label" for="memberMonthSel">Bulan</label>
        <select id="memberMonthSel" class="field"></select>

        <div class="row-actions">
          <button id="loadMemberBtn" class="btn-primary" type="button">Muat Rekap</button>
          <button id="exportMemberCsvBtn" class="btn-secondary" type="button">Export CSV</button>
        </div>

        <p id="memberMsg" class="tool-msg"></p>

        <div id="memberSummary" class="mt-2"></div>
        <div id="memberHistoryWrap" class="mt-2"></div>
      </section>

    </main>
  </div>

  <!-- SCRIPTS (LOGIKA TIDAK DIUBAH) -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>

  <script>
    requireLogin();

    const tabMonthly = document.getElementById('tabMonthly');
    const tabMember = document.getElementById('tabMember');
    const panelMonthly = document.getElementById('panelMonthly');
    const panelMember = document.getElementById('panelMember');

    const monthSel = document.getElementById('monthSel');
    const memberMonthSel = document.getElementById('memberMonthSel');
    const memberSel = document.getElementById('memberSel');

    const monthlyMsg = document.getElementById('monthlyMsg');
    const monthlySummary = document.getElementById('monthlySummary');
    const monthlyTableWrap = document.getElementById('monthlyTableWrap');
    const monthlySessionsWrap = document.getElementById('monthlySessionsWrap');

    const memberMsg = document.getElementById('memberMsg');
    const memberSummary = document.getElementById('memberSummary');
    const memberHistoryWrap = document.getElementById('memberHistoryWrap');

    const exportCsvBtn = document.getElementById('exportCsvBtn');
    const exportMemberCsvBtn = document.getElementById('exportMemberCsvBtn');

    const monthlyPill = document.getElementById('monthlyPill');
    const memberPill = document.getElementById('memberPill');

    let lastMonthly = null;
    let lastMember = null;
    let activeTab = 'monthly';

    function escapeHtml(s){
      return String(s)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function setActiveTab(which){
      activeTab = which;

      if (which === 'monthly'){
        panelMonthly.style.display = 'block';
        panelMember.style.display = 'none';

        tabMonthly.classList.add('active');
        tabMember.classList.remove('active');
        tabMonthly.setAttribute('aria-selected','true');
        tabMember.setAttribute('aria-selected','false');
      } else {
        panelMonthly.style.display = 'none';
        panelMember.style.display = 'block';

        tabMember.classList.add('active');
        tabMonthly.classList.remove('active');
        tabMember.setAttribute('aria-selected','true');
        tabMonthly.setAttribute('aria-selected','false');
      }
    }

    tabMonthly.addEventListener('click', ()=> setActiveTab('monthly'));
    tabMember.addEventListener('click', ()=> setActiveTab('member'));

    function mkLabel(monthKey){
      // monthKey format: YYYY-MM
      const parts = String(monthKey||'').split('-');
      if (parts.length !== 2) return monthKey;
      const y = parts[0];
      const m = parseInt(parts[1], 10);
      const nama = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][m-1] || parts[1];
      return nama + ' ' + y;
    }

    function downloadText(filename, text){
      const blob = new Blob([text], {type: 'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function toCsv(rows){
      // rows: array of array
      return rows.map(r => r.map(cell => {
        const s = String(cell ?? '');
        const needsQuote = /[\",\n]/.test(s);
        const out = s.replaceAll('"','""');
        return needsQuote ? '"' + out + '"' : out;
      }).join(',')).join('\n');
    }

    function renderMonthly(data){
      lastMonthly = data;
      monthlySummary.innerHTML = '';
      monthlyTableWrap.innerHTML = '';
      monthlySessionsWrap.innerHTML = '';

      // pill kecil
      monthlyPill.style.display = 'inline-flex';
      monthlyPill.textContent = mkLabel(data.month || '');

      const s = data.summary || {};
      monthlySummary.innerHTML = `
        <div class="soft-card">
          <div class="soft-head">
            <div class="soft-title">Ringkasan</div>
            <div class="soft-sub">${escapeHtml(mkLabel(data.month))}</div>
          </div>

          <div class="kv-grid">
            <div class="kv"><span>Total sesi</span><b>${escapeHtml(s.total_sesi ?? '-')}</b></div>
            <div class="kv"><span>Total records</span><b>${escapeHtml(s.total_records ?? '-')}</b></div>
            <div class="kv"><span>Hadir</span><b>${escapeHtml(s.hadir ?? 0)}</b></div>
            <div class="kv"><span>Izin</span><b>${escapeHtml(s.izin ?? 0)}</b></div>
            <div class="kv"><span>Sakit</span><b>${escapeHtml(s.sakit ?? 0)}</b></div>
            <div class="kv"><span>Tanpa ket.</span><b>${escapeHtml(s.tanpa_keterangan ?? 0)}</b></div>
          </div>
        </div>
      `;

      const rows = data.by_member || [];
      if (!rows.length){
        monthlyTableWrap.innerHTML = '<p class="muted">Belum ada data rekap.</p>';
        return;
      }

      const wrap = document.createElement('div');
      wrap.className = 'soft-card';
      wrap.innerHTML = `
        <div class="soft-head">
          <div class="soft-title">Rekap per Anggota</div>
          <div class="soft-sub">${escapeHtml(rows.length)} orang</div>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>Nama</th>
                <th>Jabatan</th>
                <th class="tc">H</th>
                <th class="tc">I</th>
                <th class="tc">S</th>
                <th class="tc">TK</th>
                <th class="tc">Total</th>
                <th class="tc">%H</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      `;

      const tbody = wrap.querySelector('tbody');
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="td-strong">${escapeHtml(r.name || '')}</td>
          <td class="td-muted">${escapeHtml(r.role || '')}</td>
          <td class="tc">${escapeHtml(r.hadir ?? 0)}</td>
          <td class="tc">${escapeHtml(r.izin ?? 0)}</td>
          <td class="tc">${escapeHtml(r.sakit ?? 0)}</td>
          <td class="tc">${escapeHtml(r.tanpa_keterangan ?? 0)}</td>
          <td class="tc">${escapeHtml(r.total ?? 0)}</td>
          <td class="tc">${escapeHtml(r.persen_hadir ?? 0)}</td>
        `;
        tbody.appendChild(tr);
      });

      monthlyTableWrap.appendChild(wrap);

      // list sesi + link PDF
      const sessions = data.sessions || [];
      if (sessions.length){
        const sesWrap = document.createElement('div');
        sesWrap.className = 'soft-card';
        sesWrap.innerHTML = `
          <div class="soft-head">
            <div class="soft-title">Daftar Sesi</div>
            <div class="soft-sub">${escapeHtml(sessions.length)} sesi</div>
          </div>
          <div id="sesList"></div>
        `;

        const list = document.createElement('div');
        list.className = 'mini-list';

        sessions.forEach(ses => {
          const label = `${ses.activity_name || ''} (${String(ses.date || '').slice(0,10)})`;
          const href = ses.pdf_url || (ses.pdf_fileId ? `https://drive.google.com/file/d/${ses.pdf_fileId}/view` : '');

          const item = document.createElement('div');
          item.className = 'mini-item';
          item.innerHTML = `
            <div class="mini-left">
              <div class="mini-title">${escapeHtml(label)}</div>
              <div class="mini-sub">${href ? 'PDF tersedia' : 'Belum ada PDF'}</div>
            </div>
            <div class="mini-right">
              ${href ? `<a class="link-pill" target="_blank" href="${escapeHtml(href)}">PDF</a>` : `<span class="link-pill ghost">—</span>`}
            </div>
          `;
          list.appendChild(item);
        });

        sesWrap.querySelector('#sesList').appendChild(list);
        monthlySessionsWrap.appendChild(sesWrap);
      }
    }

    function renderMember(data){
      lastMember = data;
      memberSummary.innerHTML = '';
      memberHistoryWrap.innerHTML = '';

      const m = data.member || {};
      const s = data.summary || {};

      // pill kecil
      memberPill.style.display = 'inline-flex';
      memberPill.textContent = mkLabel(data.month || '');

      memberSummary.innerHTML = `
        <div class="soft-card">
          <div class="soft-head">
            <div class="soft-title">Ringkasan Anggota</div>
            <div class="soft-sub">${escapeHtml(mkLabel(data.month))}</div>
          </div>

          <div class="member-line">
            <div class="member-name">${escapeHtml(m.name || '')}</div>
            <div class="member-role">${escapeHtml(m.role || '')}</div>
          </div>

          <div class="kv-grid">
            <div class="kv"><span>Hadir</span><b>${escapeHtml(s.hadir ?? 0)}</b></div>
            <div class="kv"><span>Izin</span><b>${escapeHtml(s.izin ?? 0)}</b></div>
            <div class="kv"><span>Sakit</span><b>${escapeHtml(s.sakit ?? 0)}</b></div>
            <div class="kv"><span>Tanpa ket.</span><b>${escapeHtml(s.tanpa_keterangan ?? 0)}</b></div>
            <div class="kv"><span>Total</span><b>${escapeHtml(s.total ?? 0)}</b></div>
            <div class="kv"><span>% Hadir</span><b>${escapeHtml(s.persen_hadir ?? 0)}</b></div>
          </div>
        </div>
      `;

      const hist = data.history || [];
      if (!hist.length){
        memberHistoryWrap.innerHTML = '<p class="muted">Belum ada riwayat.</p>';
        return;
      }

      const wrap = document.createElement('div');
      wrap.className = 'soft-card';
      wrap.innerHTML = `
        <div class="soft-head">
          <div class="soft-title">Riwayat Presensi</div>
          <div class="soft-sub">${escapeHtml(hist.length)} baris</div>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Kegiatan</th>
                <th class="tc">Status</th>
                <th class="tc">PDF</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      `;

      const tbody = wrap.querySelector('tbody');
      hist.forEach(it => {
        const href = it.pdf_url || (it.pdf_fileId ? `https://drive.google.com/file/d/${it.pdf_fileId}/view` : '');
        const status = String(it.presence || '');

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="td-muted">${escapeHtml(String(it.date || '').slice(0,10))}</td>
          <td class="td-strong">${escapeHtml(it.activity_name || '')}</td>
          <td class="tc"><span class="badge ${badgeClass(status)}">${escapeHtml(status)}</span></td>
          <td class="tc">${href ? `<a class="link-pill" target="_blank" href="${escapeHtml(href)}">PDF</a>` : `<span class="link-pill ghost">—</span>`}</td>
        `;
        tbody.appendChild(tr);
      });

      memberHistoryWrap.appendChild(wrap);
    }

    function badgeClass(status){
      const s = String(status || '').toLowerCase();
      if (s.includes('hadir')) return 'b-ok';
      if (s.includes('izin')) return 'b-warn';
      if (s.includes('sakit')) return 'b-info';
      if (s.includes('tanpa') || s.includes('alpa') || s.includes('absen')) return 'b-bad';
      return 'b-neutral';
    }

    async function loadInitial(){
      // months
      const months = await apiGet('listMonths');
      monthSel.innerHTML = months.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(mkLabel(m))}</option>`).join('');
      memberMonthSel.innerHTML = monthSel.innerHTML;

      // members
      const members = await apiGet('listMembers');
      memberSel.innerHTML = `<option value="">— pilih —</option>` +
        members.map(m => `<option value="${escapeHtml(m.member_id)}">${escapeHtml(m.name)} (${escapeHtml(m.role)})</option>`).join('');

      // default select current month if exists
      if (months && months.length){
        monthSel.value = months[0];
        memberMonthSel.value = months[0];
      }

      // auto load monthly once
      await loadMonthly();
    }

    async function loadMonthly(){
      monthlyMsg.textContent = '';
      try{
        monthlyMsg.textContent = 'Memuat...';
        monthlyPill.style.display = 'none';
        const data = await apiGet('recapMonthly', { month: monthSel.value });
        renderMonthly(data);
        monthlyMsg.textContent = '';
      }catch(e){
        monthlyMsg.textContent = 'Gagal: ' + e.message;
      }
    }

    async function loadMember(){
      memberMsg.textContent = '';
      try{
        if (!memberSel.value) { memberMsg.textContent = 'Pilih anggota dulu.'; return; }
        memberMsg.textContent = 'Memuat...';
        memberPill.style.display = 'none';
        const data = await apiGet('recapMember', { month: memberMonthSel.value, member_id: memberSel.value });
        renderMember(data);
        memberMsg.textContent = '';
      }catch(e){
        memberMsg.textContent = 'Gagal: ' + e.message;
      }
    }

    document.getElementById('loadMonthlyBtn').addEventListener('click', loadMonthly);
    document.getElementById('loadMemberBtn').addEventListener('click', loadMember);

    // Refresh button: reload sesuai tab aktif (tampilan saja, logika API tetap)
    document.getElementById('refreshBtn').addEventListener('click', async ()=>{
      if (activeTab === 'member') return loadMember();
      return loadMonthly();
    });

    exportCsvBtn.addEventListener('click', ()=>{
      if (!lastMonthly || !(lastMonthly.by_member||[]).length){
        alert('Belum ada data untuk diexport.');
        return;
      }
      const rows = [['Bulan','Nama','Jabatan','Hadir','Izin','Sakit','Tanpa Keterangan','Total','Persen Hadir']];
      (lastMonthly.by_member||[]).forEach(r => {
        rows.push([
          lastMonthly.month,
          r.name || '',
          r.role || '',
          r.hadir ?? 0,
          r.izin ?? 0,
          r.sakit ?? 0,
          r.tanpa_keterangan ?? 0,
          r.total ?? 0,
          r.persen_hadir ?? 0
        ]);
      });
      downloadText(`rekap_bulanan_${lastMonthly.month}.csv`, toCsv(rows));
    });

    exportMemberCsvBtn.addEventListener('click', ()=>{
      if (!lastMember || !(lastMember.history||[]).length){
        alert('Belum ada data untuk diexport.');
        return;
      }
      const m = lastMember.member || {};
      const rows = [['Bulan','Member ID','Nama','Jabatan','Tanggal','Kegiatan','Status','PDF']];
      (lastMember.history||[]).forEach(it => {
        rows.push([
          lastMember.month,
          m.member_id || '',
          m.name || '',
          m.role || '',
          String(it.date || '').slice(0,10),
          it.activity_name || '',
          it.presence || '',
          it.pdf_url || ''
        ]);
      });
      const safeName = (m.name || 'anggota').replaceAll(' ','_');
      downloadText(`rekap_${safeName}_${lastMember.month}.csv`, toCsv(rows));
    });

    (async function init(){
      try{
        await loadInitial();
      }catch(e){
        monthlyMsg.textContent = 'Gagal init: ' + e.message;
      }
    })();
  </script>

  <!-- CSS lokal kecil (HANYA tampilan, selaras dengan anggota.html) -->
  <style>
    /* header layout (seperti anggota.html) */
    .header-bar{
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 0 2px;
    }
    .header-left{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .header-text{ min-width: 0; }
    .app-name{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-subtitle{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .icon-back{
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.14);
      color: #fff;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      flex: 0 0 auto;
    }
    .icon-back:active{ transform: translateY(1px); }

    .btn-ghost{
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.10);
      color: #fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      flex: 0 0 auto;
    }
    .btn-ghost:active{ transform: translateY(1px); }

    /* form field (samakan feel anggota.html) */
    .field{
      width: 100%;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fff;
      outline: none;
    }
    .field:focus{
      border-color: rgba(30,136,229,.45);
      box-shadow: 0 0 0 4px rgba(30,136,229,.12);
    }
    .field-label{
      display:block;
      margin-top: 10px;
      margin-bottom: 6px;
      font-weight: 800;
      font-size: 13px;
      color: var(--text);
    }

    .row-actions{
      display:flex;
      gap:10px;
      margin-top: 12px;
    }
    .row-actions .btn-primary{
      flex: 1;
      border-radius: 14px;
      padding: 12px 14px;
      font-weight: 900;
    }
    .row-actions .btn-secondary{
      width: min(42%, 180px);
      border-radius: 14px;
      padding: 12px 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .row-between{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .pill{
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 12px;
      color: rgba(2,8,23,.7);
      background: rgba(2,8,23,.06);
      border: 1px solid rgba(2,8,23,.06);
      white-space: nowrap;
    }

    /* segmented tabs */
    .segmented{
      display:flex;
      gap: 8px;
      background: rgba(2,8,23,.04);
      border: 1px solid rgba(2,8,23,.08);
      padding: 6px;
      border-radius: 16px;
      margin-top: 10px;
    }
    .seg-btn{
      flex: 1;
      border: 0;
      cursor: pointer;
      border-radius: 12px;
      padding: 10px 10px;
      font-weight: 900;
      background: transparent;
      color: rgba(2,8,23,.72);
    }
    .seg-btn.active{
      background: #fff;
      color: var(--text);
      box-shadow: 0 10px 20px rgba(2,8,23,.08);
      border: 1px solid rgba(2,8,23,.06);
    }
    .seg-btn:active{ transform: translateY(1px); }

    /* note */
    .info-note{
      margin-top: 12px;
      display:flex;
      gap: 10px;
      align-items:flex-start;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(14,165,233,.20);
      background: rgba(14,165,233,.08);
      color: rgba(2,8,23,.85);
    }
    .info-icon{
      width: 22px;
      height: 22px;
      border-radius: 999px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(14,165,233,.22);
      border: 1px solid rgba(14,165,233,.25);
      font-weight: 900;
      font-size: 12px;
      flex: 0 0 auto;
    }
    .info-text{
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      color: rgba(2,8,23,.75);
    }

    /* soft card untuk output rekap */
    .soft-card{
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(2,8,23,.08);
      background: #fff;
      box-shadow: 0 10px 22px rgba(2,8,23,.06);
    }
    .soft-head{
      display:flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .soft-title{
      font-weight: 900;
      font-size: 14px;
    }
    .soft-sub{
      font-weight: 800;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 65%;
      text-align: right;
    }

    /* key value grid */
    .kv-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .kv{
      padding: 10px;
      border-radius: 14px;
      border: 1px solid rgba(2,8,23,.06);
      background: rgba(2,8,23,.02);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 8px;
    }
    .kv span{
      color: var(--muted);
      font-weight: 800;
      font-size: 12px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .kv b{
      font-weight: 950;
      font-size: 13px;
      color: var(--text);
    }

    .member-line{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid rgba(30,136,229,.18);
      background: rgba(30,136,229,.06);
      margin-bottom: 10px;
    }
    .member-name{
      font-weight: 950;
      font-size: 14px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .member-role{
      font-weight: 900;
      font-size: 12px;
      color: rgba(2,8,23,.70);
      white-space:nowrap;
    }

    /* table */
    .table-scroll{
      width: 100%;
      overflow:auto;
      border-radius: 14px;
      border: 1px solid rgba(2,8,23,.06);
    }
    .data-table{
      width: 100%;
      min-width: 640px;
      border-collapse: collapse;
      background:#fff;
    }
    .data-table th, .data-table td{
      padding: 10px 10px;
      border-bottom: 1px solid rgba(2,8,23,.06);
      font-size: 13px;
    }
    .data-table thead th{
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 1;
      text-align: left;
      font-weight: 950;
    }
    .data-table tr:last-child td{ border-bottom: 0; }
    .tc{ text-align:center; }
    .td-strong{ font-weight: 900; }
    .td-muted{ color: var(--muted); font-weight: 700; }

    /* mini list untuk sesi */
    .mini-list{ display:flex; flex-direction:column; gap: 10px; }
    .mini-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid rgba(2,8,23,.08);
      background: rgba(2,8,23,.02);
    }
    .mini-left{ min-width: 0; flex: 1; }
    .mini-title{
      font-weight: 900;
      font-size: 13px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .mini-sub{
      margin-top: 2px;
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .mini-right{ flex: 0 0 auto; }

    .link-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 8px 10px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 12px;
      text-decoration:none;
      color: #fff;
      background: var(--brand);
      border: 1px solid rgba(30,136,229,.22);
      white-space:nowrap;
    }
    .link-pill:active{ transform: translateY(1px); }
    .link-pill.ghost{
      color: rgba(2,8,23,.55);
      background: rgba(2,8,23,.06);
      border-color: rgba(2,8,23,.06);
    }

    /* status badge */
    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 950;
      font-size: 12px;
      border: 1px solid transparent;
      min-width: 72px;
    }
    .b-ok{
      background: rgba(16,185,129,.14);
      border-color: rgba(16,185,129,.25);
      color: rgba(2,8,23,.85);
    }
    .b-warn{
      background: rgba(245,158,11,.14);
      border-color: rgba(245,158,11,.25);
      color: rgba(2,8,23,.85);
    }
    .b-info{
      background: rgba(14,165,233,.14);
      border-color: rgba(14,165,233,.25);
      color: rgba(2,8,23,.85);
    }
    .b-bad{
      background: rgba(220,38,38,.14);
      border-color: rgba(220,38,38,.25);
      color: rgba(2,8,23,.85);
    }
    .b-neutral{
      background: rgba(2,8,23,.06);
      border-color: rgba(2,8,23,.08);
      color: rgba(2,8,23,.72);
    }

    /* mobile tweak: table tetap bisa discroll */
    @media (max-width: 420px){
      .row-actions .btn-secondary{ width: min(46%, 190px); }
      .soft-sub{ max-width: 58%; }
    }
  </style>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
