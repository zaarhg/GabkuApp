<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gabku App – Rekap Presensi</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#198cda">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html"><svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg></a>
          <div class="header-text">
            <div class="app-name">Rekap Presensi</div>
            <div class="app-subtitle">Ringkasan & Riwayat PDF</div>
          </div>
        </div>
        <button class="btn-ghost" id="refreshBtn" title="Refresh">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 1 1-9.58-2H5.26A7 7 0 1 0 12 6z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="app-main">
      <section class="section-card mt-0">
        <div class="section-title">Mode Rekap</div>
        <div class="segmented">
          <button id="tabSession" class="seg-btn active">Sesi & PDF</button>
          <button id="tabMonthly" class="seg-btn">Bulanan</button>
          <button id="tabMember" class="seg-btn">Anggota</button>
        </div>
      </section>

      <section class="section-card" id="panelSession">
        <label class="field-label">Pilih Periode</label>
        <select id="sessionMonthSel" class="field"
          onchange="document.getElementById('sessionDateWrap').style.display = this.value === 'custom' ? 'flex' : 'none'"></select>
        <div id="sessionDateWrap" class="flex gap-2 mt-2" style="display:none;">
          <div class="flex-1"><label class="field-label">Mulai</label><input type="date" id="sessionStartD"
              class="field" /></div>
          <div class="flex-1"><label class="field-label">S/d</label><input type="date" id="sessionEndD" class="field" />
          </div>
        </div>
        <label class="field-label" style="margin-top:10px;">Pilih Kegiatan</label>
        <select id="sessionActivitySel" class="field">
          <option value="">Semua Kegiatan</option>
        </select>
        <div class="row-actions mt-3">
          <button id="loadSessionBtn" class="btn-primary">Muat Riwayat Sesi</button>
        </div>
        <div id="sessionOutput" class="mt-4"></div>
      </section>

      <section class="section-card" id="panelMonthly" style="display:none;">
        <label class="field-label">Pilih Periode</label>
        <select id="monthSel" class="field"
          onchange="document.getElementById('monthlyDateWrap').style.display = this.value === 'custom' ? 'flex' : 'none'"></select>
        <div id="monthlyDateWrap" class="flex gap-2 mt-2" style="display:none;">
          <div class="flex-1"><label class="field-label">Mulai</label><input type="date" id="monthlyStartD"
              class="field" /></div>
          <div class="flex-1"><label class="field-label">S/d</label><input type="date" id="monthlyEndD" class="field" />
          </div>
        </div>
        <label class="field-label" style="margin-top:10px;">Pilih Kegiatan</label>
        <select id="monthlyActivitySel" class="field">
          <option value="">Semua Kegiatan</option>
        </select>
        <div class="row-actions mt-3">
          <button id="loadMonthlyBtn" class="btn-primary">Muat Rekap</button>
        </div>
        <div id="monthlyOutput" class="mt-4"></div>
      </section>

      <section class="section-card" id="panelMember" style="display:none;">
        <label class="field-label">Pilih Anggota</label>
        <button id="memberSelBtn" class="field text-left bg-white text-main flex justify-between items-center"
          type="button">
          <span id="memberSelText">Pilih anggota...</span>
          <span class="text-muted text-xs">▼</span>
        </button>
        <input type="hidden" id="memberSel" value="" />
        <label class="field-label">Pilih Periode</label>
        <select id="memberMonthSel" class="field"
          onchange="document.getElementById('memberDateWrap').style.display = this.value === 'custom' ? 'flex' : 'none'"></select>
        <div id="memberDateWrap" class="flex gap-2 mt-2" style="display:none;">
          <div class="flex-1"><label class="field-label">Mulai</label><input type="date" id="memberStartD"
              class="field" /></div>
          <div class="flex-1"><label class="field-label">S/d</label><input type="date" id="memberEndD" class="field" />
          </div>
        </div>
        <label class="field-label" style="margin-top:10px;">Pilih Kegiatan</label>
        <select id="memberActivitySel" class="field">
          <option value="">Semua Kegiatan</option>
        </select>
        <div class="row-actions mt-3">
          <button id="loadMemberBtn" class="btn-primary">Muat Rekap</button>
        </div>
        <div id="memberOutput" class="mt-4"></div>
      </section>

      <!-- Custom Modals -->
      <div id="customConfirm" class="modal-overlay" style="display:none;">
        <div class="modal-card text-center p-5">
          <h3 class="m-0 text-base font-bold" id="confirmTitle">Peringatan</h3>
          <p id="confirmMsg" class="text-sm text-muted mb-4 mt-2"></p>
          <div class="flex justify-center gap-2">
            <button id="confirmBtnNo" class="btn-secondary py-2 px-4">Batal</button>
            <button id="confirmBtnYes" class="btn-primary py-2 px-4">Ya, Lanjutkan</button>
          </div>
        </div>
      </div>

      <!-- Member Picker Modal -->
      <div id="memberPickerModal">
        <div class="picker-box">
          <div class="picker-title">Pilih Anggota</div>
          <input id="rekapPickerSearch" placeholder="Cari nama anggota…" oninput="filterRekapPicker(this.value)">
          <div class="picker-list" id="rekapPickerList"></div>
          <div class="picker-actions mt-3 pt-3" style="border-top: 1px solid #e2e8f0;">
            <button class="btn-secondary"
              style="width: 100%; height: 44px; background: #fee2e2 !important; color: #dc2626 !important; border: 1px solid #fecaca !important; font-weight: 800; border-radius: 10px; cursor: pointer; display: block;"
              onclick="closeRekapPicker()">Batal</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/rekap.js"></script>
</body>

</html>
