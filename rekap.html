<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gabku App – Rekap Presensi</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html"><svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg></a>
          <div class="header-text">
            <div class="app-name">Rekap Presensi</div>
            <div class="app-subtitle">Ringkasan bulanan & anggota</div>
          </div>
        </div>
        <button class="btn-ghost" id="refreshBtn"><svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 1 1-9.58-2H5.26A7 7 0 1 0 12 6z" />
          </svg></button>
      </div>
    </header>

    <main class="app-main">
      <section class="section-card" style="margin-top:0;">
        <div class="section-title">Mode Rekap</div>
        <div class="segmented">
          <button id="tabMonthly" class="seg-btn active">Rekap Bulanan</button>
          <button id="tabMember" class="seg-btn">Rekap Anggota</button>
        </div>
      </section>

      <section class="section-card" id="panelMonthly">
        <label class="field-label">Pilih Bulan</label>
        <select id="monthSel" class="field"></select>
        <div class="row-actions">
          <button id="loadMonthlyBtn" class="btn-primary">Muat Rekap</button>
          <button id="exportCsvBtn" class="btn-secondary">Export CSV</button>
        </div>
        <div id="monthlyOutput" class="mt-2"></div>
      </section>

      <section class="section-card" id="panelMember" style="display:none;">
        <label class="field-label">Pilih Anggota</label>
        <select id="memberSel" class="field"></select>
        <label class="field-label">Pilih Bulan</label>
        <select id="memberMonthSel" class="field"></select>
        <div class="row-actions">
          <button id="loadMemberBtn" class="btn-primary">Muat Rekap</button>
        </div>
        <div id="memberOutput" class="mt-2"></div>
      </section>
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    (async () => { await requireLogin(); init(); })();

    const monthSel = document.getElementById('monthSel');
    const memberMonthSel = document.getElementById('memberMonthSel');
    const memberSel = document.getElementById('memberSel');
    let lastMonthlyData = [];

    async function init() {
      // Load Members for dropdown
      const { data: mems } = await supabaseClient.from('members').select('id, name, role').order('name');
      memberSel.innerHTML = mems.map(m => `<option value="${m.id}">${m.name} (${m.role})</option>`).join('');

      // Generate Month List (Current & Previous)
      const months = [];
      for (let i = 0; i < 12; i++) {
        const d = new Date(); d.setMonth(d.getMonth() - i);
        const val = d.toISOString().slice(0, 7);
        const label = d.toLocaleString('id-ID', { month: 'long', year: 'numeric' });
        months.push(`<option value="${val}">${label}</option>`);
      }
      monthSel.innerHTML = memberMonthSel.innerHTML = months.join('');
    }

    // --- TAB LOGIC ---
    document.getElementById('tabMonthly').onclick = () => switchTab('monthly');
    document.getElementById('tabMember').onclick = () => switchTab('member');
    function switchTab(t) {
      document.getElementById('panelMonthly').style.display = t === 'monthly' ? 'block' : 'none';
      document.getElementById('panelMember').style.display = t === 'member' ? 'block' : 'none';
      document.getElementById('tabMonthly').classList.toggle('active', t === 'monthly');
      document.getElementById('tabMember').classList.toggle('active', t === 'member');
    }

    // --- LOGIC REKAP BULANAN ---
    document.getElementById('loadMonthlyBtn').onclick = async () => {
      const out = document.getElementById('monthlyOutput');
      out.innerHTML = "Memuat...";
      const month = monthSel.value; // YYYY-MM

      try {
        // 1. Ambil semua header di bulan tersebut
        const { data: headers } = await supabaseClient.from('attendance_header')
          .select('id, activity_name_snapshot, date')
          .gte('date', `${month}-01`)
          .lte('date', `${month}-31`);

        if (!headers.length) return out.innerHTML = "Tidak ada data.";

        // 2. Ambil detail untuk semua header tersebut
        const headerIds = headers.map(h => h.id);
        const { data: details } = await supabaseClient.from('attendance_detail')
          .select('*').in('attendance_id', headerIds);

        // 3. Agregasi data per Anggota
        const recap = {};
        details.forEach(d => {
          if (!recap[d.member_id]) recap[d.member_id] = { name: d.member_name_snapshot, role: d.member_role_snapshot, H: 0, I: 0, S: 0, A: 0, Total: 0 };
          const r = recap[d.member_id];
          if (d.presence === 'Hadir') r.H++;
          else if (d.presence === 'Izin') r.I++;
          else if (d.presence === 'Sakit') r.S++;
          else r.A++;
          r.Total++;
        });

        lastMonthlyData = Object.values(recap);
        renderTable(lastMonthlyData, out);
      } catch (e) { out.innerHTML = "Error: " + e.message; }
    };

    function renderTable(data, el) {
      el.innerHTML = `
        <div class="table-scroll"><table class="data-table" style="width:100%; font-size:12px; border-collapse:collapse;">
          <thead><tr style="background:#eee"><th>Nama</th><th>H</th><th>I</th><th>S</th><th>A</th><th>%</th></tr></thead>
          <tbody>${data.map(r => `
            <tr>
              <td><b>${r.name}</b><br><small>${r.role}</small></td>
              <td class="tc">${r.H}</td><td class="tc">${r.I}</td><td class="tc">${r.S}</td><td class="tc">${r.A}</td>
              <td class="tc">${Math.round((r.H / r.Total) * 100)}%</td>
            </tr>`).join('')}
          </tbody>
        </table></div>`;
    }

    // --- LOGIC REKAP ANGGOTA ---
    document.getElementById('loadMemberBtn').onclick = async () => {
      const out = document.getElementById('memberOutput');
      out.innerHTML = "Memuat...";
      const month = memberMonthSel.value;
      const memId = memberSel.value;

      try {
        const { data: history } = await supabaseClient.from('attendance_detail')
          .select('presence, attendance_header(date, activity_name_snapshot)')
          .eq('member_id', memId)
          .gte('attendance_header.date', `${month}-01`)
          .lte('attendance_header.date', `${month}-31`);

        const validHist = history.filter(h => h.attendance_header);
        if (!validHist.length) return out.innerHTML = "Belum ada riwayat.";

        out.innerHTML = `
          <div class="soft-card">
            ${validHist.map(h => `
              <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee;">
                <div><small>${h.attendance_header.date}</small><br><b>${h.attendance_header.activity_name_snapshot}</b></div>
                <div class="badge">${h.presence}</div>
              </div>`).join('')}
          </div>`;
      } catch (e) { out.innerHTML = "Error: " + e.message; }
    };
  </script>
</body>

</html>
