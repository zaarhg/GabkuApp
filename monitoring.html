<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monitoring Atlet - Gabku App</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />
  <style>
    .phase-section {
      animation: fadeInUp 0.3s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Profile card */
    .profile-card {
      background: linear-gradient(135deg, #198cda 0%, #1274b8 100%);
      border-radius: 14px;
      padding: 18px;
      color: #fff;
      margin-bottom: 0;
    }

    .profile-card .profile-name {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 4px;
    }

    .profile-card .profile-role {
      display: inline-block;
      background: rgba(255, 255, 255, 0.22);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    .profile-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .profile-stat-box {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .profile-stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.8;
      margin-bottom: 3px;
    }

    .profile-stat-value {
      font-size: 14px;
      font-weight: 700;
    }

    /* Accordion Toggle */
    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .profile-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out, opacity 0.2s ease;
      opacity: 0;
      margin-top: 0;
    }

    .profile-details.open {
      max-height: 500px;
      /* Large enough to fit content */
      opacity: 1;
      margin-top: 14px;
    }

    .toggle-icon {
      transition: transform 0.3s ease;
    }

    .toggle-icon.rotate {
      transform: rotate(180deg);
    }

    /* History cards */
    .history-card {
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
      border-left: 4px solid #198cda;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .history-card-info {
      flex: 1;
      min-width: 0;
    }

    .history-card-info h4 {
      margin: 0 0 2px;
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
    }

    .history-card-info p {
      margin: 0;
      font-size: 12px;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-card-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    /* PDF buttons */
    .btn-gen-pdf {
      background: #198cda;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-gen-pdf:hover {
      background: #147abf;
    }

    .btn-view-pdf {
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: not-allowed;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-view-pdf.ready {
      background: #dcfce7;
      color: #16a34a;
      border-color: #bbf7d0;
      cursor: pointer;
    }

    .btn-view-pdf.ready:hover {
      background: #bbf7d0;
    }

    /* PDF Generation Overlay */
    #pdfOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }

    #pdfOverlay.show {
      display: flex;
    }

    .pdf-overlay-box {
      background: #fff;
      border-radius: 16px;
      padding: 30px 28px;
      text-align: center;
      width: 280px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .pdf-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #1590df;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .pdf-overlay-title {
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .pdf-overlay-sub {
      font-size: 13px;
      color: #64748b;
    }

    /* Picker All Option */
    .picker-item.all-option {
      background: #f0fdf4;
      border: 1px dashed #22c55e;
      margin-bottom: 8px;
    }

    .picker-item.all-option .picker-item-name {
      color: #15803d;
      font-weight: 800;
    }

    .picker-item.all-option .picker-check {
      border-color: #22c55e;
    }

    .picker-item.all-option.selected .picker-check {
      background: #22c55e;
      border-color: #22c55e;
    }

    /* Indikator form rows */
    .indikator-row {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    /* Status Monitoring Table (Recap) */
    .recap-container {
      margin-top: 15px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }

    .recap-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .recap-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .recap-table th,
    .recap-table td {
      border: 1px solid #f1f5f9;
      padding: 10px 6px;
      text-align: center;
      min-width: 32px;
    }

    .recap-table th {
      background: #f8fafc;
      font-weight: 700;
      color: #64748b;
      white-space: nowrap;
    }

    /* Sticky first column (Nama Atlet) */
    .recap-table th:first-child,
    .recap-table td:first-child {
      position: sticky;
      left: 0;
      background: #fff;
      z-index: 10;
      text-align: left;
      min-width: 110px;
      max-width: 110px;
      border-right: 2px solid #e2e8f0;
      padding-left: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recap-table th:first-child {
      background: #f8fafc;
    }

    .recap-table tr:hover td {
      background: #f1f5f9;
    }

    .recap-table tr:hover td:first-child {
      background: #f1f5f9;
    }

    .status-ok {
      color: #16a34a;
      font-size: 14px;
      font-weight: 800;
    }

    .status-empty {
      color: #cbd5e1;
      font-size: 14px;
    }

    .status-future {
      background-color: #f1f5f9 !important;
      color: #cbd5e1;
      cursor: not-allowed !important;
    }

    .recap-name {
      color: #1e293b;
      font-weight: 600;
      cursor: pointer;
    }

    .recap-name:hover {
      color: #1590df;
      text-decoration: underline;
    }

    .indikator-label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }

    .indikator-inputs {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .indikator-inputs select {
      width: 80px;
      flex-shrink: 0;
    }

    /* Catatan wrapper */
    .catatan-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: flex-start;
    }

    .catatan-wrap textarea {
      flex: 1;
      resize: none;
      overflow: hidden;
      min-height: 44px;
      /* Samakan dengan tinggi select/input field */
      height: 44px;
      /* Fix tinggi agar sejajar sempurna */
      border-radius: 8px;
      padding: 10px 8px;
      font-size: 13px;
      line-height: 1.4;
    }

    /* Clear button for catatan */
    .btn-clear-catatan {
      position: absolute;
      right: 4px;
      top: 4px;
      background: #e2e8f0;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 11px;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-clear-catatan:hover {
      background: #cbd5e1;
    }

    /* Month picker */
    .month-picker {
      display: flex;
      gap: 10px;
    }

    .month-picker select,
    .month-picker input[type="number"] {
      flex: 1;
    }

    /* Back button */
    .btn-back-phase {
      background: none;
      border: 1px solid #cbd5e1;
      color: #64748b;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-back-phase:hover {
      background: #f1f5f9;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
      font-size: 14px;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #16a34a;
      color: #fff;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      transition: opacity 0.35s ease;
      max-width: 90vw;
      text-align: center;
    }

    /* Catatan pelatih wrapper */
    .catatan-pelatih-wrap {
      position: relative;
    }

    .catatan-pelatih-wrap textarea {
      width: 100%;
      box-sizing: border-box;
      resize: vertical;
      /* Allow manual resize but set good default */
      overflow: hidden;
      min-height: 120px;
      /* Lebihtinggi agar jelas terlihat */
    }

    .catatan-pelatih-wrap .btn-clear-catatan {
      position: absolute;
      right: 6px;
      top: 6px;
    }

    /* Modal Picker */
    #monMemberPickerModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }

    #monMemberPickerModal.show {
      display: flex;
    }

    .picker-box {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      width: 92%;
      max-width: 400px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .picker-title {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
    }

    .picker-search {
      border-radius: 8px;
      border: 1.5px solid #e2e8f0;
      padding: 9px 12px;
      font-size: 13px;
      width: 100%;
      box-sizing: border-box;
    }

    .picker-search:focus {
      outline: none;
      border-color: #1590df;
    }

    .picker-list {
      overflow-y: auto;
      flex: 1;
    }

    .picker-item {
      display: flex;
      align-items: center;
      padding: 10px 8px;
      border-radius: 8px;
      cursor: pointer;
      gap: 10px;
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s;
    }

    .picker-item:hover {
      background: #f0f9ff;
    }

    .picker-item.selected {
      background: #eff6ff;
    }

    .picker-item-name {
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
    }

    .picker-item-role {
      font-size: 11px;
      color: #64748b;
    }

    .picker-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .picker-item.selected .picker-check {
      background: #1590df;
      border-color: #1590df;
      color: #fff;
      font-size: 12px;
    }

    .field-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 11px 14px;
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      color: #111827;
      cursor: pointer;
      transition: all 0.2s ease;
      box-sizing: border-box;
      text-align: left;
    }

    .field-trigger:active {
      border-color: #1590df;
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <button class="icon-back" onclick="handleBack()" aria-label="Kembali">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg>
          </button>
          <div class="header-text">
            <div class="app-name">Monitoring Atlet</div>
            <div class="app-subtitle">Input &amp; rekap perkembangan</div>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main" style="padding-bottom: 80px;">

      <!-- ===== FASE 1: PILIH ATLET ===== -->
      <section class="section-card phase-section mt-0" id="phase-select">
        <div class="section-title m-0 mb-3">Pilih Atlet</div>

        <label class="field-label" for="filterKegiatan">Filter Kegiatan (Opsional)</label>
        <select id="filterKegiatan" class="field mb-4">
          <option value="">— Semua Kegiatan —</option>
        </select>

        <label class="field-label" style="display: block; margin-bottom: 8px;">Pilih Atlet *</label>
        <input type="hidden" id="selectAtlet" value="">
        <button type="button" class="field-trigger" onclick="openMonPicker()">
          <span id="selectAtletText" style="color:#94a3b8;">Pilih atlet...</span>
          <svg viewBox="0 0 24 24" width="20" height="20" style="color:#64748b; margin-left:8px;">
            <path fill="currentColor" d="M7 10l5 5 5-5H7z" />
          </svg>
        </button>

        <button class="btn-primary w-full mt-5" onclick="onConfirmAthlete()">
          Konfirmasi Pilihan
        </button>
        <p id="phase1-msg" class="text-danger text-sm mt-3 text-center" style="min-height:18px;"></p>

        <!-- Container Rekap Status -->
        <div id="monStatusArea"></div>
      </section>

      <!-- ===== FASE 2: PROFIL + RIWAYAT ===== -->
      <div id="phase-profile" style="display:none;" class="phase-section">

        <!-- Profil singkat -->
        <section class="section-card p-0 overflow-hidden">
          <div class="profile-card">
            <div class="profile-header" onclick="toggleProfileDetails()">
              <div class="flex-col">
                <p class="profile-name" id="profName">—</p>
              </div>
              <svg class="toggle-icon" viewBox="0 0 24 24" width="24" height="24" fill="white">
                <path d="M7 10l5 5 5-5H7z" />
              </svg>
            </div>

            <div id="profileDetails" class="profile-details">
              <div class="profile-stats">
                <div class="profile-stat-box" style="grid-column:span 2;">
                  <div class="profile-stat-label">Jabatan</div>
                  <div class="profile-stat-value" id="profRole">—</div>
                </div>
                <div class="profile-stat-box">
                  <div class="profile-stat-label">Gender</div>
                  <div class="profile-stat-value" id="profGender">—</div>
                </div>
                <div class="profile-stat-box">
                  <div class="profile-stat-label">Tgl Lahir</div>
                  <div class="profile-stat-value" id="profBirth">—</div>
                </div>
                <div class="profile-stat-box" style="grid-column:span 2;">
                  <div class="profile-stat-label">No WhatsApp</div>
                  <div class="profile-stat-value" id="profPhone">—</div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Buat monitoring baru -->
        <section class="section-card">
          <div class="section-title m-0 mb-3">Buat Monitoring Baru</div>
          <label class="field-label">Pilih Bulan &amp; Tahun *</label>
          <div class="month-picker mb-2">
            <select id="inputBulan" class="field">
              <option value="">— Bulan —</option>
              <option value="1">Januari</option>
              <option value="2">Februari</option>
              <option value="3">Maret</option>
              <option value="4">April</option>
              <option value="5">Mei</option>
              <option value="6">Juni</option>
              <option value="7">Juli</option>
              <option value="8">Agustus</option>
              <option value="9">September</option>
              <option value="10">Oktober</option>
              <option value="11">November</option>
              <option value="12">Desember</option>
            </select>
            <select id="inputTahun" class="field">
              <!-- Dipopulasi via JS (2 tahun terakhir) -->
            </select>
          </div>
          <button class="btn-primary w-full mt-3" onclick="onStartMonitoring()">
            Mulai Input Monitoring
          </button>
          <p id="phase2-msg" class="text-danger text-sm mt-2" style="min-height:18px;"></p>
        </section>

        <!-- Riwayat -->
        <section class="section-card">
          <div class="section-title m-0 mb-3">Riwayat Monitoring</div>
          <div id="historyList" class="flex-col gap-2">
            <div class="empty-state">Memuat riwayat…</div>
          </div>
        </section>
      </div>

      <!-- PDF Generation Overlay (blocking) -->
      <div id="pdfOverlay" role="alertdialog" aria-modal="true" aria-label="Membuat PDF">
        <div class="pdf-overlay-box">
          <div class="pdf-spinner"></div>
          <div class="pdf-overlay-title">Membuat PDF…</div>
          <div class="pdf-overlay-sub">Mohon tunggu, jangan tutup halaman ini.</div>
        </div>
      </div>

      <!-- ===== FASE 3: FORM PENILAIAN ===== -->
      <div id="phase-form" style="display:none;" class="phase-section">

        <section class="section-card py-3 px-4">
          <div class="row-between flex-wrap gap-2">
            <div>
              <div class="font-bold text-main" style="font-size:15px;" id="formAtletLabel">—</div>
              <div class="text-xs text-muted mt-1" id="formPeriodeLabel">—</div>
            </div>
            <button type="button" class="btn-back-phase text-xs" onclick="resetToPhase2()">← Kembali</button>
          </div>
        </section>

        <form id="formMonitoring" onsubmit="submitMonitoring(event)">

          <!-- Card Kehadiran (Read-only) -->
          <div id="attendanceCardContainer"></div>

          <section class="section-card">
            <label class="field-label" for="inputSistem">Sistem Utama Pasangan (Opsional)</label>
            <select id="inputSistem" class="field mb-3">
              <option value="">— Pilih Sistem —</option>
            </select>

            <label class="field-label" for="inputVo2max">Nilai VO₂max (Opsional)</label>
            <input type="number" id="inputVo2max" class="field" step="0.1" placeholder="Cth: 45.5" />
          </section>

          <div id="penilaianContainer"></div>

          <section class="section-card">
            <div class="section-title m-0 mb-3">C. Catatan Pelatih</div>
            <div class="catatan-pelatih-wrap">
              <textarea id="inputCatatanPelatih" class="field" rows="5"
                placeholder="Evaluasi keseluruhan atau saran untuk atlet…"
                oninput="autoResizeTextarea(this); _updateCatatanPelatihClearBtn(this.value)"></textarea>
              <button type="button" class="btn-clear-catatan" id="btnClearCatatanPelatih" style="display:none;"
                onclick="clearCatatanPelatih()" title="Hapus catatan">✕</button>
            </div>
          </section>

          <div class="pb-4 mt-4">
            <button type="submit" class="btn-primary w-full">Simpan Data Monitoring</button>
          </div>
        </form>
      </div>

    </main>

    <!-- Picker Modal -->
    <div id="monMemberPickerModal">
      <div class="picker-box">
        <div class="picker-title">Pilih Atlet</div>
        <input id="monPickerSearch" class="picker-search" placeholder="Cari nama atlet…"
          oninput="filterMonPicker(this.value)">
        <div class="picker-list" id="monPickerList"></div>
        <div class="picker-actions mt-3 pt-3" style="border-top: 1px solid #e2e8f0;">
          <button class="btn-secondary"
            style="width: 100%; height: 44px; background: #fee2e2 !important; color: #dc2626 !important; border: 1px solid #fecaca !important; font-weight: 800; border-radius: 10px; cursor: pointer;"
            onclick="closeMonPicker()">Batal</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" style="display:none;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>

  <script src="assets/js/monitoring.js"></script>
</body>

</html>
