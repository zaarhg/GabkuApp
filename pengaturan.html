<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gabku App – Pengaturan</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html" aria-label="Kembali"><svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg></a>
          <div class="header-text">
            <div class="app-name">Pengaturan</div>
            <div class="app-subtitle">Kelola opsi dropdown aplikasi</div>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="section-card" style="margin-top:0;">
        <div class="section-title">Opsi Waktu (Jam)</div>
        <p class="hint" style="font-size:12px; color:#666; margin-bottom:10px;">Opsi waktu mulai & akhir di halaman
          Presensi.</p>

        <div style="display:flex; gap:8px; margin-bottom:12px; align-items:center;">
          <input id="timeStartInput" type="time" class="field" style="flex:1;" />
          <span style="font-weight:bold; color:#666;">-</span>
          <input id="timeEndInput" type="time" class="field" style="flex:1;" />
          <button id="addTimeBtn" class="btn-primary" style="padding:0 15px; width:auto; flex: 0 0 auto;"
            type="button">Tambah</button>
        </div>
        <div id="timeList" style="margin-top:10px;"></div>
      </section>

      <section class="section-card">
        <div class="section-title">Opsi Tempat / Lokasi</div>
        <p class="hint" style="font-size:12px; color:#666; margin-bottom:10px;">Pilihan dropdown Tempat di halaman
          Presensi.</p>

        <div style="display:flex; gap:8px; margin-bottom:12px;">
          <input id="locInput" type="text" class="field" style="flex:1;" placeholder="Cth: Ruang Rapat" />
          <button id="addLocBtn" class="btn-primary" style="padding:0 15px; width:auto; flex: 0 0 auto;"
            type="button">Tambah</button>
        </div>
        <div id="locList" style="margin-top:10px;"></div>
        <section class="section-card">
          <div class="section-title">Opsi Status Kepengurusan</div>
          <p class="hint" style="font-size:12px; color:#666; margin-bottom:10px;">Sub-role / jabatan pengurus di profil
            anggota.</p>

          <div style="display:flex; gap:8px; margin-bottom:12px;">
            <input id="pengurusInput" type="text" class="field" style="flex:1;" placeholder="Cth: Sekretaris" />
            <button id="addPengurusBtn" class="btn-primary" style="padding:0 15px; width:auto; flex: 0 0 auto;"
              type="button">Tambah</button>
          </div>
          <div id="pengurusList" style="margin-top:10px;"></div>
        </section>

        <p id="msgEl" class="tool-msg" style="text-align:center;"></p>
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    (async () => { await requireLogin(); loadSettings(); })();

    const timeListEl = document.getElementById("timeList");
    const locListEl = document.getElementById("locList");
    const pengurusListEl = document.getElementById("pengurusList");
    const msgEl = document.getElementById("msgEl");

    let timeOptions = [];
    let locOptions = [];
    let pengurusOptions = [];

    function escapeHtml(s) { return String(s || '').replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;"); }

    async function loadSettings() {
      timeListEl.innerHTML = "<p class='muted'>Memuat...</p>";
      locListEl.innerHTML = "<p class='muted'>Memuat...</p>";
      pengurusListEl.innerHTML = "<p class='muted'>Memuat...</p>";
      msgEl.textContent = "";

      try {
        const { data, error } = await supabaseClient.from('app_settings').select('*');
        if (error) throw error;

        const timeRow = data.find(r => r.setting_key === 'time_options');
        const locRow = data.find(r => r.setting_key === 'location_options');
        const pengRow = data.find(r => r.setting_key === 'pengurus_options');

        timeOptions = timeRow ? timeRow.setting_value : [];
        locOptions = locRow ? locRow.setting_value : [];

        if (pengRow && pengRow.setting_value) {
          pengurusOptions = Array.isArray(pengRow.setting_value) ? pengRow.setting_value : (typeof pengRow.setting_value === 'string' ? JSON.parse(pengRow.setting_value) : []);
        } else {
          pengurusOptions = ["Ketua", "Wakil Ketua", "Sekretaris", "Bendahara", "Anggota Divisi"];
        }

        // Sorting
        timeOptions.sort();
        locOptions.sort();
        pengurusOptions.sort();

        renderTimeSettings();
        renderLocSettings();
        renderPengurusSettings();
      } catch (e) {
        timeListEl.innerHTML = ""; locListEl.innerHTML = ""; pengurusListEl.innerHTML = "";
        msgEl.style.color = "red"; msgEl.textContent = "Error: " + e.message;
      }
    }

    async function saveSettingToDb(key, value) {
      msgEl.style.color = "#1590df";
      msgEl.textContent = "Menyimpan...";
      try {
        const { error } = await supabaseClient.from('app_settings').upsert([{
          setting_key: key,
          setting_value: value
        }]);
        if (error) throw error;
        msgEl.style.color = "green";
        msgEl.textContent = "Berhasil disimpan!";
        setTimeout(() => msgEl.textContent = "", 2000);
      } catch (e) {
        msgEl.style.color = "red";
        msgEl.textContent = "Gagal simpan: " + e.message;
      }
    }

    function renderTimeSettings() {
      if (!timeOptions.length) {
        timeListEl.innerHTML = "<p class='muted' style='font-size:13px;'>Belum ada opsi waktu.</p>";
        return;
      }
      timeListEl.innerHTML = timeOptions.map((t, i) => `
        <div class="item-card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; padding:10px;">
          <div style="font-weight:bold; font-size:14px;">Waktu: ${escapeHtml(t)}</div>
          <button class="btn-danger" style="padding:4px 8px; font-size:12px;" onclick="removeTime(${i})">Hapus</button>
        </div>
      `).join("");
    }

    function renderLocSettings() {
      if (!locOptions.length) {
        locListEl.innerHTML = "<p class='muted' style='font-size:13px;'>Belum ada opsi lokasi.</p>";
        return;
      }
      locListEl.innerHTML = locOptions.map((l, i) => `
        <div class="item-card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; padding:10px;">
          <div style="font-weight:bold; font-size:14px; flex:1; padding-right:10px;">${escapeHtml(l)}</div>
          <button class="btn-danger" style="padding:4px 8px; font-size:12px; flex:0 0 auto;" onclick="removeLoc(${i})">Hapus</button>
        </div>
      `).join("");
    }

    function renderPengurusSettings() {
      if (!pengurusOptions.length) {
        pengurusListEl.innerHTML = "<p class='muted' style='font-size:13px;'>Belum ada opsi kepengurusan.</p>";
        return;
      }
      pengurusListEl.innerHTML = pengurusOptions.map((p, i) => `
        <div class="item-card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; padding:10px;">
          <div style="font-weight:bold; font-size:14px; flex:1; padding-right:10px;">${escapeHtml(p)}</div>
          <button class="btn-danger" style="padding:4px 8px; font-size:12px; flex:0 0 auto;" onclick="removePengurus(${i})">Hapus</button>
        </div>
      `).join("");
    }

    // ACTIONS
    document.getElementById("addTimeBtn").onclick = async () => {
      const s = document.getElementById("timeStartInput").value;
      const e = document.getElementById("timeEndInput").value;
      if (!s || !e) return alert("Harap isi waktu mulai dan selesai.");
      const val = `${s} - ${e}`;
      if (timeOptions.includes(val)) return alert("Waktu sudah ada dalam daftar.");

      timeOptions.push(val);
      timeOptions.sort();
      renderTimeSettings();
      document.getElementById("timeStartInput").value = "";
      document.getElementById("timeEndInput").value = "";
      await saveSettingToDb('time_options', timeOptions);
    };

    window.removeTime = async (index) => {
      const t = timeOptions[index];
      if (!confirm("Hapus opsi waktu " + t + "?")) return;
      timeOptions.splice(index, 1);
      renderTimeSettings();
      await saveSettingToDb('time_options', timeOptions);
    };

    document.getElementById("addLocBtn").onclick = async () => {
      const val = document.getElementById("locInput").value.trim();
      if (!val) return;
      if (locOptions.map(l => l.toLowerCase()).includes(val.toLowerCase())) return alert("Tempat sudah ada dalam daftar.");

      locOptions.push(val);
      locOptions.sort();
      renderLocSettings();
      document.getElementById("locInput").value = "";
      await saveSettingToDb('location_options', locOptions);
    };

    window.removeLoc = async (index) => {
      const loc = locOptions[index];
      if (!confirm("Hapus opsi tempat " + loc + "?")) return;
      locOptions.splice(index, 1);
      renderLocSettings();
      await saveSettingToDb('location_options', locOptions);
    };

    document.getElementById("addPengurusBtn").onclick = async () => {
      const val = document.getElementById("pengurusInput").value.trim();
      if (!val) return;
      if (pengurusOptions.map(l => l.toLowerCase()).includes(val.toLowerCase())) return alert("Status sudah ada dalam daftar.");

      pengurusOptions.push(val);
      pengurusOptions.sort();
      renderPengurusSettings();
      document.getElementById("pengurusInput").value = "";
      await saveSettingToDb('pengurus_options', pengurusOptions);
    };

    window.removePengurus = async (index) => {
      const p = pengurusOptions[index];
      if (!confirm("Hapus opsi status " + p + "?")) return;
      pengurusOptions.splice(index, 1);
      renderPengurusSettings();
      await saveSettingToDb('pengurus_options', pengurusOptions);
    };
  </script>
</body>

</html>
