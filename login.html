<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gabku App – Login</title>

  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />
</head>
<body>

  <div class="app">
    <main class="app-main login-clean">

      <!-- Logo -->
      <img src="assets/img/logo.png" alt="Gabku" class="login-logo" />

      <!-- Title -->
      <div class="login-title">Gabku App</div>

      <!-- Login Card -->
      <section class="section-card login-card">
        <label class="field-label" for="t">Access Token</label>
        <input
          id="t"
          type="password"
          class="field"
          placeholder="Masukkan token akses..."
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />

        <button id="btn" class="btn-primary btn-wide" type="button">
          Masuk
        </button>

        <p id="msg" class="msg" style="margin-top:10px; text-align:center;"></p>

        <p class="login-help">
          Token ini hanya untuk internal organisasi. Jika belum punya token, hubungi admin.
        </p>
      </section>

      <!-- Deskripsi -->
      <p class="login-desc">
        <em>
          Gabku App V1 adalah aplikasi internal untuk mencatat presensi kegiatan dan menghasilkan laporan PDF.
        </em>
      </p>

    </main>
  </div>

  <!-- Scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    // Jika sudah punya token, coba langsung validasi dan masuk
    (async function autoLoginIfExists() {
      const existing = localStorage.getItem(LS_KEY_TOKEN);
      if (!existing || !String(existing).trim()) return;

      try {
        await validateToken(existing);
        window.location.href = "index.html";
      } catch (_) {
        localStorage.removeItem(LS_KEY_TOKEN);
      }
    })();

    async function validateToken(token) {
      const url = new URL(SCRIPT_URL);
      url.searchParams.set("action", "ping");
      url.searchParams.set("token", token);

      const res = await fetch(url.toString(), { method: "GET" });
      const data = await res.json();

      if (!data || !data.ok) {
        throw new Error("Token tidak valid");
      }
      return true;
    }

    async function doLogin() {
      const token = document.getElementById("t").value.trim();
      const msg = document.getElementById("msg");
      const btn = document.getElementById("btn");

      msg.textContent = "";

      if (!token) {
        msg.textContent = "Token belum diisi.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Memeriksa...";

      try {
        // Validasi token ke backend
        await validateToken(token);

        // Simpan token & masuk
        localStorage.setItem(LS_KEY_TOKEN, token);
        window.location.href = "index.html";
      } catch (e) {
        localStorage.removeItem(LS_KEY_TOKEN);
        msg.textContent = "Gagal login: token tidak valid.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Masuk";
      }
    }

    document.getElementById("btn").addEventListener("click", doLogin);
    document.getElementById("t").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });
  </script>

  <!-- CSS lokal khusus login -->
  <style>
    .login-clean{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:14px;
      padding-top: 10px;
      padding-bottom: 18px;
      min-height: calc(100vh - 80px);
    }
    .login-logo{
      width: 92px;
      height: 92px;
      object-fit: contain;
      border-radius: 24px;
      box-shadow: 0 16px 30px rgba(2,8,23,.12);
      background: rgba(255,255,255,.65);
      padding: 10px;
    }
    .login-title{
      font-weight: 950;
      font-size: 20px;
      letter-spacing: .2px;
      text-align:center;
      margin-top: 2px;
    }
    .login-card{
      width: min(92vw, 420px);
      padding: 14px;
      border-radius: 18px;
    }
    .btn-wide{
      width: 100%;
      border-radius: 14px;
      padding: 12px 14px;
      font-weight: 950;
      margin-top: 12px;
    }
    .msg{
      font-weight: 800;
      color: rgba(220,38,38,.95);
      min-height: 18px;
    }
    .login-help{
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
    }
    .login-desc{
      width: min(92vw, 520px);
      text-align:center;
      color: rgba(2,8,23,.72);
      font-size: 12.5px;
      line-height: 1.35;
      margin: 0;
      padding: 0 10px;
    }

    @media (max-height: 720px){
      .login-clean{ justify-content:flex-start; }
      .login-card{ margin-top: 6px; }
      body{ overflow-y: auto; }
    }
  </style>

  <!-- Register Service Worker (PWA) -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>

</body>
</html>
