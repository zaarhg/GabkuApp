<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gabku App – Anggota</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html" aria-label="Kembali"><svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg></a>
          <div class="header-text">
            <div class="app-name">Anggota</div>
            <div class="app-subtitle">Kelola data anggota aktif</div>
          </div>
        </div>
        <button class="btn-ghost" id="refreshBtn"><svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 1 1-9.58-2H5.26A7 7 0 1 0 12 6z" />
          </svg></button>
      </div>
    </header>

    <main class="app-main">
      <section class="section-card" style="margin-top:0;">
        <div class="section-title">Tambah Anggota</div>
        <label class="field-label" for="name">Nama</label>
        <input id="name" type="text" class="field" placeholder="Nama anggota" />
        <label class="field-label" for="role">Role / Jabatan</label>
        <select id="role" class="field">
          <option value="">— pilih —</option>
          <option>Atlet</option>
          <option>Pelatih</option>
          <option>Official</option>
          <option>Pengurus</option>
        </select>
        <div class="row-actions">
          <button id="addBtn" class="btn-primary" type="button">Simpan</button>
        </div>
        <p id="msg" class="tool-msg" style="margin-top:10px;"></p>
      </section>

      <section class="section-card">
        <div class="row-between">
          <div class="section-title" style="margin:0;">Daftar Anggota</div>
          <span class="pill" id="countPill" style="display:none;"></span>
        </div>
        <div style="margin-top:12px;">
          <input id="q" type="text" class="field" placeholder="Cari nama anggota..." />
        </div>
        <div id="list" style="margin-top:12px;"></div>
      </section>
    </main>

    <!-- Modal Edit -->
    <div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; justify-content:center; align-items:center;">
      <div class="section-card" style="width:90%; max-width:400px; margin:0;">
        <div class="section-title" style="margin-top:0;">Edit Anggota</div>
        <input type="hidden" id="editId" />
        
        <label class="field-label" for="editName">Nama</label>
        <input id="editName" type="text" class="field" style="margin-bottom:12px;" />
        
        <label class="field-label" for="editRole">Role / Jabatan</label>
        <select id="editRole" class="field">
          <option value="">— pilih —</option>
          <option>Atlet</option>
          <option>Pelatih</option>
          <option>Official</option>
          <option>Pengurus</option>
        </select>
        
        <div style="margin-top:20px; display:flex; gap:10px; justify-content:flex-end;">
          <button class="btn-secondary" onclick="closeEditModal()" style="padding:8px 16px;">Batal</button>
          <button class="btn-primary" onclick="saveEdit()" style="padding:8px 16px;">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    (async () => { await requireLogin(); load(); })();

    const listEl = document.getElementById("list");
    const msgEl = document.getElementById("msg");
    const qEl = document.getElementById("q");
    const countPill = document.getElementById("countPill");
    let cache = [];

    function escapeHtml(s) { return String(s || '').replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;"); }

    function render(items) {
      if (!items.length) {
        listEl.innerHTML = "<p class='muted'>Tidak ada anggota.</p>";
        countPill.style.display = "none";
        return;
      }
      countPill.textContent = items.length + " orang";
      countPill.style.display = "inline-flex";

      listEl.innerHTML = items.map(m => `
        <div class="item-card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <div class="item-left">
            <div style="font-weight:bold;">${escapeHtml(m.name)}</div>
            <div style="font-size:12px; color:#666;">${escapeHtml(m.role)}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn-secondary" style="padding:4px 10px; font-size:12px;" onclick="editMember('${m.id}', '${escapeHtml(m.name)}', '${escapeHtml(m.role)}')">Edit</button>
            <button class="btn-danger" style="padding:4px 10px; font-size:12px; background:#fee2e2; color:#b91c1c; border:none; border-radius:6px;" onclick="deleteMember('${m.id}', '${escapeHtml(m.name)}')">Hapus</button>
          </div>
        </div>
      `).join("");
    }

    async function load() {
      listEl.innerHTML = "<p class='muted'>Memuat...</p>";
      try {
        // Hanya ambil anggota yang is_active = true
        const { data, error } = await supabaseClient.from('members').select('*').eq('is_active', true).order('name');
        if (error) throw error;
        cache = data;
        render(cache);
      } catch (e) { listEl.innerHTML = `<p class='msg'>Error: ${e.message}</p>`; }
    }

    document.getElementById("addBtn").onclick = async () => {
      const name = document.getElementById("name").value.trim();
      const role = document.getElementById("role").value.trim();
      msgEl.textContent = "";
      if (!name || !role) return msgEl.textContent = "Data belum lengkap.";

      try {
        msgEl.textContent = "Menyimpan...";
        const id = `MBR-${new Date().toISOString().replace(/[-T:]/g, '').split('.')[0]}-${Math.floor(1000 + Math.random() * 9000)}`;
        const { error } = await supabaseClient.from('members').insert([{ id, name, role }]);
        if (error) throw error;
        msgEl.textContent = "Berhasil!";
        document.getElementById("name").value = ''; document.getElementById("role").value = '';
        await load();
      } catch (e) { msgEl.textContent = "Gagal: " + e.message; }
    };

    // FUNGSI EDIT
    window.editMember = (id, oldName, oldRole) => {
      // Decode escaped HTML to show original text in input
      const decodeHtml = (html) => {
        const txt = document.createElement("textarea");
        txt.innerHTML = html;
        return txt.value;
      };
      
      document.getElementById('editId').value = id;
      document.getElementById('editName').value = decodeHtml(oldName);
      document.getElementById('editRole').value = decodeHtml(oldRole);
      document.getElementById('editModal').style.display = 'flex';
    };

    window.closeEditModal = () => {
      document.getElementById('editModal').style.display = 'none';
      document.getElementById('editId').value = '';
      document.getElementById('editName').value = '';
      document.getElementById('editRole').value = '';
    };

    window.saveEdit = async () => {
      const id = document.getElementById('editId').value;
      const newName = document.getElementById('editName').value.trim();
      const newRole = document.getElementById('editRole').value.trim();

      if (!newName || !newRole) return alert("Data (Nama & Role) tidak boleh kosong!");

      try {
        const btn = document.querySelector('#editModal .btn-primary');
        const originalText = btn.textContent;
        btn.textContent = 'Menyimpan...';
        btn.disabled = true;

        const { error } = await supabaseClient.from('members').update({ name: newName, role: newRole }).eq('id', id);
        if (error) throw error;
        
        closeEditModal();
        load();
        
        btn.textContent = originalText;
        btn.disabled = false;
      } catch (e) { 
        alert("Error: " + e.message);
        const btn = document.querySelector('#editModal .btn-primary');
        btn.textContent = 'Simpan';
        btn.disabled = false;
      }
    };

    // FUNGSI HAPUS (Soft Delete)
    window.deleteMember = async (id, name) => {
      if (!confirm(`Hapus ${name}? (Riwayat presensinya akan tetap aman)`)) return;
      try {
        const { error } = await supabaseClient.from('members').update({ is_active: false }).eq('id', id);
        if (error) throw error;
        load();
      } catch (e) { alert("Error: " + e.message); }
    };

    qEl.addEventListener("input", () => {
      const q = qEl.value.trim().toLowerCase();
      render(q ? cache.filter(m => String(m.name || "").toLowerCase().includes(q)) : cache);
    });

    document.getElementById("refreshBtn").onclick = load;
  </script>
</body>

</html>
