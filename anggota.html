<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gabku App – Anggota</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html" aria-label="Kembali"><svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg></a>
          <div class="header-text">
            <div class="app-name">Anggota</div>
            <div class="app-subtitle">Kelola data anggota aktif</div>
          </div>
        </div>
        <button class="btn-ghost" id="refreshBtn"><svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 1 1-9.58-2H5.26A7 7 0 1 0 12 6z" />
          </svg></button>
      </div>
    </header>

    <main class="app-main">
      <section class="section-card" id="toggleAddMemberBtn"
        style="margin-top:0; padding:14px; background:#f3f4f6; display:flex; justify-content:center; align-items:center; cursor:pointer; border:1px dashed #d1d5db; transition:background 0.2s;">
        <span style="font-weight:700; color:#1590df; font-size:14px;">+ Tambah Anggota Baru</span>
      </section>

      <section class="section-card" id="addMemberForm" style="display:none; margin-top:0;">
        <div class="row-between">
          <div class="section-title" style="margin:0;">Tambah Anggota</div>
          <button class="btn-ghost" id="cancelAddMemberBtn"
            style="font-size:24px; padding:0 8px; line-height:1; color:#9ca3af;">&times;</button>
        </div>
        <label class="field-label" for="name" style="margin-top:10px;">Nama</label>
        <input id="name" type="text" class="field" placeholder="Nama anggota" />

        <label class="field-label" style="margin-top:10px;">Gender</label>
        <div class="radio-group" id="genderGroup">
          <div class="radio-btn active" data-val="Laki-laki">Laki-laki</div>
          <div class="radio-btn" data-val="Perempuan">Perempuan</div>
        </div>
        <input type="hidden" id="gender" value="Laki-laki" />

        <label class="field-label" for="role">Role / Jabatan</label>
        <select id="role" class="field">
          <option value="">— pilih —</option>
          <option>Atlet</option>
          <option>Pelatih</option>
          <option>Official</option>
          <option>Pengurus</option>
        </select>

        <div id="pengurusWrap" style="display:none; margin-top:10px;">
          <label class="field-label" for="pengurusStatus">Status Kepengurusan</label>
          <select id="pengurusStatus" class="field">
            <option value="">— pilih status —</option>
          </select>
        </div>

        <label class="field-label" for="birthDate" style="margin-top:10px;">Tanggal Lahir</label>
        <input id="birthDate" type="date" class="field" style="margin-bottom:10px;" />

        <label class="field-label" for="phone">No. WhatsApp</label>
        <input id="phone" type="tel" class="field" placeholder="Contoh: 0812xxxx (opsional)"
          style="margin-bottom:10px;" />

        <div class="row-actions" style="margin-top:15px;">
          <button id="addBtn" class="btn-primary" type="button" style="width:100%;">Simpan Anggota</button>
        </div>
        <p id="msg" class="tool-msg" style="margin-top:10px; text-align:center;"></p>
      </section>

      <section class="section-card">
        <div class="row-between">
          <div class="section-title" style="margin:0;">Daftar Anggota</div>
          <span class="pill" id="countPill" style="display:none;"></span>
        </div>
        <div style="margin-top:12px;">
          <input id="q" type="text" class="field" placeholder="Cari nama anggota..." />
        </div>
        <div id="list" style="margin-top:12px;"></div>
      </section>
    </main>

    <!-- Modal Edit -->
    <div id="editModal"
      style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; justify-content:center; align-items:center;">
      <div class="section-card" style="width:90%; max-width:400px; margin:0;">
        <div class="section-title" style="margin-top:0;">Edit Anggota</div>
        <input type="hidden" id="editId" />

        <label class="field-label" for="editName">Nama</label>
        <input id="editName" type="text" class="field" style="margin-bottom:12px;" />

        <label class="field-label" style="margin-top:10px;">Gender</label>
        <div class="radio-group" id="editGenderGroup">
          <div class="radio-btn" data-val="Laki-laki">Laki-laki</div>
          <div class="radio-btn" data-val="Perempuan">Perempuan</div>
        </div>
        <input type="hidden" id="editGender" value="" />

        <label class="field-label" for="editRole">Role / Jabatan</label>
        <select id="editRole" class="field">
          <option value="">— pilih —</option>
          <option>Atlet</option>
          <option>Pelatih</option>
          <option>Official</option>
          <option>Pengurus</option>
        </select>

        <div id="editPengurusWrap" style="display:none; margin-top:10px;">
          <label class="field-label" for="editPengurusStatus">Status Kepengurusan</label>
          <select id="editPengurusStatus" class="field">
            <option value="">— pilih status —</option>
          </select>
        </div>

        <label class="field-label" for="editBirthDate" style="margin-top:10px;">Tanggal Lahir</label>
        <input id="editBirthDate" type="date" class="field" style="margin-bottom:10px;" />

        <label class="field-label" for="editPhone">No. WhatsApp</label>
        <input id="editPhone" type="tel" class="field" style="margin-bottom:10px;" />

        <div style="margin-top:20px; display:flex; gap:10px; justify-content:flex-end;">
          <button class="btn-secondary" onclick="closeEditModal()" style="padding:8px 16px;">Batal</button>
          <button class="btn-primary" onclick="saveEdit()" style="padding:8px 16px;">Simpan</button>
        </div>
      </div>
    </div>

    <!-- Modal Detail Anggota -->
    <div id="detailModal"
      style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; justify-content:center; align-items:flex-end;">
      <div class="section-card"
        style="width:100%; max-width:var(--max); margin:0; border-radius: 20px 20px 0 0; padding-bottom: calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -10px 40px rgba(0,0,0,0.15);">
        <div style="width:40px; height:5px; background:#e5e7eb; border-radius:10px; margin:0 auto 15px;"></div>
        <div class="row-between" style="align-items:flex-start;">
          <div style="flex:1;">
            <h3 style="margin:0 0 5px; font-size:20px; font-weight:800; color:#111827;" id="detName"></h3>
            <div
              style="display:inline-block; background:#eff6ff; color:#1d4ed8; font-size:12px; font-weight:700; padding:4px 8px; border-radius:6px;"
              id="detRole"></div>
          </div>
          <button class="btn-ghost" onclick="document.getElementById('detailModal').style.display='none'"
            style="font-size:24px; padding:0 8px; line-height:1; color:#9ca3af;">&times;</button>
        </div>

        <div style="margin-top:20px; display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div style="background:#f9fafb; padding:10px; border-radius:10px;">
            <div style="font-size:11px; color:#6b7280; font-weight:600; text-transform:uppercase;">Gender</div>
            <div style="font-size:14px; font-weight:600; color:#374151; margin-top:2px;" id="detGender"></div>
          </div>
          <div style="background:#f9fafb; padding:10px; border-radius:10px;">
            <div style="font-size:11px; color:#6b7280; font-weight:600; text-transform:uppercase;">Tgl Lahir</div>
            <div style="font-size:14px; font-weight:600; color:#374151; margin-top:2px;" id="detBirth"></div>
          </div>
          <div style="background:#f9fafb; padding:10px; border-radius:10px; grid-column:span 2;">
            <div style="font-size:11px; color:#6b7280; font-weight:600; text-transform:uppercase;">No WhatsApp</div>
            <div style="font-size:14px; font-weight:600; color:#374151; margin-top:2px;" id="detPhone"></div>
          </div>
        </div>

        <div style="margin-top:20px;">
          <a id="detWaBtn" href="#" target="_blank" class="btn-primary"
            style="background:#25D366; text-decoration:none; color:#fff; display:flex; justify-content:center; align-items:center; gap:8px;">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor"
                d="M12.01 2.06c-5.5 0-9.98 4.48-9.98 9.98 0 1.95.5 3.82 1.45 5.43L2 22.01l4.67-1.22c1.55.88 3.32 1.34 5.34 1.34 5.5 0 9.98-4.48 9.98-9.98s-4.48-9.98-9.98-9.98zm5.54 14.3c-.22.64-1.29 1.15-1.78 1.18-.46.03-1.07.15-3.32-.78-2.7-1.12-4.43-3.9-4.57-4.08-.13-.18-1.09-1.45-1.09-2.77s.69-1.96.93-2.22c.24-.26.52-.32.69-.32.17 0 .34 0 .49.02.16.01.38-.06.58.42.22.51.73 1.78.79 1.91.06.13.11.28.02.45-.1.17-.15.28-.3.45-.15.17-.3.36-.43.5-.15.15-.32.32-.13.64.19.32.84 1.38 1.81 2.24 1.25 1.12 2.3 1.46 2.62 1.62.32.16.51.13.7-.09.19-.22.82-.96 1.04-1.29.22-.32.44-.27.73-.16.3.11 1.88.89 2.2 1.05.32.16.54.24.62.37.08.13.08.77-.14 1.41z" />
            </svg>
            Hubungi via WhatsApp
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    (async () => { await requireLogin(); load(); })();

    const listEl = document.getElementById("list");
    const msgEl = document.getElementById("msg");
    const qEl = document.getElementById("q");
    const countPill = document.getElementById("countPill");
    let cache = [];

    function escapeHtml(s) { return String(s || '').replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;"); }

    function render(items) {
      if (!items.length) {
        listEl.innerHTML = "<p class='muted'>Tidak ada anggota.</p>";
        countPill.style.display = "none";
        return;
      }
      countPill.textContent = items.length + " orang";
      countPill.style.display = "inline-flex";

      listEl.innerHTML = items.map(m => `
        <div class="item-card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <div class="item-left" style="cursor:pointer; flex:1;" onclick="viewMemberDetail('${m.id}')">
            <div style="font-weight:bold; color:#1590df;">${escapeHtml(m.name)}</div>
            <div style="font-size:12px; color:#666; margin-top:2px;">${escapeHtml(m.role)} ${m.pengurus_status ? ` - <span style="font-weight:600;">${escapeHtml(m.pengurus_status)}</span>` : ''}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn-secondary" style="padding:4px 10px; font-size:12px;" onclick="editMember('${m.id}')">Edit</button>
            <button class="btn-danger" style="padding:4px 10px; font-size:12px; background:#fee2e2; color:#b91c1c; border:none; border-radius:6px;" onclick="deleteMember('${m.id}', '${escapeHtml(m.name)}')">Hapus</button>
          </div>
        </div>
      `).join("");
    }

    document.getElementById("role").onchange = (e) => {
      document.getElementById("pengurusWrap").style.display = e.target.value === 'Pengurus' ? 'block' : 'none';
    };
    document.getElementById("editRole").onchange = (e) => {
      document.getElementById("editPengurusWrap").style.display = e.target.value === 'Pengurus' ? 'block' : 'none';
    };

    const handleGenderSel = (groupId, inputId) => {
      document.querySelectorAll(`#${groupId} .radio-btn`).forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll(`#${groupId} .radio-btn`).forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(inputId).value = btn.getAttribute('data-val');
        };
      });
    };
    handleGenderSel('genderGroup', 'gender');
    handleGenderSel('editGenderGroup', 'editGender');

    document.getElementById("toggleAddMemberBtn").onclick = () => {
      document.getElementById("toggleAddMemberBtn").style.display = "none";
      document.getElementById("addMemberForm").style.display = "block";
      document.getElementById("name").focus();
    };
    document.getElementById("cancelAddMemberBtn").onclick = () => {
      document.getElementById("addMemberForm").style.display = "none";
      document.getElementById("toggleAddMemberBtn").style.display = "flex";
      msgEl.textContent = "";
    };

    async function load() {
      listEl.innerHTML = "<p class='muted'>Memuat...</p>";
      try {
        // Load settings pengurus
        const { data: setDb } = await supabaseClient.from('app_settings').select('*').eq('setting_key', 'pengurus_options').single();
        let pengurusOptions = ["Ketua", "Wakil Ketua", "Sekretaris", "Bendahara", "Anggota Divisi"];
        if (setDb && setDb.setting_value) {
          try { pengurusOptions = JSON.parse(setDb.setting_value); } catch (e) { }
        }
        const optHtml = `<option value="">— pilih status —</option>` + pengurusOptions.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('');
        document.getElementById("pengurusStatus").innerHTML = optHtml;
        document.getElementById("editPengurusStatus").innerHTML = optHtml;

        const { data, error } = await supabaseClient.from('members').select('*').eq('is_active', true).order('name');
        if (error) throw error;
        cache = data;
        render(cache);
      } catch (e) { listEl.innerHTML = `<p class='msg'>Error: ${e.message}</p>`; }
    }

    document.getElementById("addBtn").onclick = async () => {
      const name = document.getElementById("name").value.trim();
      const role = document.getElementById("role").value.trim();
      const gend = document.getElementById("gender").value;
      const bdate = document.getElementById("birthDate").value;
      const ph = document.getElementById("phone").value.trim();
      const pst = document.getElementById("pengurusStatus").value;

      msgEl.textContent = "";
      if (!name || !role) return msgEl.textContent = "Data Nama & Role wajib diisi.";
      if (role === 'Pengurus' && !pst) return msgEl.textContent = "Status pengurus wajib diisi.";

      try {
        msgEl.textContent = "Menyimpan...";
        const id = `MBR-${new Date().toISOString().replace(/[-T:]/g, '').split('.')[0]}-${Math.floor(1000 + Math.random() * 9000)}`;
        const payload = { id, name, role, gender: gend };
        if (bdate) payload.birth_date = bdate;
        if (ph) payload.phone = ph;
        if (role === 'Pengurus') payload.pengurus_status = pst;

        const { error } = await supabaseClient.from('members').insert([payload]);
        if (error) throw error;
        msgEl.textContent = "Berhasil!";
        document.getElementById("name").value = ''; document.getElementById("role").value = '';
        document.getElementById("birthDate").value = ''; document.getElementById("phone").value = '';
        document.getElementById("pengurusStatus").value = '';

        document.getElementById("addMemberForm").style.display = "none";
        document.getElementById("toggleAddMemberBtn").style.display = "flex";
        await load();
      } catch (e) { msgEl.textContent = "Gagal: " + e.message; }
    };

    // FUNGSI LIHAT DETAIL
    window.viewMemberDetail = (id) => {
      const m = cache.find(x => x.id === id);
      if (!m) return;
      document.getElementById('detName').textContent = m.name;
      document.getElementById('detRole').textContent = m.role + (m.pengurus_status ? ` - ${m.pengurus_status}` : '');
      document.getElementById('detGender').textContent = m.gender || '-';

      let bDateOut = '-';
      if (m.birth_date) {
        try {
          const d = new Date(m.birth_date);
          const mth = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
          bDateOut = `${d.getDate()} ${mth[d.getMonth()]} ${d.getFullYear()}`;
          const ageDate = new Date(Date.now() - d.getTime());
          const umur = Math.abs(ageDate.getUTCFullYear() - 1970);
          bDateOut += ` (${umur} th)`;
        } catch (e) { }
      }
      document.getElementById('detBirth').textContent = bDateOut;
      document.getElementById('detPhone').textContent = m.phone || '-';

      const waBtn = document.getElementById('detWaBtn');
      if (m.phone) {
        let p = m.phone.replace(/[^0-9]/g, '');
        if (p.startsWith('0')) p = '62' + p.slice(1);
        waBtn.href = `https://wa.me/${p}`;
        waBtn.style.display = 'flex';
      } else {
        waBtn.style.display = 'none';
      }

      document.getElementById('detailModal').style.display = 'flex';
    };

    document.getElementById('detailModal').addEventListener('click', function (e) {
      if (e.target === this) this.style.display = 'none';
    });

    // FUNGSI EDIT
    window.editMember = (id) => {
      const m = cache.find(x => x.id === id);
      if (!m) return;
      // Decode HTML Entities just in case
      const decodeHtml = (html) => {
        const txt = document.createElement("textarea");
        txt.innerHTML = html;
        return txt.value;
      };

      document.getElementById('editId').value = id;
      document.getElementById('editName').value = decodeHtml(m.name);
      document.getElementById('editRole').value = decodeHtml(m.role);

      document.getElementById("editPengurusWrap").style.display = m.role === 'Pengurus' ? 'block' : 'none';
      if (m.role === 'Pengurus' && m.pengurus_status) {
        document.getElementById('editPengurusStatus').value = decodeHtml(m.pengurus_status);
      } else {
        document.getElementById('editPengurusStatus').value = '';
      }

      document.getElementById('editBirthDate').value = m.birth_date || '';
      document.getElementById('editPhone').value = m.phone || '';

      // Setup gender active class
      const g = m.gender || 'Laki-laki';
      document.getElementById('editGender').value = g;
      document.querySelectorAll('#editGenderGroup .radio-btn').forEach(b => {
        b.classList.remove('active');
        if (b.getAttribute('data-val') === g) b.classList.add('active');
      });

      document.getElementById('editModal').style.display = 'flex';
    };

    document.getElementById('editModal').addEventListener('click', function (e) {
      if (e.target === this) closeEditModal();
    });

    window.closeEditModal = () => {
      document.getElementById('editModal').style.display = 'none';
      document.getElementById('editId').value = '';
      document.getElementById('editName').value = '';
      document.getElementById('editRole').value = '';
      document.getElementById('editPengurusStatus').value = '';
      document.getElementById('editBirthDate').value = '';
      document.getElementById('editPhone').value = '';
    };

    window.saveEdit = async () => {
      const id = document.getElementById('editId').value;
      const newName = document.getElementById('editName').value.trim();
      const newRole = document.getElementById('editRole').value.trim();
      const gend = document.getElementById("editGender").value;
      const bdate = document.getElementById("editBirthDate").value;
      const ph = document.getElementById("editPhone").value.trim();
      const pst = document.getElementById("editPengurusStatus").value;

      if (!newName || !newRole) return alert("Data (Nama & Role) tidak boleh kosong!");
      if (newRole === 'Pengurus' && !pst) return alert("Status pengurus wajib diisi.");

      try {
        const btn = document.querySelector('#editModal .btn-primary');
        const originalText = btn.textContent;
        btn.textContent = 'Menyimpan...';
        btn.disabled = true;

        const payload = {
          name: newName,
          role: newRole,
          gender: gend,
          birth_date: bdate || null,
          phone: ph || null,
          pengurus_status: newRole === 'Pengurus' ? pst : null
        };

        const { error } = await supabaseClient.from('members').update(payload).eq('id', id);
        if (error) throw error;

        closeEditModal();
        load();

        btn.textContent = originalText;
        btn.disabled = false;
      } catch (e) {
        alert("Error: " + e.message);
        const btn = document.querySelector('#editModal .btn-primary');
        btn.textContent = 'Simpan';
        btn.disabled = false;
      }
    };

    // FUNGSI HAPUS (Soft Delete)
    window.deleteMember = async (id, name) => {
      if (!confirm(`Hapus ${name}? (Riwayat presensinya akan tetap aman)`)) return;
      try {
        const { error } = await supabaseClient.from('members').update({ is_active: false }).eq('id', id);
        if (error) throw error;
        load();
      } catch (e) { alert("Error: " + e.message); }
    };

    qEl.addEventListener("input", () => {
      const q = qEl.value.trim().toLowerCase();
      render(q ? cache.filter(m => String(m.name || "").toLowerCase().includes(q)) : cache);
    });

    document.getElementById("refreshBtn").onclick = load;
  </script>
</body>

</html>
