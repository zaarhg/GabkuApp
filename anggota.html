<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gabku App – Anggota</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2D3494">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html" aria-label="Kembali"><svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg></a>
          <div class="header-text">
            <div class="app-name">Anggota</div>
            <div class="app-subtitle">Kelola data anggota aktif</div>
          </div>
        </div>
        <button class="btn-ghost" id="refreshBtn" aria-label="Refresh" title="Refresh">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 1 1-9.58-2H5.26A7 7 0 1 0 12 6z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="app-main">
      <section class="section-card mt-0 coach-hidden p-0 overflow-hidden" id="toggleAddMemberBtn"
        style="cursor:pointer; border: 1px dashed var(--brand-indigo); background: var(--brand-50);">
        <div
          class="p-4 text-center font-extrabold text-main hover:bg-white transition-all flex items-center justify-center gap-2">
          <span>✨</span>
          <span class="text-sm">Tambah Anggota Baru</span>
        </div>
      </section>

      <section class="section-card mt-0" id="addMemberForm" style="display:none;">
        <div class="row-between">
          <div class="section-title m-0">Tambah Anggota</div>
          <button class="btn-ghost text-xl p-0" id="cancelAddMemberBtn">&times;</button>
        </div>

        <label class="field-label mt-3" for="name">Nama</label>
        <input id="name" type="text" class="field" placeholder="Nama anggota" />

        <label class="field-label mt-3">Gender</label>
        <div class="radio-group" id="genderGroup">
          <div class="radio-btn active" data-val="Laki-laki">Laki-laki</div>
          <div class="radio-btn" data-val="Perempuan">Perempuan</div>
        </div>
        <input type="hidden" id="gender" value="Laki-laki" />

        <label class="field-label" for="role">Role / Jabatan (Bisa pilih lebih dari satu)</label>
        <div class="role-checkbox-group" id="roleGroup">
          <div class="role-checkbox-item">
            <input type="checkbox" id="role_atlet" value="Atlet" onchange="togglePengurusField()">
            <label class="role-label" for="role_atlet">Atlet</label>
          </div>
          <div class="role-checkbox-item">
            <input type="checkbox" id="role_pelatih" value="Pelatih" onchange="togglePengurusField()">
            <label class="role-label" for="role_pelatih">Pelatih</label>
          </div>
          <div class="role-checkbox-item">
            <input type="checkbox" id="role_official" value="Official" onchange="togglePengurusField()">
            <label class="role-label" for="role_official">Official</label>
          </div>
          <div class="role-checkbox-item">
            <input type="checkbox" id="role_pengurus" value="Pengurus" onchange="togglePengurusField()">
            <label class="role-label" for="role_pengurus">Pengurus</label>
          </div>
        </div>

        <div id="pengurusWrap" class="mt-3" style="display:none;">
          <label class="field-label" for="pengurusStatus">Status Kepengurusan</label>
          <select id="pengurusStatus" class="field">
            <option value="">— pilih status —</option>
          </select>
        </div>

        <label class="field-label mt-3" for="birthDate">Tanggal Lahir</label>
        <input id="birthDate" type="date" class="field mb-3" />

        <label class="field-label" for="phone">No. WhatsApp</label>
        <input id="phone" type="tel" class="field mb-3" placeholder="Contoh: 0812xxxx (opsional)" />

        <div class="mt-4">
          <button id="addBtn" class="btn-primary" type="button">Simpan Anggota</button>
        </div>
        <p id="msg" class="tool-msg text-center mt-3"></p>
      </section>

      <section class="section-card">
        <div class="row-between">
          <div class="section-title m-0">Daftar Anggota</div>
          <span class="stats-badge-pill" id="countPill" style="display:none;"></span>
        </div>
        <div class="mt-3">
          <input id="q" type="text" class="field" placeholder="Cari nama anggota..." />
        </div>
        <div id="list" class="mt-3 flex-col gap-2"></div>
      </section>
    </main>

    <!-- Modal Edit -->
    <div id="editModal" class="modal-overlay" style="display:none;">
      <div class="modal-card">
        <div class="section-title mt-0">Edit Anggota</div>
        <input type="hidden" id="editId" />

        <label class="field-label" for="editName">Nama</label>
        <input id="editName" type="text" class="field mb-3" />

        <label class="field-label mt-3">Gender</label>
        <div class="radio-group" id="editGenderGroup">
          <div class="radio-btn" data-val="Laki-laki">Laki-laki</div>
          <div class="radio-btn" data-val="Perempuan">Perempuan</div>
        </div>
        <input type="hidden" id="editGender" value="" />

        <label class="field-label mt-3" for="editRole">Role / Jabatan</label>
        <div class="role-checkbox-group" id="editRoleGroup">
          <div class="role-checkbox-item">
            <input type="checkbox" id="edit_role_atlet" value="Atlet" onchange="toggleEditPengurusField()">
            <label class="role-label" for="edit_role_atlet">Atlet</label>
          </div>
          <div class="role-checkbox-item">
            <input type="checkbox" id="edit_role_pelatih" value="Pelatih" onchange="toggleEditPengurusField()">
            <label class="role-label" for="edit_role_pelatih">Pelatih</label>
          </div>
          <div class="role-checkbox-item">
            <input type="checkbox" id="edit_role_official" value="Official" onchange="toggleEditPengurusField()">
            <label class="role-label" for="edit_role_official">Official</label>
          </div>
          <div class="role-checkbox-item">
            <input type="checkbox" id="edit_role_pengurus" value="Pengurus" onchange="toggleEditPengurusField()">
            <label class="role-label" for="edit_role_pengurus">Pengurus</label>
          </div>
        </div>

        <div id="editPengurusWrap" class="mt-3" style="display:none;">
          <label class="field-label" for="editPengurusStatus">Status Kepengurusan</label>
          <select id="editPengurusStatus" class="field mb-3">
            <option value="">— pilih status —</option>
          </select>
        </div>

        <label class="field-label mt-3" for="editBirthDate">Tanggal Lahir</label>
        <input id="editBirthDate" type="date" class="field mb-3" />

        <label class="field-label" for="editPhone">No. WhatsApp</label>
        <input id="editPhone" type="tel" class="field mb-3" />

        <div class="flex justify-end gap-3 mt-4">
          <button class="btn-secondary" onclick="closeEditModal()">Batal</button>
          <button class="btn-primary" onclick="saveEdit()">Simpan</button>
        </div>
      </div>
    </div>

    <!-- Modal Detail Anggota -->
    <div id="detailModal" class="modal-overlay modal-bottom" style="display:none;">
      <div class="modal-card">
        <div class="modal-handle"></div>
        <div class="row-between items-start">
          <div class="flex-1">
            <h3 class="m-0 text-xl font-extrabold text-main" id="detName"></h3>
            <div class="badge badge-primary mt-1" id="detRole"></div>
          </div>
          <button class="modal-close"
            onclick="document.getElementById('detailModal').style.display='none'">&times;</button>
        </div>

        <div class="detail-grid">
          <div class="detail-box">
            <div class="detail-label">Gender</div>
            <div class="detail-value" id="detGender"></div>
          </div>
          <div class="detail-box">
            <div class="detail-label">Tgl Lahir</div>
            <div class="detail-value" id="detBirth"></div>
          </div>
          <div class="detail-box full">
            <div class="detail-label">No WhatsApp</div>
            <div class="detail-value" id="detPhone"></div>
          </div>
        </div>

        <div class="mt-4">
          <a id="detWaBtn" href="#" target="_blank" class="btn-primary" style="background:#25D366; gap:8px;">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor"
                d="M12.01 2.06c-5.5 0-9.98 4.48-9.98 9.98 0 1.95.5 3.82 1.45 5.43L2 22.01l4.67-1.22c1.55.88 3.32 1.34 5.34 1.34 5.5 0 9.98-4.48 9.98-9.98s-4.48-9.98-9.98-9.98zm5.54 14.3c-.22.64-1.29 1.15-1.78 1.18-.46.03-1.07.15-3.32-.78-2.7-1.12-4.43-3.9-4.57-4.08-.13-.18-1.09-1.45-1.09-2.77s.69-1.96.93-2.22c.24-.26.52-.32.69-.32.17 0 .34 0 .49.02.16.01.38-.06.58.42.22.51.73 1.78.79 1.91.06.13.11.28.02.45-.1.17-.15.28-.3.45-.15.17-.3.36-.43.5-.15.15-.32.32-.13.64.19.32.84 1.38 1.81 2.24 1.25 1.12 2.3 1.46 2.62 1.62.32.16.51.13.7-.09.19-.22.82-.96 1.04-1.29.22-.32.44-.27.73-.16.3.11 1.88.89 2.2 1.05.32.16.54.24.62.37.08.13.08.77-.14 1.41z" />
            </svg>
            Hubungi via WhatsApp
          </a>
        </div>
      </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="customConfirm" class="modal-overlay" style="display:none;">
      <div class="modal-card text-center">
        <h3 class="mt-0 text-base font-bold" id="confirmTitle">Peringatan</h3>
        <p id="confirmMsg" class="text-sm text-muted mb-5"></p>
        <div class="flex justify-center gap-3">
          <button id="confirmBtnNo" class="btn-secondary">Batal</button>
          <button id="confirmBtnYes" class="btn-primary">Ya, Hapus</button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    (async () => { await requireLogin(); load(); })();

    const listEl = document.getElementById("list");
    const msgEl = document.getElementById("msg");
    const qEl = document.getElementById("q");
    const countPill = document.getElementById("countPill");
    let cache = [];

    function escapeHtml(s) { return String(s || '').replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;"); }

    function render(items) {
      if (!items.length) {
        listEl.innerHTML = "<p class='muted text-center py-8'>Tidak ada anggota ditemukan.</p>";
        countPill.style.display = "none";
        return;
      }
      countPill.textContent = items.length + " Orang";
      countPill.style.display = "inline-flex";

      listEl.innerHTML = `<div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">` + items.map(m => `
        <div class="session-row">
          <div class="session-info" onclick="viewMemberDetail('${m.id}')" style="cursor:pointer;">
            <div class="font-extrabold text-base text-main">${escapeHtml(m.name)}</div>
            <div class="text-xs text-muted mt-1">
              ${escapeHtml(m.role)} ${m.pengurus_status ? ` • <span class="font-bold text-indigo-600">${escapeHtml(m.pengurus_status)}</span>` : ''}
            </div>
          </div>
          <div class="session-actions-group admin-only">
            <button class="btn-secondary btn-icon" title="Edit Anggota" onclick="editMember('${m.id}')">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="btn-danger btn-icon" title="Hapus Anggota" onclick="deleteMember('${m.id}', '${escapeHtml(m.name)}')">
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>
          </div>
        </div>
      `).join("") + `</div>`;
    }

    function togglePengurusField() {
      const isPengurus = document.getElementById('role_pengurus').checked;
      document.getElementById("pengurusWrap").style.display = isPengurus ? 'block' : 'none';
    }
    function toggleEditPengurusField() {
      const isPengurus = document.getElementById('edit_role_pengurus').checked;
      document.getElementById("editPengurusWrap").style.display = isPengurus ? 'block' : 'none';
    }

    const handleGenderSel = (groupId, inputId) => {
      document.querySelectorAll(`#${groupId} .radio-btn`).forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll(`#${groupId} .radio-btn`).forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(inputId).value = btn.getAttribute('data-val');
        };
      });
    };
    handleGenderSel('genderGroup', 'gender');
    handleGenderSel('editGenderGroup', 'editGender');

    document.getElementById("toggleAddMemberBtn").onclick = () => {
      document.getElementById("toggleAddMemberBtn").style.display = "none";
      document.getElementById("addMemberForm").style.display = "block";
      document.getElementById("name").focus();
    };
    document.getElementById("cancelAddMemberBtn").onclick = () => {
      document.getElementById("addMemberForm").style.display = "none";
      document.getElementById("toggleAddMemberBtn").style.display = "flex";
      msgEl.textContent = "";
    };

    async function load() {
      listEl.innerHTML = "<p class='muted'>Memuat...</p>";
      try {
        // Load settings pengurus
        const { data: setDb } = await supabaseClient.from('app_settings').select('*').eq('setting_key', 'pengurus_options').single();
        let pengurusOptions = ["Ketua", "Wakil Ketua", "Sekretaris", "Bendahara", "Anggota Divisi"];
        if (setDb && setDb.setting_value) {
          try { pengurusOptions = JSON.parse(setDb.setting_value); } catch (e) { }
        }
        const optHtml = `<option value="">— pilih status —</option>` + pengurusOptions.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('');
        document.getElementById("pengurusStatus").innerHTML = optHtml;
        document.getElementById("editPengurusStatus").innerHTML = optHtml;

        const { data, error } = await supabaseClient.from('members').select('*').eq('is_active', true).order('name');
        if (error) throw error;
        cache = data;
        render(cache);
      } catch (e) { listEl.innerHTML = `<p class='msg'>Error: ${e.message}</p>`; }
    }

    document.getElementById("addBtn").onclick = async () => {
      const name = document.getElementById("name").value.trim();

      // Collect multi-roles
      const roles = [];
      document.querySelectorAll('#roleGroup input[type="checkbox"]:checked').forEach(cb => roles.push(cb.value));
      const role = roles.join(', ');

      const gend = document.getElementById("gender").value;
      const bdate = document.getElementById("birthDate").value;
      const ph = document.getElementById("phone").value.trim();
      const pst = document.getElementById("pengurusStatus").value;

      msgEl.textContent = "";
      if (!name || !role) return msgEl.textContent = "Data Nama & Role wajib diisi.";
      if (roles.includes('Pengurus') && !pst) return msgEl.textContent = "Status pengurus wajib diisi.";

      try {
        msgEl.textContent = "Menyimpan...";
        const id = `MBR-${new Date().toISOString().replace(/[-T:]/g, '').split('.')[0]}-${Math.floor(1000 + Math.random() * 9000)}`;
        const payload = { id, name, role, gender: gend };
        if (bdate) payload.birth_date = bdate;
        if (ph) payload.phone = ph;
        if (roles.includes('Pengurus')) payload.pengurus_status = pst;

        const { error } = await supabaseClient.from('members').insert([payload]);
        if (error) throw error;
        msgEl.textContent = "Berhasil!";
        document.getElementById("name").value = '';
        document.querySelectorAll('#roleGroup input[type="checkbox"]').forEach(cb => cb.checked = false);
        togglePengurusField();
        document.getElementById("birthDate").value = '';
        document.getElementById("phone").value = '';
        document.getElementById("pengurusStatus").value = '';

        document.getElementById("addMemberForm").style.display = "none";
        document.getElementById("toggleAddMemberBtn").style.display = "flex";
        await load();
      } catch (e) { msgEl.textContent = "Gagal: " + e.message; }
    };

    // FUNGSI LIHAT DETAIL
    window.viewMemberDetail = (id) => {
      const m = cache.find(x => x.id === id);
      if (!m) return;
      document.getElementById('detName').textContent = m.name;
      document.getElementById('detRole').textContent = m.role + (m.pengurus_status ? ` - ${m.pengurus_status}` : '');
      document.getElementById('detGender').textContent = m.gender || '-';

      let bDateOut = '-';
      if (m.birth_date) {
        try {
          const d = new Date(m.birth_date);
          const mth = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
          bDateOut = `${d.getDate()} ${mth[d.getMonth()]} ${d.getFullYear()}`;
          const ageDate = new Date(Date.now() - d.getTime());
          const umur = Math.abs(ageDate.getUTCFullYear() - 1970);
          bDateOut += ` (${umur} th)`;
        } catch (e) { }
      }
      document.getElementById('detBirth').textContent = bDateOut;
      document.getElementById('detPhone').textContent = m.phone || '-';

      const waBtn = document.getElementById('detWaBtn');
      if (m.phone) {
        let p = m.phone.replace(/[^0-9]/g, '');
        if (p.startsWith('0')) p = '62' + p.slice(1);
        waBtn.href = `https://wa.me/${p}`;
        waBtn.style.display = 'flex';
      } else {
        waBtn.style.display = 'none';
      }

      document.getElementById('detailModal').style.display = 'flex';
    };

    document.getElementById('detailModal').addEventListener('click', function (e) {
      if (e.target === this) this.style.display = 'none';
    });

    // FUNGSI EDIT
    window.editMember = (id) => {
      const m = cache.find(x => x.id === id);
      if (!m) return;
      // Decode HTML Entities just in case
      const decodeHtml = (html) => {
        const txt = document.createElement("textarea");
        txt.innerHTML = html;
        return txt.value;
      };

      document.getElementById('editId').value = id;
      document.getElementById('editName').value = decodeHtml(m.name);

      // Setup multi-roles checkboxes
      const roles = (m.role || '').split(',').map(r => r.trim());
      document.querySelectorAll('#editRoleGroup input[type="checkbox"]').forEach(cb => {
        cb.checked = roles.includes(cb.value);
      });
      toggleEditPengurusField();

      if (roles.includes('Pengurus') && m.pengurus_status) {
        document.getElementById('editPengurusStatus').value = decodeHtml(m.pengurus_status);
      } else {
        document.getElementById('editPengurusStatus').value = '';
      }

      document.getElementById('editBirthDate').value = m.birth_date || '';
      document.getElementById('editPhone').value = m.phone || '';

      // Setup gender active class
      const g = m.gender || 'Laki-laki';
      document.getElementById('editGender').value = g;
      document.querySelectorAll('#editGenderGroup .radio-btn').forEach(b => {
        b.classList.remove('active');
        if (b.getAttribute('data-val') === g) b.classList.add('active');
      });

      document.getElementById('editModal').style.display = 'flex';
    };

    document.getElementById('editModal').addEventListener('click', function (e) {
      if (e.target === this) closeEditModal();
    });

    window.closeEditModal = () => {
      document.getElementById('editModal').style.display = 'none';
      document.getElementById('editId').value = '';
      document.getElementById('editName').value = '';
      document.querySelectorAll('#editRoleGroup input[type="checkbox"]').forEach(cb => cb.checked = false);
      document.getElementById('editPengurusStatus').value = '';
      document.getElementById('editBirthDate').value = '';
      document.getElementById('editPhone').value = '';
    };

    window.saveEdit = async () => {
      const id = document.getElementById('editId').value;
      const newName = document.getElementById('editName').value.trim();

      // Collect multi-roles
      const roles = [];
      document.querySelectorAll('#editRoleGroup input[type="checkbox"]:checked').forEach(cb => roles.push(cb.value));
      const newRole = roles.join(', ');

      const gend = document.getElementById("editGender").value;
      const bdate = document.getElementById("editBirthDate").value;
      const ph = document.getElementById("editPhone").value.trim();
      const pst = document.getElementById("editPengurusStatus").value;

      if (!newName || !newRole) return alert("Data (Nama & Role) tidak boleh kosong!");
      if (roles.includes('Pengurus') && !pst) return alert("Status pengurus wajib diisi.");

      try {
        const btn = document.querySelector('#editModal .btn-primary');
        const originalText = btn.textContent;
        btn.textContent = 'Menyimpan...';
        btn.disabled = true;

        const payload = {
          name: newName,
          role: newRole,
          gender: gend,
          birth_date: bdate || null,
          phone: ph || null,
          pengurus_status: roles.includes('Pengurus') ? pst : null
        };

        const { error } = await supabaseClient.from('members').update(payload).eq('id', id);
        if (error) throw error;

        closeEditModal();
        load();

        btn.textContent = originalText;
        btn.disabled = false;
      } catch (e) {
        alert("Error: " + e.message);
        const btn = document.querySelector('#editModal .btn-primary');
        btn.textContent = 'Simpan';
        btn.disabled = false;
      }
    };

    function asyncConfirm(msg, title = "Peringatan") {
      return new Promise((resolve) => {
        const modal = document.getElementById("customConfirm");
        document.getElementById("confirmTitle").textContent = title;
        document.getElementById("confirmMsg").textContent = msg;
        modal.style.display = 'flex';

        document.getElementById("confirmBtnYes").onclick = () => { modal.style.display = 'none'; resolve(true); };
        document.getElementById("confirmBtnNo").onclick = () => { modal.style.display = 'none'; resolve(false); };
      });
    }

    // FUNGSI HAPUS (Soft Delete)
    window.deleteMember = async (id, name) => {
      const proceed = await asyncConfirm(`Hapus ${name}? (Riwayat presensinya akan tetap aman)`);
      if (!proceed) return;
      try {
        const { error } = await supabaseClient.from('members').update({ is_active: false }).eq('id', id);
        if (error) throw error;
        load();
      } catch (e) { alert("Error: " + e.message); }
    };

    qEl.addEventListener("input", () => {
      const q = qEl.value.trim().toLowerCase();
      render(q ? cache.filter(m => String(m.name || "").toLowerCase().includes(q)) : cache);
    });

    document.getElementById("refreshBtn").onclick = load;
  </script>
</body>

</html>
