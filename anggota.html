<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gabku App – Anggota</title>

  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />
</head>
<body>

  <div class="app">

    <!-- HEADER (selaras dengan index/kegiatan) -->
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html" aria-label="Kembali" title="Kembali">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z"/>
            </svg>
          </a>

          <div class="header-text">
            <div class="app-name">Anggota</div>
            <div class="app-subtitle">Tambah & kelola data anggota</div>
          </div>
        </div>

        <button class="btn-ghost" id="refreshBtn" type="button" aria-label="Refresh" title="Refresh">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor"
              d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 1 1-9.58-2H5.26A7 7 0 1 0 12 6z"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="app-main">

      <!-- CARD: Tambah Anggota -->
      <section class="section-card" style="margin-top:0;">
        <div class="section-title">Tambah Anggota</div>

        <label class="field-label" for="name">Nama</label>
        <input id="name" type="text" class="field" placeholder="Nama anggota" />

        <label class="field-label" for="role">Role / Jabatan</label>
        <select id="role" class="field">
          <option value="">— pilih —</option>
          <option>Atlet</option>
          <option>Pelatih</option>
          <option>Official</option>
          <option>Pengurus</option>
        </select>

        <div class="row-actions">
          <button id="addBtn" class="btn-primary" type="button">Simpan</button>
          <button class="btn-secondary" type="button"
            onclick="document.getElementById('name').value=''; document.getElementById('role').value=''; document.getElementById('msg').textContent='';">
            Batal
          </button>
        </div>

        <p id="msg" class="tool-msg" style="margin-top:10px;"></p>
      </section>

      <!-- CARD: Daftar + Cari -->
      <section class="section-card">
        <div class="row-between">
          <div class="section-title" style="margin:0;">Daftar Anggota</div>
          <span class="pill" id="countPill" style="display:none;"></span>
        </div>

        <div style="margin-top:12px;">
          <label class="field-label" for="q" style="margin-top:0;">Cari anggota</label>
          <input id="q" type="text" class="field" placeholder="Ketik nama untuk mencari..." />
        </div>

        <div id="list" style="margin-top:12px;"></div>
      </section>

    </main>
  </div>

  <!-- SCRIPTS (logika tetap: pakai requireLogin + apiGet/apiPost) -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>

  <script>
    requireLogin();

    const listEl = document.getElementById("list");
    const msgEl = document.getElementById("msg");
    const qEl = document.getElementById("q");
    const countPill = document.getElementById("countPill");

    let cache = [];

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function render(items) {
      if (!items.length) {
        listEl.innerHTML = "<p class='muted'>Belum ada anggota.</p>";
        countPill.style.display = "none";
        return;
      }
      countPill.textContent = items.length + " orang";
      countPill.style.display = "inline-flex";

      listEl.innerHTML = items.map(m => `
        <div class="item-card">
          <div class="item-left">
            <div class="item-title">${escapeHtml(m.name)}</div>
            <div class="item-sub">${escapeHtml(m.role)} • ID: ${escapeHtml(String(m.member_id))}</div>
          </div>
        </div>
      `).join("");
    }

    async function load() {
      listEl.innerHTML = "<p class='muted'>Memuat...</p>";
      countPill.style.display = "none";
      try {
        cache = await apiGet("listMembers");
        render(cache);
      } catch (e) {
        listEl.innerHTML = `<p class='msg'>Gagal load: ${escapeHtml(e.message)}</p>`;
      }
    }

    async function add() {
      const name = document.getElementById("name").value.trim();
      const role = document.getElementById("role").value.trim();
      msgEl.textContent = "";

      if (!name) { msgEl.textContent = "Nama wajib diisi."; return; }
      if (!role) { msgEl.textContent = "Role wajib dipilih."; return; }

      try {
        msgEl.textContent = "Menyimpan...";
        await apiPost("createMemberQuick", { name, role });
        msgEl.textContent = "Berhasil ditambahkan.";
        document.getElementById("name").value = "";
        document.getElementById("role").value = "";
        await load();
      } catch (e) {
        msgEl.textContent = "Gagal: " + e.message;
      }
    }

    qEl.addEventListener("input", () => {
      const q = qEl.value.trim().toLowerCase();
      if (!q) return render(cache);
      render(cache.filter(m => String(m.name || "").toLowerCase().includes(q)));
    });

    document.getElementById("addBtn").addEventListener("click", add);
    document.getElementById("refreshBtn").addEventListener("click", load);

    load();
  </script>

  <!-- CSS lokal kecil (HANYA tampilan, selaras) -->
  <style>
    .header-bar{
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 0 2px;
    }
    .header-left{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .header-text{ min-width: 0; }
    .app-name{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-subtitle{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .icon-back{
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.14);
      color: #fff;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      flex: 0 0 auto;
    }
    .icon-back:active{ transform: translateY(1px); }

    .btn-ghost{
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.10);
      color: #fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      flex: 0 0 auto;
    }
    .btn-ghost:active{ transform: translateY(1px); }

    .field{
      width: 100%;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fff;
      outline: none;
    }
    .field:focus{
      border-color: rgba(30,136,229,.45);
      box-shadow: 0 0 0 4px rgba(30,136,229,.12);
    }
    .field-label{
      display:block;
      margin-top: 10px;
      margin-bottom: 6px;
      font-weight: 800;
      font-size: 13px;
      color: var(--text);
    }

    .row-actions{
      display:flex;
      gap:10px;
      margin-top: 12px;
    }
    .row-actions .btn-primary{
      flex: 1;
      border-radius: 14px;
      padding: 12px 14px;
      font-weight: 900;
    }
    .row-actions .btn-secondary{
      width: min(42%, 160px);
      border-radius: 14px;
      padding: 12px 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .row-between{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .pill{
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 12px;
      color: rgba(2,8,23,.7);
      background: rgba(2,8,23,.06);
      border: 1px solid rgba(2,8,23,.06);
      white-space: nowrap;
    }

    .item-card{
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(2,8,23,.08);
      background: #fff;
      box-shadow: 0 10px 22px rgba(2,8,23,.06);
      margin-bottom: 10px;
    }
    .item-left{ min-width: 0; }
    .item-title{
      font-weight: 900;
      font-size: 14px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .item-sub{
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
  </style>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>


</body>
</html>
