<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gabku App – Anggota</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#198cda">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html" aria-label="Kembali"><svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg></a>
          <div class="header-text">
            <div class="app-name">Anggota</div>
            <div class="app-subtitle">Kelola data anggota aktif</div>
          </div>
        </div>
        <button class="btn-ghost" id="refreshBtn" aria-label="Refresh" title="Refresh">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 1 1-9.58-2H5.26A7 7 0 1 0 12 6z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="app-main">
      <button id="toggleAddMemberBtn" class="btn-primary coach-hidden mt-0 mb-4" type="button">
        + Tambah Anggota Baru
      </button>

      <section class="section-card">
        <div class="row-between">
          <div class="section-title m-0">Daftar Anggota</div>
          <span class="stats-badge-pill" id="countPill" style="display:none;"></span>
        </div>
        <div class="mt-3">
          <input id="q" type="text" class="field" placeholder="Cari nama anggota..." />
        </div>
        <div id="list" class="mt-3 flex-col gap-2"></div>
      </section>
    </main>

    <!-- Modal Tambah Anggota -->
    <div id="addMemberModal" class="modal-overlay" style="display:none;">
      <div class="modal-card">
        <div class="row-between">
          <div class="section-title m-0">Tambah Anggota Baru</div>
        </div>

        <label class="field-label mt-3" for="name">Nama</label>
        <input id="name" type="text" class="field" placeholder="Nama anggota" />

        <label class="field-label mt-3">Gender</label>
        <div class="radio-group" id="genderGroup">
          <div class="radio-btn active" data-val="Laki-laki">Laki-laki</div>
          <div class="radio-btn" data-val="Perempuan">Perempuan</div>
        </div>
        <input type="hidden" id="gender" value="Laki-laki" />

        <label class="field-label mt-3" for="role">Role / Jabatan (Bisa pilih lebih dari satu)</label>
        <div class="role-checkbox-group" id="roleGroup">
          <div class="role-checkbox-item">
            <input type="checkbox" id="role_atlet" value="Atlet" onchange="togglePengurusField()">
            <label class="role-label" for="role_atlet">Atlet</label>
          </div>
          <div class="role-checkbox-item">
            <input type="checkbox" id="role_pelatih" value="Pelatih" onchange="togglePengurusField()">
            <label class="role-label" for="role_pelatih">Pelatih</label>
          </div>
          <div class="role-checkbox-item">
            <input type="checkbox" id="role_official" value="Official" onchange="togglePengurusField()">
            <label class="role-label" for="role_official">Official</label>
          </div>
          <div class="role-checkbox-item">
            <input type="checkbox" id="role_pengurus" value="Pengurus" onchange="togglePengurusField()">
            <label class="role-label" for="role_pengurus">Pengurus</label>
          </div>
        </div>

        <div id="pengurusWrap" class="mt-3" style="display:none;">
          <label class="field-label" for="pengurusStatus">Status Kepengurusan</label>
          <select id="pengurusStatus" class="field">
            <option value="">— pilih status —</option>
          </select>
        </div>

        <label class="field-label mt-3" for="birthDate">Tanggal Lahir</label>
        <input id="birthDate" type="date" class="field mb-3" />

        <label class="field-label" for="phone">No. WhatsApp</label>
        <input id="phone" type="tel" class="field mb-3" placeholder="Contoh: 0812xxxx (opsional)" />

        <div class="flex justify-end gap-3 mt-4">
          <button class="btn-secondary" id="cancelAddMemberBtnSec">Batal</button>
          <button id="addBtn" class="btn-primary" type="button">Simpan Anggota</button>
        </div>
        <p id="msg" class="tool-msg text-center mt-3"></p>
      </div>
    </div>

    <!-- Modal Edit -->
    <div id="editModal" class="modal-overlay" style="display:none;">
      <div class="modal-card">
        <div class="section-title mt-0">Edit Anggota</div>
        <input type="hidden" id="editId" />

        <label class="field-label" for="editName">Nama</label>
        <input id="editName" type="text" class="field mb-3" />

        <label class="field-label mt-3">Gender</label>
        <div class="radio-group" id="editGenderGroup">
          <div class="radio-btn" data-val="Laki-laki">Laki-laki</div>
          <div class="radio-btn" data-val="Perempuan">Perempuan</div>
        </div>
        <input type="hidden" id="editGender" value="" />

        <label class="field-label mt-3" for="editRole">Role / Jabatan</label>
        <div class="role-checkbox-group" id="editRoleGroup">
          <div class="role-checkbox-item">
            <input type="checkbox" id="edit_role_atlet" value="Atlet" onchange="toggleEditPengurusField()">
            <label class="role-label" for="edit_role_atlet">Atlet</label>
          </div>
          <div class="role-checkbox-item">
            <input type="checkbox" id="edit_role_pelatih" value="Pelatih" onchange="toggleEditPengurusField()">
            <label class="role-label" for="edit_role_pelatih">Pelatih</label>
          </div>
          <div class="role-checkbox-item">
            <input type="checkbox" id="edit_role_official" value="Official" onchange="toggleEditPengurusField()">
            <label class="role-label" for="edit_role_official">Official</label>
          </div>
          <div class="role-checkbox-item">
            <input type="checkbox" id="edit_role_pengurus" value="Pengurus" onchange="toggleEditPengurusField()">
            <label class="role-label" for="edit_role_pengurus">Pengurus</label>
          </div>
        </div>

        <div id="editPengurusWrap" class="mt-3" style="display:none;">
          <label class="field-label" for="editPengurusStatus">Status Kepengurusan</label>
          <select id="editPengurusStatus" class="field mb-3">
            <option value="">— pilih status —</option>
          </select>
        </div>

        <label class="field-label mt-3" for="editBirthDate">Tanggal Lahir</label>
        <input id="editBirthDate" type="date" class="field mb-3" />

        <label class="field-label" for="editPhone">No. WhatsApp</label>
        <input id="editPhone" type="tel" class="field mb-3" />

        <div class="flex justify-end gap-3 mt-4">
          <button class="btn-secondary" onclick="closeEditModal()">Batal</button>
          <button class="btn-primary" onclick="saveEdit()">Simpan</button>
        </div>
      </div>
    </div>

    <!-- Modal Detail Anggota -->
    <div id="detailModal" class="modal-overlay modal-bottom" style="display:none;">
      <div class="modal-card">
        <div class="modal-handle"></div>
        <div class="row-between items-start">
          <div class="flex-1">
            <h3 class="m-0 text-xl font-extrabold text-main" id="detName"></h3>
            <div class="badge badge-primary mt-1" id="detRole"></div>
          </div>
          <button class="modal-close"
            onclick="document.getElementById('detailModal').style.display='none'">&times;</button>
        </div>

        <div class="detail-grid">
          <div class="detail-box">
            <div class="detail-label">Gender</div>
            <div class="detail-value" id="detGender"></div>
          </div>
          <div class="detail-box">
            <div class="detail-label">Tgl Lahir</div>
            <div class="detail-value" id="detBirth"></div>
          </div>
          <div class="detail-box full">
            <div class="detail-label">No WhatsApp</div>
            <div class="detail-value" id="detPhone"></div>
          </div>
        </div>

        <div class="mt-4">
          <a id="detWaBtn" href="#" target="_blank" class="btn-primary" style="background:#25D366; gap:8px;">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor"
                d="M12.01 2.06c-5.5 0-9.98 4.48-9.98 9.98 0 1.95.5 3.82 1.45 5.43L2 22.01l4.67-1.22c1.55.88 3.32 1.34 5.34 1.34 5.5 0 9.98-4.48 9.98-9.98s-4.48-9.98-9.98-9.98zm5.54 14.3c-.22.64-1.29 1.15-1.78 1.18-.46.03-1.07.15-3.32-.78-2.7-1.12-4.43-3.9-4.57-4.08-.13-.18-1.09-1.45-1.09-2.77s.69-1.96.93-2.22c.24-.26.52-.32.69-.32.17 0 .34 0 .49.02.16.01.38-.06.58.42.22.51.73 1.78.79 1.91.06.13.11.28.02.45-.1.17-.15.28-.3.45-.15.17-.3.36-.43.5-.15.15-.32.32-.13.64.19.32.84 1.38 1.81 2.24 1.25 1.12 2.3 1.46 2.62 1.62.32.16.51.13.7-.09.19-.22.82-.96 1.04-1.29.22-.32.44-.27.73-.16.3.11 1.88.89 2.2 1.05.32.16.54.24.62.37.08.13.08.77-.14 1.41z" />
            </svg>
            Hubungi via WhatsApp
          </a>
        </div>
      </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="customConfirm" class="modal-overlay" style="display:none;">
      <div class="modal-card text-center">
        <h3 class="mt-0 text-base font-bold" id="confirmTitle">Peringatan</h3>
        <p id="confirmMsg" class="text-sm text-muted mb-5"></p>
        <div class="flex justify-center gap-3">
          <button id="confirmBtnNo" class="btn-primary">Batal</button>
          <button id="confirmBtnYes" class="btn-danger">Ya, Hapus</button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/anggota.js"></script>
</body>

</html>
