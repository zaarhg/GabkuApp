<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profil - Gabku App</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="app">
    <!-- HEADER -->
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg>
          </a>
          <div class="header-text">
            <div class="app-name">Profil Saya</div>
            <div class="app-subtitle">Pengaturan Akun Personal</div>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="section-card mt-0 text-center">
        <div class="profile-avatar-large mx-auto"
          style="width: 80px; height: 80px; border-radius: 50%; background: var(--brand-50); color: var(--brand-600); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; margin: 0 auto 16px; border: 2px solid var(--brand-100);">
          👤
        </div>
        <h2 id="profileName" class="m-0 text-xl font-extrabold">Halo, Pengguna</h2>
        <p id="profileEmail" class="text-sm text-muted mt-1">user@example.com</p>
      </section>

      <section class="section-card">
        <div class="section-title m-0 mb-3">Sesi</div>
        <button onclick="logout()" class="btn-delete" style="width: 100%; height: 48px;">
          Keluar dari Akun
        </button>
      </section>
    </main>

    <!-- Bottom Nav Placeholder (will be added via CSS/HTML shared later) -->
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await requireLogin();
      // Simple display for now
      const user = JSON.parse(localStorage.getItem('gabku_user_meta') || '{}');
      if (user.email) {
        document.getElementById('profileEmail').textContent = user.email;
        // Try to get name from email part if name not found
        const namePart = user.email.split('@')[0].replace(/[._]/g, ' ');
        document.getElementById('profileName').textContent = 'Halo, ' + (namePart.charAt(0).toUpperCase() + namePart.slice(1));
      }
    });

    async function logout() {
      const { error } = await supabaseClient.auth.signOut();
      localStorage.removeItem('gabku_session');
      localStorage.removeItem('gabku_user_meta');
      window.location.href = 'login.html';
    }
  </script>
</body>

</html>
