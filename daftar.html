<!doctype html>
<html lang="id" class="login-page-body">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Daftar Akun - Gabku App</title>

  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="login-page-body">

  <div class="login-wrapper">
    <div class="login-header">
      <div class="login-logo-circle">
        <img src="assets/img/logo.png" alt="Gabku" style="width:100%; height:100%; object-fit:contain;" />
      </div>
      <div class="login-brand">Daftar Akun</div>
      <div class="login-subtitle">Bergabung dengan Gabku App</div>
    </div>

    <form class="login-card-premium" onsubmit="return false;">
      <div class="login-input-group">
        <div class="login-input-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>
        <input id="full_name" type="text" class="field" placeholder="Nama Lengkap Anda" />
      </div>

      <div class="login-input-group">
        <div class="login-input-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
            <polyline points="22,6 12,13 2,6" />
          </svg>
        </div>
        <input id="email" type="email" class="field" placeholder="Email (nama@email.com)" autocomplete="email" />
      </div>

      <div class="login-input-group">
        <div class="login-input-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </div>
        <input id="password" type="password" class="field" placeholder="Kata Sandi (Min. 6 karakter)"
          autocomplete="new-password" />
      </div>

      <button id="btn" class="btn-primary btn-auth" type="button" onclick="doRegister()">
        Daftar Sekarang
      </button>

      <p id="msg" class="tool-msg text-center mt-4 font-bold"></p>
    </form>

    <div class="login-footer">
      Sudah punya akun? <a href="login.html">Masuk di sini</a>
      <div style="margin-top: 15px; opacity: 0.7; font-style: italic; font-size: 11px;">
        Pendaftaran akan diverifikasi oleh Admin.
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>

  <script>
    const nameEl = document.getElementById("full_name");
    const emailEl = document.getElementById("email");
    const passEl = document.getElementById("password");
    const msgEl = document.getElementById("msg");
    const btnEl = document.getElementById("btn");

    async function doRegister() {
      const name = nameEl.value.trim();
      const email = emailEl.value.trim();
      const password = passEl.value.trim();

      if (!name || !email || !password) {
        msgEl.textContent = "Semua kolom wajib diisi.";
        msgEl.style.color = "var(--danger)";
        return;
      }

      if (password.length < 6) {
        msgEl.textContent = "Password minimal 6 karakter.";
        msgEl.style.color = "var(--danger)";
        return;
      }

      btnEl.disabled = true;
      btnEl.textContent = "Mendaftarkan...";
      msgEl.textContent = "";

      try {
        const { data: authData, error: authError } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
        });

        if (authError) throw authError;

        const userId = authData.user.id;

        const { error: profError } = await supabaseClient.from('profiles').insert({
          id: userId,
          full_name: name,
          email: email,
          status: 'Menunggu'
        });

        if (profError) throw profError;

        msgEl.textContent = "Pendaftaran Berhasil! Mengalihkan...";
        msgEl.style.color = "#16a34a";

        setTimeout(() => {
          window.location.href = "pending.html";
        }, 1500);

      } catch (e) {
        msgEl.textContent = "Gagal: " + e.message;
        msgEl.style.color = "var(--danger)";
        btnEl.disabled = false;
        btnEl.textContent = "Daftar Sekarang";
      }
    }

    [nameEl, emailEl, passEl].forEach(el => {
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") doRegister();
      });
    });
  </script>
</body>

</html>
