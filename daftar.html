<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gabku App – Daftar Akun</title>

  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="app">
    <main class="app-main login-clean">
      <img src="assets/img/logo.png" alt="Gabku" class="login-logo" />
      <div class="login-title">Daftar Akun Baru</div>

      <section class="section-card login-card">
        <label class="field-label" for="full_name">Nama Lengkap</label>
        <input id="full_name" type="text" class="field" placeholder="Masukkan nama lengkap Anda..." />

        <label class="field-label" for="email">Email</label>
        <input id="email" type="email" class="field" placeholder="nama@email.com" autocomplete="email" />

        <label class="field-label" for="password">Password</label>
        <input id="password" type="password" class="field" placeholder="Minimal 6 karakter..."
          autocomplete="new-password" />

        <button id="btn" class="btn-primary btn-wide" type="button">
          Daftar Sekarang
        </button>

        <p id="msg" class="tool-msg text-center mt-3 font-bold"></p>

        <p class="login-help text-center">
          Sudah punya akun? <a href="login.html" style="color: var(--brand-600); font-weight: 800;">Masuk di sini</a>
        </p>
      </section>

      <p class="login-desc text-center">
        Pendaftaran ini akan melalui proses verifikasi oleh Admin sebelum Anda dapat masuk ke aplikasi.
      </p>
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>

  <script>
    const nameEl = document.getElementById("full_name");
    const emailEl = document.getElementById("email");
    const passEl = document.getElementById("password");
    const msgEl = document.getElementById("msg");
    const btnEl = document.getElementById("btn");

    async function doRegister() {
      const name = nameEl.value.trim();
      const email = emailEl.value.trim();
      const password = passEl.value.trim();

      if (!name || !email || !password) {
        msgEl.textContent = "Semua kolom wajib diisi.";
        msgEl.style.color = "red";
        return;
      }

      if (password.length < 6) {
        msgEl.textContent = "Password minimal 6 karakter.";
        msgEl.style.color = "red";
        return;
      }

      btnEl.disabled = true;
      btnEl.textContent = "Mendaftarkan...";
      msgEl.textContent = "";

      try {
        // 1. SignUp Supabase
        const { data: authData, error: authError } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
        });

        if (authError) throw authError;

        const userId = authData.user.id;

        // 2. Buat Profil di Tabel Profiles (Status default: Menunggu)
        const { error: profError } = await supabaseClient.from('profiles').insert({
          id: userId,
          full_name: name,
          email: email, // Optional since it's in auth, but helpful for admin list
          status: 'Menunggu'
        });

        if (profError) throw profError;

        msgEl.textContent = "Pendaftaran Berhasil! Mengalihkan...";
        msgEl.style.color = "green";

        setTimeout(() => {
          window.location.href = "pending.html";
        }, 1500);

      } catch (e) {
        msgEl.textContent = "Gagal: " + e.message;
        msgEl.style.color = "red";
        btnEl.disabled = false;
        btnEl.textContent = "Daftar Sekarang";
      }
    }

    btnEl.addEventListener("click", doRegister);
  </script>

</body>

</html>
