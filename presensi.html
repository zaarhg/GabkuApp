<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Buat Presensi (Hybrid)</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg>
          </a>
          <div class="header-text">
            <div class="app-name">Buat Presensi</div>
            <div class="app-subtitle">Sesi, Peserta & Foto Kegiatan</div>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="section-card" style="margin-top:0;">
        <div class="section-title">Detail Sesi</div>
        <label class="field-label" for="activity">Kegiatan</label>
        <select id="activity" class="field"></select>

        <label class="field-label" for="date">Tanggal</label>
        <input id="date" type="date" class="field" />

        <div class="row-2" style="margin-top:10px;">
          <div class="mini-label" style="margin-bottom:6px;">Waktu Kegiatan</div>
          <select id="timeSel" class="field"></select>

          <div id="timeManual" style="display:none; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;">
            <div>
              <div class="mini-label">Mulai</div>
              <input id="timeStartManual" type="time" class="field" oninput="checkFormReady()" />
            </div>
            <div>
              <div class="mini-label">Selesai</div>
              <input id="timeEndManual" type="time" class="field" oninput="checkFormReady()" />
            </div>
          </div>
        </div>

        <label class="field-label" for="locationSel">Tempat</label>
        <select id="locationSel" class="field"></select>
        <input id="locationManual" type="text" class="field" style="display:none; margin-top:6px;"
          placeholder="Tulis lokasi manual..." oninput="checkFormReady()" />

        <label class="field-label" for="note">Catatan (opsional)</label>
        <textarea id="note" rows="2" class="field"></textarea>
      </section>

      <section class="section-card">
        <div class="row-between">
          <div class="section-title" style="margin:0;">Peserta</div>
          <button class="btn-secondary" id="addMemberBtn" type="button">Tambah</button>
        </div>
        <div id="participants" style="margin-top:10px;"></div>
      </section>

      <section class="section-card">
        <div class="section-title">Foto Kegiatan</div>
        <p class="hint" style="font-size:12px; color:#666; margin-bottom:8px;">Maksimal 4 foto (akan otomatis
          dikompres).</p>
        <input id="photos" type="file" accept="image/*" multiple class="field" />
        <div id="photoPreview" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;"></div>
      </section>

      <section class="section-card">
        <button id="saveBtn" class="btn-primary" style="width:100%" type="button">Simpan & Generate PDF</button>
        <p id="msg" class="tool-msg" style="margin-top:10px; font-weight:bold;"></p>
      </section>

      <!-- PROGRESS OVERLAY MODAL -->
      <div id="progressOverlay"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:10000; justify-content:center; align-items:center; backdrop-filter:blur(4px);">
        <div
          style="background:#fff; border-radius:20px; padding:28px 24px; width:90%; max-width:340px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.25);">
          <div
            style="width:56px; height:56px; border:5px solid #eff6ff; border-top-color:#1590df; border-radius:50%; margin:0 auto 20px; animation:spin 0.9s linear infinite;">
          </div>
          <div id="progressTitle" style="font-weight:800; font-size:17px; color:#0f172a; margin-bottom:8px;">
            Memproses...</div>
          <div id="progressMsg" style="font-size:13px; color:#64748b; line-height:1.6;">Mohon tunggu, jangan tutup
            halaman ini.</div>
        </div>
      </div>
      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>

      <!-- Custom Modals -->
      <div id="customConfirm"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
        <div class="section-card" style="width:90%; max-width:350px; margin:0; text-align:center;">
          <h3 style="margin-top:0; font-size:16px;" id="confirmTitle">Peringatan</h3>
          <p id="confirmMsg" style="font-size:14px; color:#4b5563; margin-bottom:20px;"></p>
          <div style="display:flex; gap:10px; justify-content:center;">
            <button id="confirmBtnNo" class="btn-secondary" style="padding:8px 20px;">Batal</button>
            <button id="confirmBtnYes" class="btn-primary" style="padding:8px 20px;">Ya, Lanjutkan</button>
          </div>
        </div>
      </div>

      <div id="customPrompt"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
        <div class="section-card" style="width:90%; max-width:350px; margin:0;">
          <h3 style="margin-top:0; font-size:16px;" id="promptTitle">Cari Nama</h3>

          <input type="text" id="promptInput" class="field" style="margin-bottom:10px;"
            placeholder="Ketik nama (opsional)..." />
          <div style="text-align:center; font-size:12px; color:#666; margin-bottom:10px;">- ATAU -</div>
          <select id="promptSelect" class="field" style="margin-bottom:15px;">
            <option value="">-- Pilih dari daftar --</option>
          </select>

          <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button id="promptBtnNo" class="btn-secondary" style="padding:8px 16px;">Batal</button>
            <button id="promptBtnYes" class="btn-primary" style="padding:8px 16px;">Konfirmasi</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    (async () => {
      await requireLogin();
      init();
    })();

    const activitySel = document.getElementById("activity");
    const dateEl = document.getElementById("date");
    const msgEl = document.getElementById("msg");
    const photoPreview = document.getElementById("photoPreview");

    const timeSel = document.getElementById("timeSel");
    const locSel = document.getElementById("locationSel");
    const saveBtn = document.getElementById("saveBtn");

    let activitiesCache = [];
    let membersCache = [];
    let participants = [];
    let photoB64 = [];

    window.toggleManualInput = (type) => {
      if (type === 'time') {
        document.getElementById('timeManual').style.display = timeSel.value === 'Lainnya' ? 'grid' : 'none';
      } else if (type === 'location') {
        document.getElementById('locationManual').style.display = locSel.value === 'Lainnya' ? 'block' : 'none';
      }
    };

    window.checkFormReady = () => {
      // otomatis hilangkan pesan error bila user mulai mengetik/berubah
      msgEl.textContent = "";

      let ready = true;
      if (!activitySel.value) ready = false;
      if (!dateEl.value) ready = false;

      if (timeSel.value === 'Lainnya') {
        if (!document.getElementById("timeStartManual").value || !document.getElementById("timeEndManual").value) ready = false;
      } else if (!timeSel.value) ready = false;

      if (locSel.value === 'Lainnya') {
        if (!document.getElementById("locationManual").value.trim()) ready = false;
      } else if (!locSel.value) ready = false;

      if (!participants.length) ready = false;

      if (ready) {
        saveBtn.style.background = "#1590df";
        saveBtn.style.cursor = "pointer";
      } else {
        saveBtn.style.background = "#9ca3af";
        saveBtn.style.cursor = "pointer"; // tetap bisa diklik untuk memunculkan pesan error
      }
    };

    function asyncConfirm(msg, title = "Peringatan") {
      return new Promise((resolve) => {
        const modal = document.getElementById("customConfirm");
        document.getElementById("confirmTitle").textContent = title;
        document.getElementById("confirmMsg").textContent = msg;
        document.getElementById("confirmBtnNo").style.display = 'block';
        modal.style.display = 'flex';

        document.getElementById("confirmBtnYes").onclick = () => { modal.style.display = 'none'; resolve(true); };
        document.getElementById("confirmBtnNo").onclick = () => { modal.style.display = 'none'; resolve(false); };
      });
    }

    function asyncAlert(msg, title = "Informasi") {
      return new Promise((resolve) => {
        const modal = document.getElementById("customConfirm");
        document.getElementById("confirmTitle").textContent = title;
        document.getElementById("confirmMsg").textContent = msg;
        document.getElementById("confirmBtnNo").style.display = 'none';
        modal.style.display = 'flex';

        document.getElementById("confirmBtnYes").onclick = () => { modal.style.display = 'none'; resolve(true); };
      });
    }

    const escapeHtml = (s) => String(s || '').replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");

    function asyncPrompt(title = "Cari Nama", options = [], btnText = "Konfirmasi") {
      return new Promise((resolve) => {
        const modal = document.getElementById("customPrompt");
        document.getElementById("promptTitle").textContent = title;
        document.getElementById("promptBtnYes").textContent = btnText;

        const input = document.getElementById("promptInput");
        const select = document.getElementById("promptSelect");

        input.value = "";
        select.innerHTML = `<option value="">-- Pilih dari daftar --</option>` +
          options.map(o => `<option value="${escapeHtml(o.name || o)}">${escapeHtml(o.name || o)}</option>`).join("");
        select.value = "";

        modal.style.display = 'flex';
        input.focus();

        document.getElementById("promptBtnYes").onclick = () => {
          modal.style.display = 'none';
          const val = select.value ? select.value : input.value.trim();
          resolve(val);
        };
        document.getElementById("promptBtnNo").onclick = () => { modal.style.display = 'none'; resolve(null); };
      });
    }

    let hasWarnedTemplateMod = false;
    async function checkTemplateWarning(actionDesc, type) {
      if (hasWarnedTemplateMod) return true;
      const selId = activitySel.value;
      if (!selId) return true;
      const act = activitiesCache.find(a => a.id === selId);
      if (!act) return true;

      let shouldWarn = false;
      if (type === 'location' && act.location) shouldWarn = true;
      if (type === 'participant' && act.default_participants && act.default_participants.length > 0) shouldWarn = true;

      if (shouldWarn) {
        const proceed = await asyncConfirm(`Kegiatan ini memiliki template. Yakin ingin ${actionDesc}?`);
        if (proceed) {
          hasWarnedTemplateMod = true;
          return true;
        }
        return false;
      }
      return true;
    }

    async function init() {
      dateEl.value = new Date().toISOString().slice(0, 10);
      try {
        const { data: acts } = await supabaseClient.from('activities').select('*').eq('is_active', true).order('name');
        activitiesCache = acts || [];

        activitySel.innerHTML = `<option value="">-- pilih --</option>` + activitiesCache.map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join("");

        const { data: mems } = await supabaseClient.from('members').select('*').order('name');
        membersCache = mems;

        // Load Settings
        const { data: sets } = await supabaseClient.from('app_settings').select('*');
        if (sets) {
          const tRow = sets.find(r => r.setting_key === 'time_options');
          const lRow = sets.find(r => r.setting_key === 'location_options');
          const timeOpts = tRow ? tRow.setting_value : [];
          const locOpts = lRow ? lRow.setting_value : [];

          const tHtml = `<option value="">-- pilih --</option>` + timeOpts.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("") + `<option value="Lainnya">Lainnya...</option>`;
          timeSel.innerHTML = tHtml;

          const lHtml = `<option value="">-- pilih --</option>` + locOpts.map(l => `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join("") + `<option value="Lainnya">Lainnya...</option>`;
          locSel.innerHTML = lHtml;
        }

        // Setup live validation form 
        const inputsForValidation = [
          activitySel, dateEl,
          document.getElementById('timeStartManual'), document.getElementById('timeEndManual'), document.getElementById('locationManual')
        ];
        inputsForValidation.forEach(el => el.addEventListener('input', checkFormReady));
        inputsForValidation.forEach(el => el.addEventListener('change', checkFormReady));

        locSel.addEventListener('focus', function () { this.dataset.old = this.value; });
        locSel.addEventListener('change', async function () {
          const proceed = await checkTemplateWarning("mengubah setelan tempat master", "location");
          if (!proceed) {
            this.value = this.dataset.old || "";
          } else {
            this.dataset.old = this.value;
          }
          toggleManualInput('location');
          checkFormReady();
        });

        timeSel.addEventListener('change', () => {
          toggleManualInput('time');
          checkFormReady();
        });

        checkFormReady(); // init warna tombol

      } catch (e) { console.error(e); }
    }

    activitySel.addEventListener('change', () => {
      hasWarnedTemplateMod = false;

      // Pastikan pop-up peringatan/prompt hilang
      document.getElementById('customConfirm').style.display = 'none';
      document.getElementById('customPrompt').style.display = 'none';
      msgEl.textContent = "";

      const act = activitiesCache.find(a => a.id === activitySel.value);

      // Reset Waktu dan Catatan
      timeSel.value = "";
      document.getElementById("timeStartManual").value = "";
      document.getElementById("timeEndManual").value = "";
      toggleManualInput('time');
      document.getElementById("note").value = "";

      if (!act) {
        locSel.value = "";
        toggleManualInput('location');
        document.getElementById("locationManual").value = "";
        participants = [];
        renderParticipants();
        return;
      }

      if (act.location) {
        // Cek apakah lokasi master ada di dropdown
        const exists = Array.from(locSel.options).some(opt => opt.value === act.location);
        if (exists) {
          locSel.value = act.location;
          toggleManualInput('location');
        } else {
          locSel.value = 'Lainnya';
          toggleManualInput('location');
          document.getElementById("locationManual").value = act.location;
        }
      } else {
        locSel.value = "";
        toggleManualInput('location');
        document.getElementById("locationManual").value = "";
      }

      if (act.default_participants && act.default_participants.length > 0) {
        participants = act.default_participants.map(p => ({
          member_id: p.member_id,
          name: p.name,
          role: p.role,
          presence: "Hadir"
        }));
      } else {
        participants = [];
      }
      renderParticipants();
    });

    // Logika Tambah/Hapus Peserta
    document.getElementById("addMemberBtn").onclick = async () => {
      const proceed = await checkTemplateWarning("menambah peserta manual di luar template", "participant");
      if (!proceed) return;

      const q = await asyncPrompt("Pilih / Cari Anggota:", membersCache, "Tambah");
      if (!q) return;
      const found = membersCache.find(m => m.name.toLowerCase().includes(q.toLowerCase()));
      if (!found) return await asyncAlert("Anggota tidak ditemukan");
      if (participants.find(p => p.member_id === found.id)) return await asyncAlert("Sudah ada di daftar");
      participants.push({ member_id: found.id, name: found.name, role: found.role, presence: "Hadir" });
      renderParticipants();
    };

    window.removeParticipant = async (i) => {
      const proceed = await checkTemplateWarning("menghapus peserta dari template", "participant");
      if (!proceed) return;
      participants.splice(i, 1);
      renderParticipants();
    };

    const PRESENCE_COLORS = {
      'Hadir': { bg: '#dcfce7', color: '#166534', border: '#bbf7d0' },
      'Izin': { bg: '#fef9c3', color: '#854d0e', border: '#fde047' },
      'Sakit': { bg: '#ffedd5', color: '#9a3412', border: '#fed7aa' },
      'Alpa': { bg: '#fee2e2', color: '#991b1b', border: '#fca5a5' }
    };

    function renderParticipants() {
      document.getElementById("participants").innerHTML = participants.map((p, i) => {
        const c = PRESENCE_COLORS[p.presence] || PRESENCE_COLORS['Hadir'];
        const options = ['Hadir', 'Izin', 'Sakit', 'Alpa'].map(opt => {
          const oc = PRESENCE_COLORS[opt];
          return `<option value="${opt}" ${p.presence === opt ? 'selected' : ''}>${opt}</option>`;
        }).join('');
        return `
        <div class="item-card" style="margin-bottom:8px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <div style="flex:1; min-width:0;">
            <div style="font-weight:700; font-size:14px; color:#0f172a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.name}</div>
            <div style="font-size:12px; color:#64748b; margin-top:1px;">${p.role}</div>
          </div>
          <div style="display:flex; gap:8px; align-items:center; flex-shrink:0;">
            <select
              style="padding:8px 10px; font-size:13px; font-weight:700; border-radius:10px; border:1.5px solid ${c.border}; background:${c.bg}; color:${c.color}; cursor:pointer; outline:none; appearance:none; min-width:72px; text-align:center;"
              onchange="participants[${i}].presence = this.value; renderParticipants();">
              ${options}
            </select>
            <button
              style="width:34px; height:34px; border-radius:10px; border:none; background:#f1f5f9; color:#64748b; font-size:18px; font-weight:300; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s;"
              onmouseenter="this.style.background='#fee2e2'; this.style.color='#dc2626';"
              onmouseleave="this.style.background='#f1f5f9'; this.style.color='#64748b';"
              onclick="removeParticipant(${i})" title="Hapus peserta">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
          </div>
        </div>`;
      }).join("");
      if (typeof checkFormReady === 'function') checkFormReady();
    }

    // Logika Kompres Foto (dari kode lama Anda)
    document.getElementById("photos").onchange = async (e) => {
      photoB64 = [];
      photoPreview.innerHTML = "";
      const files = Array.from(e.target.files).slice(0, 4);
      for (const f of files) {
        const b64 = await compressImage(f, 1280, 0.7);
        photoB64.push(b64);
        const img = document.createElement("img");
        img.src = b64;
        img.style = "width:70px; height:70px; object-fit:cover; border-radius:8px;";
        photoPreview.appendChild(img);
      }
    };

    function compressImage(file, maxW, quality) {
      return new Promise((res) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = () => img.src = reader.result;
        img.onload = () => {
          const scale = Math.min(1, maxW / img.width);
          const c = document.createElement("canvas");
          c.width = img.width * scale; c.height = img.height * scale;
          const ctx = c.getContext("2d");
          ctx.drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL("image/jpeg", quality));
        };
        reader.readAsDataURL(file);
      });
    }

    // ===== PROGRESS OVERLAY HELPERS =====
    function showProgress(title, msg) {
      document.getElementById('progressTitle').textContent = title;
      document.getElementById('progressMsg').textContent = msg;
      document.getElementById('progressOverlay').style.display = 'flex';
    }
    function updateProgress(title, msg) {
      document.getElementById('progressTitle').textContent = title;
      document.getElementById('progressMsg').textContent = msg;
    }
    function hideProgress() {
      document.getElementById('progressOverlay').style.display = 'none';
    }

    // LOGIKA SIMPAN HYBRID
    document.getElementById("saveBtn").onclick = async () => {
      msgEl.style.color = "red";
      if (!activitySel.value) return msgEl.textContent = "Mohon pilih Kegiatan.";
      if (!dateEl.value) return msgEl.textContent = "Tanggal wajib diisi.";
      if (timeSel.value === 'Lainnya' && (!document.getElementById("timeStartManual").value || !document.getElementById("timeEndManual").value)) return msgEl.textContent = "Waktu kegiatan manual belum lengkap.";
      if (!timeSel.value) return msgEl.textContent = "Waktu kegiatan belum dipilih.";
      if (locSel.value === 'Lainnya' && !document.getElementById("locationManual").value.trim()) return msgEl.textContent = "Lokasi manual belum diisi.";
      if (!locSel.value) return msgEl.textContent = "Pilih lokasi/tempat kegiatan.";
      if (!participants.length) return msgEl.textContent = "Daftar peserta tidak boleh kosong. Tambahkan minimal 1 orang.";

      msgEl.textContent = "";
      const btn = document.getElementById("saveBtn");
      btn.disabled = true;

      try {
        let ts = '', te = '';
        if (timeSel.value === 'Lainnya') {
          ts = document.getElementById("timeStartManual").value;
          te = document.getElementById("timeEndManual").value;
        } else {
          const parts = timeSel.value.split(" - ");
          ts = parts[0] ? parts[0].trim() : "";
          te = parts.length > 1 ? parts[1].trim() : "";
        }

        // A. TAHAP 1: Generate PDF via Google Apps Script
        showProgress(
          '📄 Membuat PDF...',
          'Sedang mengunggah data & foto ke Google Drive. Proses ini bisa memakan waktu 15–60 detik.'
        );

        const headerData = {
          activity_id: activitySel.value,
          activity_name: activitySel.options[activitySel.selectedIndex].text,
          date: dateEl.value,
          time_start: ts,
          time_end: te,
          location: locSel.value === 'Lainnya' ? document.getElementById("locationManual").value : locSel.value,
          note: document.getElementById("note").value
        };

        const gasRes = await apiPost("createAttendanceSession", {
          header: headerData,
          participants: participants,
          photos: photoB64
        });

        if (!gasRes || !gasRes.pdf_fileId) throw new Error("Gagal mendapatkan ID PDF dari Drive");
        const pdfId = gasRes.pdf_fileId;

        // B. TAHAP 2: Simpan Data ke Supabase
        updateProgress(
          '☁️ Menyimpan Data...',
          'PDF berhasil dibuat! Sedang menyimpan rekap presensi ke database...'
        );

        const att_id = `ATT-${new Date().getTime()}`;

        const { error: errH } = await supabaseClient.from('attendance_header').insert([{
          id: att_id,
          activity_id: headerData.activity_id,
          activity_name_snapshot: headerData.activity_name,
          date: headerData.date,
          time_start: headerData.time_start,
          time_end: headerData.time_end,
          location_snapshot: headerData.location,
          note: headerData.note,
          pdf_file_id: pdfId
        }]);
        if (errH) throw errH;

        const details = participants.map(p => ({
          attendance_id: att_id,
          member_id: p.member_id,
          member_name_snapshot: p.name,
          member_role_snapshot: p.role,
          presence: p.presence
        }));
        const { error: errD } = await supabaseClient.from('attendance_detail').insert(details);
        if (errD) throw errD;

        updateProgress('✅ Selesai!', 'Presensi berhasil disimpan. Membuka PDF dan kembali ke beranda...');
        await new Promise(r => setTimeout(r, 800)); // Tampilkan pesan sukses sebentar

        hideProgress();
        window.open(`https://drive.google.com/file/d/${pdfId}/view`, '_blank');
        window.location.href = 'index.html';

      } catch (e) {
        hideProgress();
        msgEl.style.color = "red";
        msgEl.textContent = "Gagal: " + e.message;
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>

</html>
