<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Buat Presensi (Hybrid)</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#198cda">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg>
          </a>
          <div class="header-text">
            <div class="app-name">Buat Presensi</div>
            <div class="app-subtitle">Sesi, Peserta & Foto Kegiatan</div>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="section-card mt-0">
        <div class="section-title m-0 mb-3">Detail Sesi</div>
        <label class="field-label" for="activity">Kegiatan</label>
        <select id="activity" class="field mb-3"></select>

        <div id="subNameWrap" class="mb-3" style="display:none;">
          <label class="field-label mt-1" for="activitySubName">Detail / Sub-Nama Sesi <span
              class="text-danger">*</span></label>
          <input id="activitySubName" type="text" class="field" placeholder="Contoh: Kejurda 2026 / Seleksi Daerah"
            oninput="checkFormReady()" />
        </div>

        <label class="field-label" for="date">Tanggal</label>
        <input id="date" type="date" class="field mb-3" />

        <div class="mt-3 mb-3">
          <div class="text-xs text-muted font-semibold mb-1">Waktu Kegiatan</div>
          <select id="timeSel" class="field mb-2"></select>

          <div id="timeManual" style="display:none;" class="flex gap-2 mt-2">
            <div class="flex-1">
              <div class="text-xs text-muted mb-1">Mulai</div>
              <input id="timeStartManual" type="time" class="field" oninput="checkFormReady()" />
            </div>
            <div class="flex-1">
              <div class="text-xs text-muted mb-1">Selesai</div>
              <input id="timeEndManual" type="time" class="field" oninput="checkFormReady()" />
            </div>
          </div>
        </div>

        <label class="field-label" for="locationSel">Tempat</label>
        <select id="locationSel" class="field mb-2"></select>
        <input id="locationManual" type="text" class="field" style="display:none;" placeholder="Tulis lokasi manual..."
          oninput="checkFormReady()" />

        <label class="field-label mt-3" for="note">Catatan (opsional)</label>
        <textarea id="note" rows="2" class="field"></textarea>
      </section>

      <section class="section-card">
        <div class="row-between">
          <div class="section-title m-0">Peserta</div>
          <button class="btn-secondary btn-sm" id="addMemberBtn" type="button">Tambah Peserta</button>
        </div>
        <div id="participants" class="mt-3 flex-col gap-2"></div>
      </section>

      <section class="section-card">
        <div class="section-title m-0 mb-1">Foto Kegiatan</div>
        <div class="text-xs text-muted mb-3">Maksimal 4 foto (akan otomatis dikompres).</div>
        <input id="photos" type="file" accept="image/*" multiple class="field" />
        <div id="photoPreview" class="flex gap-2 flex-wrap mt-3"></div>
      </section>

      <section class="section-card">
        <p id="msg" class="tool-msg text-center mt-0 mb-3 font-bold"></p>
        <button id="saveBtn" class="btn-primary w-full" type="button">Simpan & Generate PDF</button>
      </section>

      <!-- PROGRESS OVERLAY MODAL -->
      <div id="progressOverlay" class="modal-overlay"
        style="display:none; z-index:10000; background:rgba(15,23,42,0.8); backdrop-filter: blur(8px);">
        <div class="progress-card">
          <div id="progressStatusContainer">
            <div id="progressSpinner" class="progress-spinner"></div>
            <div id="progressIcon" class="success-check" style="display:none;">✓</div>
          </div>
          <div id="progressTitle" class="text-xl font-extrabold text-main mb-2">Memproses...</div>
          <div id="progressMsg" class="text-sm text-muted leading-relaxed">Mohon tunggu, jangan tutup halaman ini.</div>

          <div id="successActions" style="display:none;" class="flex-col gap-3 mt-6">
            <a id="viewPdfBtn" href="#" target="_blank"
              class="btn-primary w-full no-underline flex items-center justify-center gap-2 py-3">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor"
                  d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
              </svg>
              Lihat PDF Hasil
            </a>
            <button id="sharePdfBtn" class="btn-secondary w-full flex items-center justify-center gap-2 py-3">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor"
                  d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92 0-1.61-1.31-2.92-2.92-2.92z" />
              </svg>
              Bagikan ke WhatsApp
            </button>
            <button id="finishBackBtn" onclick="window.location.href='index.html'"
              class="btn-outline w-full flex items-center justify-center gap-2 py-3"
              style="color: var(--success); border-color: rgba(22,163,74,0.2); background: rgba(22,163,74,0.05);">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
              </svg>
              Kembali ke Beranda
            </button>
          </div>
        </div>
      </div>

      <!-- Custom Modals -->
      <div id="customConfirm" class="modal-overlay" style="display:none;">
        <div class="modal-card text-center">
          <h3 class="mt-0 text-base font-bold" id="confirmTitle">Peringatan</h3>
          <p id="confirmMsg" class="text-sm text-muted mb-5"></p>
          <div class="flex justify-center gap-3">
            <button id="confirmBtnNo" class="btn-secondary">Batal</button>
            <button id="confirmBtnYes" class="btn-primary">Ya, Lanjutkan</button>
          </div>
        </div>
      </div>

      <!-- Member Picker Modal -->
      <div id="memberPickerModal" class="modal-overlay">
        <div class="picker-box">
          <div class="picker-title">Tambah Peserta</div>
          <input id="presensiPickerSearch" class="field" placeholder="Cari nama anggota…"
            oninput="filterPresensiPicker(this.value)">
          <div class="picker-list flex-1 overflow-y-auto" id="presensiPickerList"></div>
          <div class="flex gap-2 w-full mt-2">
            <button class="btn-secondary flex-1" onclick="closePresensipicker()">Batal</button>
            <button class="btn-primary flex-1" onclick="confirmPresensipicker()">Tambah</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/presensi.js"></script>
</body>

</html>
