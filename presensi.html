<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Buat Presensi</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html" aria-label="Kembali" title="Kembali">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg>
          </a>
          <div class="header-text">
            <div class="app-name">Buat Presensi</div>
            <div class="app-subtitle">Isi detail sesi & peserta</div>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="section-card" style="margin-top:0;">
        <div class="section-title">Detail Sesi</div>
        <label class="field-label" for="activity">Kegiatan</label>
        <select id="activity" class="field"></select>

        <label class="field-label" for="date">Tanggal</label>
        <input id="date" type="date" class="field" />

        <label class="field-label" for="timePreset">Waktu</label>
        <select id="timePreset" class="field">
          <option value="">-- pilih preset --</option>
          <option value="09:00-15:00">09:00 - 15:00</option>
          <option value="19:00-22:00">19:00 - 22:00</option>
        </select>

        <div class="row-2">
          <div>
            <div class="mini-label">Mulai</div><input id="timeStart" type="time" class="field" />
          </div>
          <div>
            <div class="mini-label">Selesai</div><input id="timeEnd" type="time" class="field" />
          </div>
        </div>

        <label class="field-label" for="locationPreset">Tempat</label>
        <select id="locationPreset" class="field">
          <option value="Wisma Arienta (Pulo, Brosot, Galur)">Wisma Arienta (Pulo, Brosot, Galur)</option>
          <option value="">Lainnya (ketik manual)</option>
        </select>
        <input id="locationCustom" type="text" class="field" placeholder="Tulis tempat jika lainnya" />

        <label class="field-label" for="note">Catatan (opsional)</label>
        <textarea id="note" rows="3" class="field" style="min-height:88px;"></textarea>
      </section>

      <section class="section-card">
        <div class="row-between">
          <div class="section-title" style="margin:0;">Peserta</div>
          <button class="btn-secondary" id="addMemberBtn" type="button">Tambah</button>
        </div>
        <div id="participants" style="margin-top:10px;"></div>
      </section>

      <section class="section-card">
        <button id="saveBtn" class="btn-primary" style="width:100%" type="button">Simpan Presensi</button>
        <p id="msg" class="tool-msg" style="margin-top:10px;"></p>
      </section>
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    (async () => {
      await requireLogin();
      await loadInitialData();
    })();

    const activitySel = document.getElementById("activity");
    const dateEl = document.getElementById("date");
    const timePreset = document.getElementById("timePreset");
    const timeStart = document.getElementById("timeStart");
    const timeEnd = document.getElementById("timeEnd");
    const locationPreset = document.getElementById("locationPreset");
    const locationCustom = document.getElementById("locationCustom");
    const noteEl = document.getElementById("note");
    const participantsEl = document.getElementById("participants");
    const msgEl = document.getElementById("msg");

    let membersCache = [];
    let participants = [];

    async function loadInitialData() {
      dateEl.value = new Date().toISOString().slice(0, 10);
      try {
        // Load Kegiatan
        const { data: acts } = await supabaseClient.from('activities').select('*').eq('is_active', true).order('name');
        activitySel.innerHTML = `<option value="">-- pilih --</option>` +
          acts.map(a => `<option value="${a.id}">${a.name}</option>`).join("");

        // Load Anggota untuk pencarian
        const { data: mems } = await supabaseClient.from('members').select('*').order('name');
        membersCache = mems;
      } catch (e) {
        msgEl.textContent = "Gagal memuat data: " + e.message;
      }
    }

    function renderParticipants() {
      if (!participants.length) {
        participantsEl.innerHTML = "<p class='muted'>Belum ada peserta.</p>";
        return;
      }
      participantsEl.innerHTML = participants.map((p, i) => `
        <div class="p-card" style="margin-bottom:10px; padding:10px; border:1px solid #ddd; border-radius:10px;">
          <div style="font-weight:bold">${p.name} (${p.role})</div>
          <div class="p-actions" style="display:flex; gap:10px; margin-top:5px;">
            <select class="field" onchange="participants[${i}].presence = this.value">
              <option>Hadir</option><option>Izin</option><option>Sakit</option><option>Alpa</option>
            </select>
            <button class="btn-danger" style="background:#fee2e2; color:#b91c1c; border:none; padding:5px 10px; border-radius:8px;" onclick="removeParticipant(${i})">Hapus</button>
          </div>
        </div>
      `).join("");
    }

    window.removeParticipant = (i) => { participants.splice(i, 1); renderParticipants(); };

    document.getElementById("addMemberBtn").addEventListener("click", () => {
      const q = prompt("Cari nama anggota:");
      if (!q) return;
      const found = membersCache.find(m => m.name.toLowerCase().includes(q.toLowerCase()));
      if (!found) return alert("Anggota tidak ditemukan");
      if (participants.find(p => p.member_id === found.id)) return alert("Sudah ada di daftar");

      participants.push({ member_id: found.id, name: found.name, role: found.role, presence: "Hadir" });
      renderParticipants();
    });

    timePreset.addEventListener("change", () => {
      if (!timePreset.value) return;
      const [s, e] = timePreset.value.split("-");
      timeStart.value = s; timeEnd.value = e;
    });

    document.getElementById("saveBtn").addEventListener("click", async () => {
      msgEl.textContent = "";
      const actId = activitySel.value;
      const actName = activitySel.options[activitySel.selectedIndex]?.text;
      if (!actId || !dateEl.value || !participants.length) return msgEl.textContent = "Data belum lengkap.";

      try {
        msgEl.textContent = "Menyimpan...";
        const now = new Date();
        const ts = now.toISOString().replace(/[-T:]/g, '').split('.')[0];
        const att_id = `ATT-${ts}-${Math.floor(1000 + Math.random() * 9000)}`;

        // 1. Simpan Header
        const { error: errH } = await supabaseClient.from('attendance_header').insert([{
          id: att_id,
          activity_id: actId,
          activity_name_snapshot: actName,
          date: dateEl.value,
          time_start: timeStart.value,
          time_end: timeEnd.value,
          location_snapshot: locationPreset.value || locationCustom.value,
          note: noteEl.value
        }]);
        if (errH) throw errH;

        // 2. Simpan Details (Bulk Insert)
        const details = participants.map(p => ({
          attendance_id: att_id,
          member_id: p.member_id,
          member_name_snapshot: p.name,
          member_role_snapshot: p.role,
          presence: p.presence
        }));
        const { error: errD } = await supabaseClient.from('attendance_detail').insert(details);
        if (errD) throw errD;

        msgEl.textContent = "Presensi berhasil disimpan ke Supabase!";
        participants = [];
        renderParticipants();
      } catch (e) {
        msgEl.textContent = "Gagal simpan: " + e.message;
      }
    });
  </script>
</body>

</html>
