<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Buat Presensi (Hybrid)</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg>
          </a>
          <div class="header-text">
            <div class="app-name">Buat Presensi</div>
            <div class="app-subtitle">Sesi, Peserta & Foto Kegiatan</div>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="section-card" style="margin-top:0;">
        <div class="section-title">Detail Sesi</div>
        <label class="field-label" for="activity">Kegiatan</label>
        <select id="activity" class="field"></select>

        <label class="field-label" for="date">Tanggal</label>
        <input id="date" type="date" class="field" />

        <div class="row-2" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;">
          <div>
            <div class="mini-label">Mulai</div><input id="timeStart" type="time" class="field" />
          </div>
          <div>
            <div class="mini-label">Selesai</div><input id="timeEnd" type="time" class="field" />
          </div>
        </div>

        <label class="field-label" for="locationCustom">Tempat</label>
        <input id="locationCustom" type="text" class="field" placeholder="Lokasi kegiatan" />

        <label class="field-label" for="note">Catatan (opsional)</label>
        <textarea id="note" rows="2" class="field"></textarea>
      </section>

      <section class="section-card">
        <div class="row-between">
          <div class="section-title" style="margin:0;">Peserta</div>
          <button class="btn-secondary" id="addMemberBtn" type="button">Tambah</button>
        </div>
        <div id="participants" style="margin-top:10px;"></div>
      </section>

      <section class="section-card">
        <div class="section-title">Foto Kegiatan</div>
        <p class="hint" style="font-size:12px; color:#666; margin-bottom:8px;">Maksimal 4 foto (akan otomatis
          dikompres).</p>
        <input id="photos" type="file" accept="image/*" multiple class="field" />
        <div id="photoPreview" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;"></div>
      </section>

      <section class="section-card">
        <button id="saveBtn" class="btn-primary" style="width:100%" type="button">Simpan & Generate PDF</button>
        <p id="msg" class="tool-msg" style="margin-top:10px; font-weight:bold;"></p>

        <div id="after" style="display:none; margin-top:15px; border-top:1px solid #eee; padding-top:10px;">
          <a id="pdfLink" class="btn-secondary"
            style="width:100%; text-decoration:none; display:inline-flex; align-items:center; justify-content:center;"
            target="_blank">Buka PDF (Google Drive)</a>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    (async () => {
      await requireLogin();
      init();
    })();

    const activitySel = document.getElementById("activity");
    const dateEl = document.getElementById("date");
    const msgEl = document.getElementById("msg");
    const photoPreview = document.getElementById("photoPreview");
    let membersCache = [];
    let participants = [];
    let photoB64 = [];

    async function init() {
      dateEl.value = new Date().toISOString().slice(0, 10);
      try {
        const { data: acts } = await supabaseClient.from('activities').select('*').eq('is_active', true).order('name');
        activitySel.innerHTML = `<option value="">-- pilih --</option>` + acts.map(a => `<option value="${a.id}">${a.name}</option>`).join("");

        const { data: mems } = await supabaseClient.from('members').select('*').order('name');
        membersCache = mems;
      } catch (e) { console.error(e); }
    }

    // Logika Tambah/Hapus Peserta (seperti sebelumnya)
    document.getElementById("addMemberBtn").onclick = () => {
      const q = prompt("Cari nama:");
      if (!q) return;
      const found = membersCache.find(m => m.name.toLowerCase().includes(q.toLowerCase()));
      if (!found) return alert("Tidak ditemukan");
      if (participants.find(p => p.member_id === found.id)) return alert("Sudah ada");
      participants.push({ member_id: found.id, name: found.name, role: found.role, presence: "Hadir" });
      renderParticipants();
    };

    function renderParticipants() {
      document.getElementById("participants").innerHTML = participants.map((p, i) => `
        <div class="item-card" style="margin-bottom:8px; padding:10px; display:flex; justify-content:space-between; align-items:center;">
          <div><b>${p.name}</b><br><small>${p.role}</small></div>
          <div style="display:flex; gap:8px;">
            <select class="field" style="padding:4px;" onchange="participants[${i}].presence = this.value">
              <option>Hadir</option><option>Izin</option><option>Sakit</option><option>Alpa</option>
            </select>
            <button class="btn-danger" style="padding:4px 8px;" onclick="participants.splice(${i},1); renderParticipants();">×</button>
          </div>
        </div>`).join("");
    }

    // Logika Kompres Foto (dari kode lama Anda)
    document.getElementById("photos").onchange = async (e) => {
      photoB64 = [];
      photoPreview.innerHTML = "";
      const files = Array.from(e.target.files).slice(0, 4);
      for (const f of files) {
        const b64 = await compressImage(f, 1280, 0.7);
        photoB64.push(b64);
        const img = document.createElement("img");
        img.src = b64;
        img.style = "width:70px; height:70px; object-fit:cover; border-radius:8px;";
        photoPreview.appendChild(img);
      }
    };

    function compressImage(file, maxW, quality) {
      return new Promise((res) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = () => img.src = reader.result;
        img.onload = () => {
          const scale = Math.min(1, maxW / img.width);
          const c = document.createElement("canvas");
          c.width = img.width * scale; c.height = img.height * scale;
          const ctx = c.getContext("2d");
          ctx.drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL("image/jpeg", quality));
        };
        reader.readAsDataURL(file);
      });
    }

    // LOGIKA SIMPAN HYBRID
    document.getElementById("saveBtn").onclick = async () => {
      msgEl.textContent = "";
      if (!activitySel.value || !participants.length) return alert("Data belum lengkap");

      const btn = document.getElementById("saveBtn");
      btn.disabled = true;

      try {
        // A. TAHAP 1: Generate PDF via Google Apps Script (Metode 2)
        msgEl.textContent = "Tahap 1: Membuat PDF di Google Drive...";
        const headerData = {
          activity_id: activitySel.value,
          activity_name: activitySel.options[activitySel.selectedIndex].text,
          date: dateEl.value,
          time_start: document.getElementById("timeStart").value,
          time_end: document.getElementById("timeEnd").value,
          location: document.getElementById("locationCustom").value,
          note: document.getElementById("note").value
        };

        const gasRes = await apiPost("createAttendanceSession", {
          header: headerData,
          participants: participants,
          photos: photoB64
        });

        if (!gasRes || !gasRes.pdf_fileId) throw new Error("Gagal mendapatkan ID PDF dari Drive");
        const pdfId = gasRes.pdf_fileId;

        // B. TAHAP 2: Simpan Data ke Supabase
        msgEl.textContent = "Tahap 2: Menyimpan data ke Supabase...";
        const att_id = `ATT-${new Date().getTime()}`;

        // Simpan Header
        const { error: errH } = await supabaseClient.from('attendance_header').insert([{
          id: att_id,
          activity_id: headerData.activity_id,
          activity_name_snapshot: headerData.activity_name,
          date: headerData.date,
          time_start: headerData.time_start,
          time_end: headerData.time_end,
          location_snapshot: headerData.location,
          note: headerData.note,
          pdf_file_id: pdfId // Menyimpan referensi ke Google Drive
        }]);
        if (errH) throw errH;

        // Simpan Detail Peserta
        const details = participants.map(p => ({
          attendance_id: att_id,
          member_id: p.member_id,
          member_name_snapshot: p.name,
          member_role_snapshot: p.role,
          presence: p.presence
        }));
        const { error: errD } = await supabaseClient.from('attendance_detail').insert(details);
        if (errD) throw errD;

        msgEl.style.color = "green";
        msgEl.textContent = "Berhasil! PDF tersimpan di Drive & Data tercatat di Supabase.";

        document.getElementById("after").style.display = "block";
        document.getElementById("pdfLink").href = `https://drive.google.com/file/d/${pdfId}/view`;

      } catch (e) {
        msgEl.style.color = "red";
        msgEl.textContent = "Gagal: " + e.message;
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>

</html>
