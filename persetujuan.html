<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gabku App – Persetujuan Akun</title>

  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .pending-row {
      background: white;
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }

    .pending-name {
      font-weight: 800;
      font-size: 16px;
      color: var(--text-main);
    }

    .pending-email {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .form-approve {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  </style>
</head>

<body>

  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html" aria-label="Kembali">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg>
          </a>
          <div class="header-text">
            <div class="app-name">Persetujuan Akun</div>
            <div class="app-subtitle">Kelola pendaftaran user baru</div>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main" style="padding-bottom: 40px;">
      <div id="loading" class="text-center py-5">
        <p class="text-muted">Memuat antrean...</p>
      </div>

      <div id="emptyState" class="text-center py-5" style="display: none;">
        <div style="font-size: 48px;">✨</div>
        <p class="text-muted mt-3">Tidak ada akun yang menunggu persetujuan.</p>
      </div>

      <div id="pendingList"></div>
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>

  <script src="assets/js/persetujuan.js"></script>

  <!-- Custom Confirm Modal -->
  <div id="customConfirm" class="modal-overlay" style="display:none;">
    <div class="modal-card text-center">
      <h3 class="mt-0 text-base font-bold" id="confirmTitle">Peringatan</h3>
      <p id="confirmMsg" class="text-sm text-muted mb-5"></p>
      <div class="flex justify-center gap-3">
        <button id="confirmBtnNo" class="btn-primary">Batal</button>
        <button id="confirmBtnYes" class="btn-danger">Ya, Lanjutkan</button>
      </div>
    </div>
  </div>

</body>

</html>
