<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gabku App – Manajemen User</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .section-header {
      margin: 24px 0 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title-text {
      font-size: 14px;
      font-weight: 800;
      color: var(--brand-600);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* PENDING CARDS */
    .pending-card {
      background: #fdf2f2;
      /* Subtle red bg for attention */
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 16px;
      border: 1.5px dashed #fca5a5;
      box-shadow: var(--shadow-sm);
    }

    .pending-info {
      margin-bottom: 12px;
    }

    .pending-name {
      font-weight: 800;
      font-size: 16px;
      color: var(--text-main);
    }

    .pending-email {
      font-size: 12px;
      color: var(--text-muted);
    }

    .pending-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    /* USER LIST CARDS */
    .user-card {
      background: white;
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .user-info {
      display: flex;
      align-items: start;
      gap: 12px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .user-details {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-weight: 800;
      font-size: 15px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-email {
      font-size: 12px;
      color: var(--text-muted);
    }

    .user-badges {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-role {
      background: #e0f2fe;
      color: #0369a1;
    }

    .badge-status {
      background: #fef9c3;
      color: #854d0e;
    }

    .badge-status.aktif {
      background: #dcfce7;
      color: #166534;
    }

    .badge-status.nonaktif {
      background: #fee2e2;
      color: #991b1b;
    }

    .actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html" aria-label="Kembali">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg>
          </a>
          <div class="header-text">
            <div class="app-name">Manajemen User</div>
            <div class="app-subtitle">Kelola akses & verifikasi pendaftar</div>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main" style="padding-bottom: 60px;">

      <!-- SECTION: PENDING APPROVAL -->
      <div id="pendingSection" style="display:none;">
        <div class="section-header">
          <div class="section-title-text">⏳ Antrean Persetujuan</div>
        </div>
        <div id="pendingList"></div>
      </div>

      <!-- SECTION: ALL USERS -->
      <div class="section-header">
        <div class="section-title-text">👥 Semua Pengguna</div>
      </div>

      <div class="search-bar mb-4">
        <input type="text" id="searchInput" class="field" placeholder="Cari nama atau email..." />
      </div>

      <div id="loading" class="text-center py-5">
        <p class="text-muted">Memuat data pengguna...</p>
      </div>

      <div id="userList"></div>
    </main>

    <!-- Modal Edit User -->
    <div id="editModal" class="modal-overlay" onclick="closeEditModal()">
      <div class="modal-card" onclick="event.stopPropagation()">
        <h3 class="mt-0 text-base font-bold">Edit Akses User</h3>
        <p class="text-xs text-muted mb-4" id="editEmail"></p>

        <input type="hidden" id="editUserId" />

        <div class="mb-4">
          <label class="text-xs font-bold text-muted uppercase">Role</label>
          <select class="field mt-1" id="editRole">
            <option value="atlet">Atlet</option>
            <option value="pelatih">Pelatih</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div id="memberBox" class="mb-5">
          <label class="text-xs font-bold text-muted uppercase">Link ke Data Anggota (Wajib)</label>
          <select class="field mt-1" id="editMemberId">
            <option value="">-- Pilih Profil Anggota --</option>
          </select>
        </div>

        <button class="btn-primary btn-wide mb-3" onclick="saveAkses()">Simpan Perubahan</button>
        <button class="btn-secondary btn-wide" onclick="closeEditModal()">Batal</button>
      </div>
    </div>

    <!-- Modal Reset Password -->
    <div id="passwordModal" class="modal-overlay" onclick="closePasswordModal()">
      <div class="modal-card" onclick="event.stopPropagation()">
        <h3 class="mt-0 text-base font-bold">Setel Sandi Baru</h3>
        <p class="text-xs text-muted mb-4" id="pwEmail"></p>

        <div class="mb-5">
          <label class="text-xs font-bold text-muted uppercase">Password Baru</label>
          <input type="text" class="field mt-1" id="newPassword" placeholder="Masukkan sandi baru..." />
        </div>

        <button class="btn-primary btn-wide mb-3" onclick="submitResetPassword()">Update Sandi Sekarang</button>
        <button class="btn-secondary btn-wide" onclick="closePasswordModal()">Batal</button>
      </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="customConfirm" class="modal-overlay" style="display:none;">
      <div class="modal-card text-center">
        <h3 class="mt-0 text-base font-bold" id="confirmTitle">Peringatan</h3>
        <p id="confirmMsg" class="text-sm text-muted mb-5"></p>
        <div class="flex justify-center gap-3">
          <button id="confirmBtnNo" class="btn-primary">Batal</button>
          <button id="confirmBtnYes" class="btn-danger">Ya, Lanjutkan</button>
        </div>
      </div>
    </div>

  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>

  <script src="assets/js/manajemen-user.js"></script>
</body>

</html>
