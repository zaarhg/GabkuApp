<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kelola Kegiatan</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html"><svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg></a>
          <div class="header-text">
            <div class="app-name">Kelola Kegiatan</div>
            <div class="app-subtitle">Tambah, edit, hapus kegiatan</div>
          </div>
        </div>
        <button class="btn-ghost" id="refreshBtn"><svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 1 1-9.58-2H5.26A7 7 0 1 0 12 6z" />
          </svg></button>
      </div>
    </header>

    <main class="app-main">
      <section class="section-card" style="margin-top:0;">
        <div class="section-title">Tambah Kegiatan</div>
        <label class="field-label" for="activityName">Nama kegiatan</label>
        <input id="activityName" type="text" class="field" placeholder="Contoh: Latihan rutin / Rapat" />
        <div class="row-actions">
          <button id="addBtn" class="btn-primary" type="button">Simpan</button>
        </div>
        <p id="msg" class="tool-msg" style="margin-top:10px;"></p>
      </section>

      <section class="section-card">
        <div class="row-between">
          <div class="section-title" style="margin:0;">List Kegiatan Aktif</div>
          <span class="pill" id="countPill" style="display:none;"></span>
        </div>
        <div id="list" style="margin-top:12px;"></div>
      </section>
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    (async () => { await requireLogin(); load(); })();

    const listEl = document.getElementById("list");
    const msgEl = document.getElementById("msg");
    const countPill = document.getElementById("countPill");

    function escapeHtml(s) { return String(s || '').replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;"); }

    async function load() {
      listEl.innerHTML = "<p class='muted'>Memuat...</p>";
      countPill.style.display = "none";
      try {
        const { data, error } = await supabaseClient.from('activities').select('*').eq('is_active', true).order('name');
        if (error) throw error;

        if (!data.length) return listEl.innerHTML = "<p class='muted'>Belum ada kegiatan.</p>";

        countPill.textContent = data.length + " item";
        countPill.style.display = "inline-flex";

        listEl.innerHTML = data.map(r => `
          <div class="item-card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <div class="item-left">
              <div style="font-weight:bold;">${escapeHtml(r.name)}</div>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="btn-secondary" style="padding:4px 10px; font-size:12px;" onclick="editActivity('${r.id}', '${escapeHtml(r.name)}')">Edit</button>
              <button class="btn-danger" style="padding:4px 10px; font-size:12px; background:#fee2e2; color:#b91c1c; border:none; border-radius:6px;" onclick="deleteActivity('${r.id}', '${escapeHtml(r.name)}')">Hapus</button>
            </div>
          </div>
        `).join("");
      } catch (e) { listEl.innerHTML = `<p class='msg'>Gagal load: ${e.message}</p>`; }
    }

    document.getElementById("addBtn").onclick = async () => {
      const name = document.getElementById("activityName").value.trim();
      msgEl.textContent = "";
      if (!name) return msgEl.textContent = "Nama wajib diisi.";

      try {
        msgEl.textContent = "Menyimpan...";
        const id = `ACT-${new Date().toISOString().replace(/[-T:]/g, '').split('.')[0]}-${Math.floor(1000 + Math.random() * 9000)}`;
        const { error } = await supabaseClient.from('activities').insert([{ id, name }]);
        if (error) throw error;
        msgEl.textContent = "Berhasil!";
        document.getElementById("activityName").value = "";
        await load();
      } catch (e) { msgEl.textContent = "Gagal: " + e.message; }
    };

    // FUNGSI EDIT
    window.editActivity = async (id, currentName) => {
      const newName = prompt("Edit nama kegiatan:", currentName);
      if (!newName || newName.trim() === "") return;
      try {
        const { error } = await supabaseClient.from('activities').update({ name: newName.trim() }).eq('id', id);
        if (error) throw error;
        load();
      } catch (e) { alert("Gagal update: " + e.message); }
    };

    // FUNGSI HAPUS (Soft Delete)
    window.deleteActivity = async (id, currentName) => {
      if (!confirm(`Hapus kegiatan "${currentName}"?`)) return;
      try {
        const { error } = await supabaseClient.from('activities').update({ is_active: false }).eq('id', id);
        if (error) throw error;
        load();
      } catch (e) { alert("Gagal hapus: " + e.message); }
    };

    document.getElementById("refreshBtn").onclick = load;
  </script>
</body>

</html>
