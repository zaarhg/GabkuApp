<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kelola Kegiatan</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html" aria-label="Kembali" title="Kembali">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg>
          </a>
          <div class="header-text">
            <div class="app-name">Kelola Kegiatan</div>
            <div class="app-subtitle">Tambah & edit daftar kegiatan</div>
          </div>
        </div>
        <button class="btn-ghost" id="refreshBtn" type="button" aria-label="Refresh" title="Refresh">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 1 1-9.58-2H5.26A7 7 0 1 0 12 6z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="app-main">
      <section class="section-card" style="margin-top:0;">
        <div class="section-title">Tambah Kegiatan</div>
        <label class="field-label" for="activityName">Nama kegiatan</label>
        <input id="activityName" type="text" class="field" placeholder="Contoh: Latihan rutin / Rapat" />
        <div class="row-actions">
          <button id="addBtn" class="btn-primary" type="button">Simpan</button>
          <button class="btn-secondary" type="button"
            onclick="document.getElementById('activityName').value='';">Batal</button>
        </div>
        <p id="msg" class="tool-msg" style="margin-top:10px;"></p>
      </section>

      <section class="section-card">
        <div class="row-between">
          <div class="section-title" style="margin:0;">List Kegiatan Aktif</div>
          <span class="pill" id="countPill" style="display:none;"></span>
        </div>
        <div id="list" style="margin-top:12px;"></div>
      </section>
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    (async () => {
      await requireLogin();
      load();
    })();

    const listEl = document.getElementById("list");
    const msgEl = document.getElementById("msg");
    const countPill = document.getElementById("countPill");

    async function load() {
      listEl.innerHTML = "<p class='muted'>Memuat...</p>";
      countPill.style.display = "none";
      try {
        const { data, error } = await supabaseClient
          .from('activities')
          .select('*')
          .eq('is_active', true)
          .order('name', { ascending: true });

        if (error) throw error;

        if (!data.length) {
          listEl.innerHTML = "<p class='muted'>Belum ada kegiatan.</p>";
          return;
        }

        countPill.textContent = data.length + " item";
        countPill.style.display = "inline-flex";

        listEl.innerHTML = data.map(r => `
          <div class="item-card">
            <div class="item-left">
              <div class="item-title">${escapeHtml(r.name)}</div>
              <div class="item-sub">ID: ${escapeHtml(String(r.id))}</div>
            </div>
            <button class="btn-mini" onclick="editPrompt('${escapeHtml(String(r.id))}','${escapeHtml(String(r.name))}')" type="button">
              Edit
            </button>
          </div>
        `).join("");
      } catch (e) {
        listEl.innerHTML = `<p class='msg'>Gagal load: ${e.message}</p>`;
      }
    }

    async function add() {
      const name = document.getElementById("activityName").value.trim();
      msgEl.textContent = "";
      if (!name) { msgEl.textContent = "Nama kegiatan wajib diisi."; return; }

      try {
        msgEl.textContent = "Menyimpan...";

        const now = new Date();
        const ts = now.toISOString().replace(/[-T:]/g, '').split('.')[0];
        const activity_id = `ACT-${ts}-${Math.floor(1000 + Math.random() * 9000)}`;

        const { error } = await supabaseClient
          .from('activities')
          .insert([{ id: activity_id, name: name }]);

        if (error) throw error;

        msgEl.textContent = "Berhasil ditambahkan.";
        document.getElementById("activityName").value = "";
        await load();
      } catch (e) {
        msgEl.textContent = "Gagal: " + e.message;
      }
    }

    async function editPrompt(id, currentName) {
      const newName = prompt("Edit nama kegiatan:", currentName);
      if (!newName || newName.trim() === "") return;

      try {
        const { error } = await supabaseClient
          .from('activities')
          .update({ name: newName.trim() })
          .eq('id', id);

        if (error) throw error;
        await load();
      } catch (e) {
        alert("Gagal update: " + e.message);
      }
    }

    function escapeHtml(s) {
      return String(s).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }

    document.getElementById("addBtn").addEventListener("click", add);
    document.getElementById("refreshBtn").addEventListener("click", load);
  </script>
</body>

</html>
