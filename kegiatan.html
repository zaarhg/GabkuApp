<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kelola Kegiatan</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1590df">
  <link rel="icon" type="image/png" href="assets/img/favicon-50.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Member Picker Modal */
    #memberPickerModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }

    #memberPickerModal.show {
      display: flex;
    }

    .picker-box {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      width: 92%;
      max-width: 400px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .picker-title {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
    }

    #kegiatanPickerSearch {
      border-radius: 8px;
      border: 1.5px solid #e2e8f0;
      padding: 9px 12px;
      font-size: 13px;
      width: 100%;
      box-sizing: border-box;
    }

    #kegiatanPickerSearch:focus {
      outline: none;
      border-color: #1590df;
    }

    .picker-list {
      overflow-y: auto;
      flex: 1;
    }

    .picker-item {
      display: flex;
      align-items: center;
      padding: 10px 8px;
      border-radius: 8px;
      cursor: pointer;
      gap: 10px;
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s;
    }

    .picker-item:hover {
      background: #f0f9ff;
    }

    .picker-item.selected {
      background: #eff6ff;
    }

    .picker-item.disabled {
      opacity: 0.45;
      cursor: default;
      pointer-events: none;
    }

    .picker-item-name {
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
    }

    .picker-item-role {
      font-size: 11px;
      color: #64748b;
    }

    .picker-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .picker-item.selected .picker-check {
      background: #1590df;
      border-color: #1590df;
      color: #fff;
      font-size: 12px;
    }

    .picker-actions {
      display: flex;
      gap: 8px;
    }

    .picker-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .picker-cancel {
      background: #f1f5f9;
      color: #64748b;
    }

    .picker-ok {
      background: #1590df;
      color: #fff;
    }
  </style>

</head>

<body>

  <div class="app">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-left">
          <a class="icon-back" href="index.html"><svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor"
                d="M15.5 19a1 1 0 0 1-.7-.29l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 1 1 1.4 1.42L11.62 12l4.58 4.58A1 1 0 0 1 15.5 19z" />
            </svg></a>
          <div class="header-text">
            <div class="app-name">Kelola Kegiatan</div>
            <div class="app-subtitle">Tambah, edit, hapus kegiatan</div>
          </div>
        </div>
        <button class="btn-ghost list-icon" id="refreshBtn" aria-label="Refresh" title="Refresh">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 1 1-9.58-2H5.26A7 7 0 1 0 12 6z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="app-main">
      <section class="section-card mt-0 flex justify-center items-center text-primary font-bold admin-only"
        id="toggleAddActivityBtn"
        style="padding:16px; background:var(--brand-50); cursor:pointer; border:1.5px solid var(--brand-100); border-radius:12px; transition:all 0.2s; box-shadow:0 4px 12px rgba(37, 99, 235, 0.08);">
        <span class="text-sm">+ Tambah Kegiatan Baru</span>
      </section>

      <section class="section-card mt-0" id="addActivityForm" style="display:none;">
        <div class="row-between">
          <div class="section-title m-0">Tambah Kegiatan</div>
          <button class="btn-ghost text-xl p-0" id="cancelAddActivityBtn">&times;</button>
        </div>

        <label class="field-label mt-3" for="activityName">Nama kegiatan</label>
        <input id="activityName" type="text" class="field mb-3" placeholder="Contoh: Latihan rutin / Rapat" />

        <label class="field-label">Kategori Kegiatan</label>
        <div class="radio-group mb-3" id="activityCategoryGroup">
          <div class="radio-btn active" data-val="Latihan">Latihan</div>
          <div class="radio-btn" data-val="Kegiatan Lain">Kegiatan Lainnya</div>
        </div>
        <input type="hidden" id="activityCategory" value="Latihan" />

        <label class="field-label mt-3" for="activityLocation">Tempat Default (Opsional)</label>
        <select id="activityLocSel" class="field mb-2"
          onchange="document.getElementById('activityLocation').style.display = this.value === 'Lainnya' ? 'block' : 'none';"></select>
        <input id="activityLocation" type="text" class="field mb-3" style="display:none;"
          placeholder="Ketik tempat manual..." />

        <label class="field-label mt-3">Rentang Tanggal (Opsional)</label>
        <div class="flex gap-2 mb-3">
          <div class="flex-1">
            <label class="text-xs text-muted mb-1 block">Mulai</label>
            <input id="activityStartD" type="date" class="field" />
          </div>
          <div class="flex-1">
            <label class="text-xs text-muted mb-1 block">Sampai</label>
            <input id="activityEndD" type="date" class="field" />
          </div>
        </div>

        <div class="row-between mt-3 mb-2">
          <label class="field-label m-0">List Peserta Default</label>
          <button class="btn-secondary" id="addPartBtn" type="button"
            style="padding:8px 32px; height:auto; width:auto; font-size:13px; border-radius:8px;">Tambah</button>
        </div>
        <div id="addPartList" class="flex-col gap-2 mb-4"></div>

        <div class="mt-4">
          <button id="addBtn" class="btn-primary" type="button" style="width:100%;">Simpan Kegiatan</button>
        </div>
        <p id="msg" class="tool-msg text-center mt-3"></p>
      </section>

      <section class="section-card">
        <div class="row-between">
          <div class="section-title m-0">List Kegiatan Aktif</div>
          <span class="badge badge-primary" id="countPill" style="display:none;"></span>
        </div>
        <div id="list" class="mt-3 flex-col gap-2"></div>
      </section>

      <!-- Custom Modals -->
      <div id="customConfirm" class="modal-overlay" style="display:none;">
        <div class="modal-card text-center">
          <h3 class="mt-0 text-base font-bold" id="confirmTitle">Peringatan</h3>
          <p id="confirmMsg" class="text-sm text-muted mb-5"></p>
          <div class="flex justify-center gap-3">
            <button id="confirmBtnNo" class="btn-secondary">Batal</button>
            <button id="confirmBtnYes" class="btn-primary">Ya, Lanjutkan</button>
          </div>
        </div>
      </div>

      <!-- Member Picker Modal -->
      <div id="memberPickerModal" class="modal-overlay">
        <div class="modal-card flex-col gap-3" style="max-height:80vh;">
          <div class="text-base font-bold">Pilih Anggota</div>
          <input id="kegiatanPickerSearch" class="field" placeholder="Cari nama anggota…"
            oninput="filterMemberList(this.value)">
          <div class="picker-list flex-1 overflow-y-auto" id="kegiatanPickerList"></div>
          <div class="flex gap-2 w-full mt-2">
            <button class="btn-secondary flex-1" onclick="closeMemberPicker()">Batal</button>
            <button class="btn-primary flex-1" onclick="confirmMemberPicker()">Tambah</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Modal Edit -->
    <div id="editModal" class="modal-overlay" style="display:none;">
      <div class="modal-card">
        <div class="section-title mt-0">Edit Kegiatan</div>
        <input type="hidden" id="editId" />

        <label class="field-label mt-3" for="editName">Nama kegiatan</label>
        <input id="editName" type="text" class="field mb-3" />

        <label class="field-label">Kategori Kegiatan</label>
        <div class="radio-group mb-3" id="editCategoryGroup">
          <div class="radio-btn" data-val="Latihan">Latihan</div>
          <div class="radio-btn" data-val="Kegiatan Lain">Kegiatan Lainnya</div>
        </div>
        <input type="hidden" id="editCategory" value="Kegiatan Lain" />

        <label class="field-label mt-3" for="editLocation">Tempat Default</label>
        <select id="editLocSel" class="field mb-3"
          onchange="document.getElementById('editLocation').style.display = this.value === 'Lainnya' ? 'block' : 'none';"></select>
        <input id="editLocation" type="text" class="field mb-3" style="display:none;"
          placeholder="Ketik tempat manual..." />

        <label class="field-label mt-3">Rentang Tanggal</label>
        <div class="flex gap-2 mb-3">
          <input id="editStartD" type="date" class="field flex-1" />
          <input id="editEndD" type="date" class="field flex-1" />
        </div>

        <div class="row-between mt-3 mb-2">
          <label class="field-label m-0">Peserta Default</label>
          <button class="btn-secondary" onclick="addEditParticipant()" type="button"
            style="padding:8px 32px; height:auto; width:auto; font-size:13px; border-radius:8px;">Tambah</button>
        </div>
        <div id="editPartList" class="flex-col gap-2 mb-4"></div>

        <div class="flex justify-end gap-3 mt-4"
          style="position: sticky; bottom: -24px; background: var(--surface); padding: 16px 24px; margin: 0 -24px -24px -24px; border-top: 1px solid var(--border-light); border-radius: 0 0 var(--radius-lg) var(--radius-lg); z-index: 10;">
          <button class="btn-secondary" onclick="closeEditModal()">Batal</button>
          <button class="btn-primary" onclick="saveEdit()">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    const listEl = document.getElementById("list");
    const msgEl = document.getElementById("msg");
    const countPill = document.getElementById("countPill");

    let membersCache = [];
    let activitiesCache = [];
    let addParticipants = [];
    let editParticipants = [];
    let locationOpts = [];

    async function initOptions() {
      const { data } = await supabaseClient.from('app_settings').select('*').eq('setting_key', 'location_options').single();
      if (data && data.setting_value) {
        locationOpts = Array.isArray(data.setting_value) ? data.setting_value : JSON.parse(data.setting_value);
      }
      let optsHtml = `<option value="">— pilih tempat (opsional) —</option>` + locationOpts.map(l => `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join('');
      optsHtml += `<option value="Lainnya">Lainnya...</option>`;
      document.getElementById('activityLocSel').innerHTML = optsHtml;
      document.getElementById('editLocSel').innerHTML = optsHtml;
    }

    async function initMembers() {
      if (membersCache.length === 0) {
        const { data } = await supabaseClient.from('members').select('*').eq('is_active', true).order('name');
        if (data) membersCache = data;
      }
    }

    (async () => { await requireLogin(); await initMembers(); await initOptions(); load(); })();

    function escapeHtml(s) { return String(s || '').replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;"); }

    function asyncConfirm(msg, title = "Peringatan") {
      return new Promise((resolve) => {
        const modal = document.getElementById("customConfirm");
        document.getElementById("confirmTitle").textContent = title;
        document.getElementById("confirmMsg").textContent = msg;
        document.getElementById("confirmBtnNo").style.display = 'block';
        modal.style.display = 'flex';

        document.getElementById("confirmBtnYes").onclick = () => { modal.style.display = 'none'; resolve(true); };
        document.getElementById("confirmBtnNo").onclick = () => { modal.style.display = 'none'; resolve(false); };
      });
    }

    function asyncAlert(msg, title = "Informasi") {
      return new Promise((resolve) => {
        const modal = document.getElementById("customConfirm");
        document.getElementById("confirmTitle").textContent = title;
        document.getElementById("confirmMsg").textContent = msg;
        document.getElementById("confirmBtnNo").style.display = 'none';
        modal.style.display = 'flex';

        document.getElementById("confirmBtnYes").onclick = () => { modal.style.display = 'none'; resolve(true); };
      });
    }

    /* ── Member Picker ── */
    let _pickerTargetArr = null;
    let _pickerRenderFn = null;
    let _kegPickerTemp = new Set();

    function openMemberPicker(targetArr, renderFn) {
      _pickerTargetArr = targetArr;
      _pickerRenderFn = renderFn;
      _kegPickerTemp = new Set(); // mulai bersih; yang sudah ada = disabled
      document.getElementById('kegiatanPickerSearch').value = '';
      filterMemberList('');
      document.getElementById('memberPickerModal').classList.add('show');
      document.getElementById('kegiatanPickerSearch').focus();
    }

    function closeMemberPicker() {
      document.getElementById('memberPickerModal').classList.remove('show');
      _pickerTargetArr = null;
      _pickerRenderFn = null;
    }

    function filterMemberList(q) {
      const pool = q.trim()
        ? membersCache.filter(m => m.name.toLowerCase().includes(q.toLowerCase()))
        : membersCache;
      const alreadyIn = new Set((_pickerTargetArr || []).map(p => p.member_id));
      const el = document.getElementById('kegiatanPickerList');
      el.innerHTML = pool.map(m => {
        const inList = alreadyIn.has(m.id);
        const checked = inList || _kegPickerTemp.has(m.id);
        return `
          <div class="picker-item${checked ? ' selected' : ''}${inList ? ' disabled' : ''}" onclick="toggleMemberItem('${m.id}',this)">
            <div class="picker-check">${checked ? '✓' : ''}</div>
            <div>
              <div class="picker-item-name">${escapeHtml(m.name)}</div>
              <div class="picker-item-role">${escapeHtml(m.role || '')}${inList ? ' · sudah ditambahkan' : ''}</div>
            </div>
          </div>`;
      }).join('');
    }

    function toggleMemberItem(id, el) {
      const alreadyIn = new Set((_pickerTargetArr || []).map(p => p.member_id));
      if (alreadyIn.has(id)) return;
      if (_kegPickerTemp.has(id)) { _kegPickerTemp.delete(id); }
      else { _kegPickerTemp.add(id); }
      el.classList.toggle('selected');
      el.querySelector('.picker-check').textContent = _kegPickerTemp.has(id) ? '✓' : '';
    }

    function confirmMemberPicker() {
      if (!_pickerTargetArr || !_pickerRenderFn) return;
      _kegPickerTemp.forEach(id => {
        const m = membersCache.find(x => x.id === id);
        if (!m || _pickerTargetArr.find(p => p.member_id === id)) return;
        _pickerTargetArr.push({ member_id: m.id, name: m.name, role: m.role || '' });
      });
      _pickerTargetArr.sort((a, b) => a.name.localeCompare(b.name));
      _pickerRenderFn();
      closeMemberPicker();
    }

    document.getElementById('memberPickerModal').addEventListener('click', e => {
      if (e.target === document.getElementById('memberPickerModal')) closeMemberPicker();
    });

    // RENDER PARTICIPANTS UNTUK TAMBAH
    function renderAddParts() {
      document.getElementById("addPartList").innerHTML = addParticipants.map((p, i) => `
        <div class="list-item rounded-lg bg-gray-50 p-2">
          <div class="list-content m-0">
            <div class="font-bold text-sm text-main">${escapeHtml(p.name)}</div>
            <div class="text-xs text-muted mt-1">${escapeHtml(p.role)}</div>
          </div>
          <button class="flex items-center justify-center" style="width: 28px; height: 28px; border-radius: 50%; border: none; background: #fee2e2; color: #ef4444; cursor: pointer; transition: transform 0.15s ease;" onmousedown="this.style.transform='scale(0.85)';" onmouseup="this.style.transform='scale(1)';" onmouseleave="this.style.transform='scale(1)';" onclick="addParticipants.splice(${i},1); renderAddParts();" type="button" aria-label="Hapus">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
          </button>
        </div>`).join("");
    }

    document.getElementById("addPartBtn").onclick = () => openMemberPicker(addParticipants, renderAddParts);

    // RENDER PARTICIPANTS UNTUK EDIT
    function renderEditParts() {
      document.getElementById("editPartList").innerHTML = editParticipants.map((p, i) => `
        <div class="list-item rounded-lg bg-gray-50 p-2">
          <div class="list-content m-0">
            <div class="font-bold text-sm text-main">${escapeHtml(p.name)}</div>
            <div class="text-xs text-muted mt-1">${escapeHtml(p.role)}</div>
          </div>
          <button class="flex items-center justify-center" style="width: 28px; height: 28px; border-radius: 50%; border: none; background: #fee2e2; color: #ef4444; cursor: pointer; transition: transform 0.15s ease;" onmousedown="this.style.transform='scale(0.85)';" onmouseup="this.style.transform='scale(1)';" onmouseleave="this.style.transform='scale(1)';" onclick="editParticipants.splice(${i},1); renderEditParts();" type="button" aria-label="Hapus">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
          </button>
        </div>`).join("");
    }

    window.addEditParticipant = () => openMemberPicker(editParticipants, renderEditParts);

    document.getElementById("toggleAddActivityBtn").onclick = () => {
      document.getElementById("toggleAddActivityBtn").style.display = "none";
      document.getElementById("addActivityForm").style.display = "block";
      document.getElementById("activityName").focus();
    };
    document.getElementById("cancelAddActivityBtn").onclick = () => {
      document.getElementById("addActivityForm").style.display = "none";
      document.getElementById("toggleAddActivityBtn").style.display = "flex";
      msgEl.textContent = "";
    };

    async function load() {
      listEl.innerHTML = "<p class='muted'>Memuat...</p>";
      countPill.style.display = "none";
      try {
        const { data, error } = await supabaseClient.from('activities').select('*').eq('is_active', true).order('name');
        if (error) throw error;

        activitiesCache = data || [];

        if (!activitiesCache.length) return listEl.innerHTML = "<p class='muted'>Belum ada kegiatan.</p>";

        countPill.textContent = activitiesCache.length + " item";
        countPill.style.display = "inline-flex";

        listEl.innerHTML = activitiesCache.map(r => `
          <div class="list-item">
            <div class="list-content ml-0">
              <div class="list-title mb-1">${escapeHtml(r.name)}</div>
              ${r.category === 'Latihan' ? `<span class="badge badge-success mb-1">Latihan</span>` : `<span class="badge badge-neutral mb-1">Kegiatan Lain</span>`}
              ${r.location ? `<div class="text-xs text-muted mt-1">📍 ${escapeHtml(r.location)}</div>` : ''}
              ${r.start_date ? `<div class="text-xs text-muted mt-1">🗓️ ${r.start_date} s/d ${r.end_date || '?'}</div>` : ''}
              ${r.default_participants && r.default_participants.length ? `<div class="text-xs text-muted mt-1">👥 ${r.default_participants.length} peserta default</div>` : ''}
            </div>
            <div class="flex gap-2">
              <button class="btn-secondary admin-only" style="padding:6px 12px; height:auto; width:auto; font-size:12px; border-radius:6px;" onclick="editActivity('${r.id}')">Edit</button>
              <button class="btn-delete admin-only" style="padding:6px 12px; height:auto; width:auto; font-size:12px; border-radius:6px;" onclick="deleteActivity('${r.id}', '${escapeHtml(r.name)}')">Hapus</button>
            </div>
          </div>
        `).join("");
      } catch (e) { listEl.innerHTML = `<p class='msg text-center'>Gagal load: ${e.message}</p>`; }
    }

    const handleRadioSel = (groupId, inputId) => {
      document.querySelectorAll(`#${groupId} .radio-btn`).forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll(`#${groupId} .radio-btn`).forEach(b => {
            b.classList.remove('active');
          });
          btn.classList.add('active');
          const dt = btn.getAttribute('data-val');
          document.getElementById(inputId).value = dt;
        };
      });
    };
    handleRadioSel('activityCategoryGroup', 'activityCategory');
    handleRadioSel('editCategoryGroup', 'editCategory');

    document.getElementById("addBtn").onclick = async () => {
      const name = document.getElementById("activityName").value.trim();
      let locValRaw = document.getElementById("activityLocSel").value;
      const loc = locValRaw === 'Lainnya' ? document.getElementById("activityLocation").value.trim() : locValRaw;
      const cat = document.getElementById("activityCategory").value;
      const sd = document.getElementById("activityStartD").value;
      const ed = document.getElementById("activityEndD").value;

      msgEl.textContent = "";
      if (!name) return msgEl.textContent = "Nama wajib diisi.";
      if (name.toLowerCase() === 'latihan') {
        return await asyncAlert('Nama kegiatan tidak boleh dibiarkan hanya bernama "Latihan". Mohon tulis lebih spesifik dan unik, contoh: Latihan Gabungan, Latihan Rutin, dsb.', 'Hindari Ambiguitas');
      }

      try {
        msgEl.textContent = "Menyimpan...";
        const id = `ACT-${new Date().toISOString().replace(/[-T:]/g, '').split('.')[0]}-${Math.floor(1000 + Math.random() * 9000)}`;
        const payload = { id, name, category: cat };
        if (loc) payload.location = loc;
        if (sd) payload.start_date = sd;
        if (ed) payload.end_date = ed;
        if (addParticipants.length > 0) payload.default_participants = addParticipants;

        const { error } = await supabaseClient.from('activities').insert([payload]);
        if (error) throw error;
        msgEl.textContent = "Berhasil!";
        document.getElementById("activityName").value = "";
        document.getElementById("activityLocation").value = "";
        document.getElementById("activityLocSel").value = "";
        document.getElementById("activityLocation").style.display = "none";
        document.getElementById("activityCategory").value = "Kegiatan Lain";
        document.getElementById("activityStartD").value = "";
        document.getElementById("activityEndD").value = "";
        addParticipants = [];
        renderAddParts();
        document.getElementById("addActivityForm").style.display = "none";
        document.getElementById("toggleAddActivityBtn").style.display = "flex";
        await load();
      } catch (e) { msgEl.textContent = "Gagal: " + e.message; }
    };

    // FUNGSI EDIT
    window.editActivity = (id) => {
      const act = activitiesCache.find(a => a.id === id);
      if (!act) return;

      document.getElementById('editId').value = act.id;
      document.getElementById('editName').value = act.name || '';

      const locVal = act.location || '';
      if (locationOpts.includes(locVal) || !locVal) {
        document.getElementById('editLocSel').value = locVal;
        document.getElementById('editLocation').style.display = 'none';
        document.getElementById('editLocation').value = '';
      } else {
        document.getElementById('editLocSel').value = 'Lainnya';
        document.getElementById('editLocation').style.display = 'block';
        document.getElementById('editLocation').value = locVal;
      }

      const cVal = act.category || 'Kegiatan Lain';
      document.getElementById('editCategory').value = cVal;
      document.querySelectorAll('#editCategoryGroup .radio-btn').forEach(b => {
        b.classList.remove('active');
        if (b.getAttribute('data-val') === cVal) b.classList.add('active');
      });
      document.getElementById('editStartD').value = act.start_date || '';
      document.getElementById('editEndD').value = act.end_date || '';

      editParticipants = act.default_participants ? JSON.parse(JSON.stringify(act.default_participants)) : [];
      editParticipants.sort((a, b) => a.name.localeCompare(b.name));
      renderEditParts();

      document.getElementById('editModal').style.display = 'flex';
    };

    window.closeEditModal = () => {
      document.getElementById('editModal').style.display = 'none';
      document.getElementById('editId').value = '';
      document.getElementById('editName').value = '';
      document.getElementById('editLocation').value = '';
      document.getElementById('editLocSel').value = '';
      editParticipants = [];
    };

    window.saveEdit = async () => {
      const id = document.getElementById('editId').value;
      const newName = document.getElementById('editName').value.trim();
      let editLocRaw = document.getElementById("editLocSel").value;
      const newLoc = editLocRaw === 'Lainnya' ? document.getElementById('editLocation').value.trim() : editLocRaw;
      const cat = document.getElementById('editCategory').value;
      const sd = document.getElementById('editStartD').value;
      const ed = document.getElementById('editEndD').value;

      if (!newName) return await asyncAlert("Nama kegiatan wajib diisi!");
      if (newName.toLowerCase() === 'latihan') return await asyncAlert('Nama kegiatan tidak boleh dibiarkan hanya bernama "Latihan". Mohon tulis lebih spesifik dan unik, contoh: Latihan Mingguan, Latihan Gabungan.', 'Hindari Ambiguitas');

      try {
        const btn = document.querySelector('#editModal .btn-primary');
        const originalText = btn.textContent;
        btn.textContent = 'Menyimpan...';
        btn.disabled = true;

        const payload = {
          name: newName,
          location: newLoc || null,
          category: cat,
          start_date: sd || null,
          end_date: ed || null,
          default_participants: editParticipants.length > 0 ? editParticipants : null
        };

        const { error } = await supabaseClient.from('activities').update(payload).eq('id', id);
        if (error) throw error;

        closeEditModal();
        load();

        btn.textContent = originalText;
        btn.disabled = false;
      } catch (e) {
        await asyncAlert("Gagal update: " + e.message);
        const btn = document.querySelector('#editModal .btn-primary');
        btn.textContent = 'Simpan';
        btn.disabled = false;
      }
    };

    // FUNGSI HAPUS (Soft Delete)
    window.deleteActivity = async (id, currentName) => {
      const proceed = await asyncConfirm(`Hapus kegiatan "${currentName}"?`);
      if (!proceed) return;
      try {
        const { error } = await supabaseClient.from('activities').update({ is_active: false }).eq('id', id);
        if (error) throw error;
        load();
      } catch (e) { await asyncAlert("Gagal hapus: " + e.message); }
    };

    document.getElementById("refreshBtn").onclick = load;
  </script>
</body>

</html>
